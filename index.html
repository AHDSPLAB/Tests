hyperlipidaemia; Diabetes; Hypothyroidism\nDecreased Apo A1: Low HDL states; Tangier disease","src":"t"},{"aka":"Arylsulfatase A, Sulfatides","expl":"Measures the enzyme arylsulfatase A or the sulfatides that build up when it is deficient. These tests diagnose metachromatic leukodystrophy, an inherited disorder that damages the myelin of the nervous system.","abn":"Low enzyme activity / raised sulfatides: Metachromatic leukodystrophy; Pseudodeficiency (low enzyme but normal sulfatides)","src":"t"},{"aka":"Galactomannan, Beta-D-glucan","expl":"Detects fungal cell-wall components in blood: galactomannan (specific for Aspergillus) or beta-D-glucan (many fungi). They help diagnose invasive fungal infection in immunocompromised patients.","abn":"Positive result: Invasive aspergillosis; Other invasive fungal infection (beta-D-glucan, e.g., Candida, Pneumocystis); False positives with some antibiotics, IV immunoglobulin or haemodialysis","src":"t"},{"aka":"Anti-β2GPI","expl":"Detects IgG and IgM antibodies to beta-2 glycoprotein I. Together with anticardiolipin antibodies and lupus anticoagulant, they are the laboratory criteria for antiphospholipid syndrome.","abn":"Positive result (persistent): Antiphospholipid syndrome; Systemic lupus erythematosus; Transient after infection","src":"t"},{"aka":"Biotinidase activity","expl":"Measures biotinidase, the enzyme that recycles the vitamin biotin. Deficiency is part of newborn screening and causes seizures, skin rash and hair loss if untreated.","abn":"Decreased activity: Biotinidase deficiency (profound or partial)","src":"t"},{"aka":"BKV PCR","expl":"Measures BK polyomavirus DNA in blood. It is used to monitor kidney transplant patients, where rising viral load can lead to BK nephropathy and graft loss.","abn":"Rising viral load: BK virus nephropathy risk in kidney transplant recipients; Haemorrhagic cystitis after stem cell transplant","src":"t"},{"aka":"Pertussis toxin IgG","expl":"Detects antibodies to Bordetella pertussis toxin. A high level supports recent whooping cough, especially when cough has lasted several weeks and PCR is no longer positive.","abn":"Increased levels: Recent pertussis infection; Recent vaccination (within a year)","src":"t"},{"aka":"hs-CRP","expl":"Measures C-reactive protein at very low levels. In people without acute illness it estimates cardiovascular risk from low-grade inflammation.","abn":"Increased levels: Higher cardiovascular risk (above about 3 mg/L); Any acute infection or inflammation (repeat when well)","src":"t"},{"aka":"Individual complement components","expl":"Measures single complement proteins (such as C1q, C2, C5, C6, C7 or C9). They are used when total complement (CH50) is very low, to find an inherited deficiency.","abn":"Decreased levels: Inherited deficiency (C1q or C2: lupus-like disease; C5–C9: recurrent Neisseria infections); Consumption in immune-complex disease","src":"t"},{"aka":"Cd","expl":"Measures cadmium in blood or urine. Blood reflects recent exposure and urine reflects long-term body burden; chronic exposure damages the kidneys and bones.","abn":"Increased levels: Occupational exposure (batteries, metal plating, smelting); Cigarette smoking; Contaminated food or water","src":"t"},{"aka":"Urine ratio to creatinine","expl":"Measures a substance (protein, calcium, sodium or chloride) relative to creatinine in a spot urine sample, which corrects for urine concentration. It is a convenient estimate of daily excretion without a 24-hour collection.","abn":"Increased protein/creatinine: Proteinuria (kidney disease, nephrotic syndrome, pre-eclampsia)\nIncreased calcium/creatinine: Hypercalciuria (stone risk, hyperparathyroidism)","src":"t"},{"aka":"Candida antibodies","expl":"Detects antibodies to Candida albicans. Their value is limited, because many healthy people have them, but they may support invasive candidiasis alongside other tests.","abn":"Increased levels: Invasive or chronic candidiasis; Common in colonised or healthy people (low specificity)","src":"t"},{"aka":"C. auris screen","expl":"Culture of skin swabs (usually axilla and groin, sometimes nose) to detect carriage of Candida auris, a multidrug-resistant yeast that spreads in healthcare settings. Positive patients need isolation.","abn":"Positive result: Candida auris colonisation (infection-control precautions required)","src":"t"},{"aka":"CDT","expl":"Measures carbohydrate-deficient transferrin, a form of transferrin that increases with sustained heavy alcohol use. It is used to detect and monitor chronic alcohol misuse.","abn":"Increased levels: Sustained heavy alcohol intake (about 2 weeks or more); Congenital disorders of glycosylation; Severe liver disease","src":"t"},{"aka":"Free and total carnitine","expl":"Measures carnitine, which carries fatty acids into mitochondria for energy. Low levels occur in inherited carnitine defects and secondary to organic acidaemias, dialysis or valproate.","abn":"Decreased levels: Primary carnitine deficiency; Organic acidaemias and fatty acid oxidation disorders; Valproate therapy; Dialysis; Malnutrition","src":"t"},{"aka":"Beta-carotene","expl":"Measures carotene, the plant precursor of vitamin A. Low levels reflect poor intake or fat malabsorption; high levels from diet can turn the skin yellow.","abn":"Decreased levels: Fat malabsorption (coeliac disease, pancreatic insufficiency); Poor diet\nIncreased levels: High intake (carotenaemia); Hypothyroidism; Diabetes","src":"t"},{"aka":"Plasma catecholamines","expl":"Measures adrenaline, noradrenaline and dopamine in plasma. Levels change quickly with stress and posture, so plasma metanephrines are now preferred for pheochromocytoma.","abn":"Increased levels: Pheochromocytoma or paraganglioma; Stress, pain or upright posture; Some drugs","src":"t"},{"aka":"CD34 count","expl":"Counts CD34-positive stem cells by flow cytometry in blood or the apheresis product. It times stem cell collection and confirms enough cells have been harvested for transplantation.","abn":"","src":"t"},{"aka":"Body fluid cell count","expl":"Counts and identifies cells in pleural, peritoneal, pericardial or joint fluid. The total and type of white cells help separate infection, inflammation, cancer and bleeding.","abn":"Raised neutrophils: Bacterial infection (e.g., spontaneous bacterial peritonitis, septic arthritis, empyema)\nRaised lymphocytes: Tuberculosis; Cancer; Chronic inflammation\nRed cells: Trauma; Malignancy; Pulmonary infarction","src":"t"},{"aka":"Sticky tape test","expl":"Clear tape is pressed on the skin around the anus in the morning and examined for pinworm (Enterobius vermicularis) eggs. It is the standard test for pinworm infection.","abn":"Positive result: Enterobius vermicularis (pinworm) infection","src":"t"},{"aka":"CHIKV IgG, IgM","expl":"Detects antibodies to chikungunya virus, a mosquito-borne virus causing fever and severe joint pain. IgM indicates recent infection and IgG past infection.","abn":"Positive IgM: Recent chikungunya infection\nPositive IgG: Past infection","src":"t"},{"aka":"Fluid cholesterol, Fluid triglycerides","expl":"Measures cholesterol or triglycerides in pleural, peritoneal or drain fluid. High triglycerides indicate chyle (lymph) leakage, and high cholesterol helps identify exudates.","abn":"High triglycerides: Chylothorax; Chylous ascites (lymphatic injury, lymphoma)\nHigh cholesterol: Exudate; Pseudochylous effusion (long-standing effusions)","src":"t"},{"aka":"Cr","expl":"Measures chromium in blood or urine. It is used to monitor occupational exposure and patients with metal-on-metal joint implants.","abn":"Increased levels: Industrial exposure; Wear of metal-on-metal hip prostheses; Supplements","src":"t"},{"aka":"Bethesda assay, Factor inhibitor","expl":"Detects and measures antibodies (inhibitors) against factor VIII or IX. Inhibitors develop in some treated haemophilia patients or arise spontaneously (acquired haemophilia) and cause bleeding resistant to factor replacement.","abn":"Inhibitor present: Haemophilia A or B with inhibitor; Acquired haemophilia A (elderly, postpartum, autoimmune disease, cancer)","src":"t"},{"aka":"Rapid urease test","expl":"A gastric biopsy taken at endoscopy is placed in a urea gel; colour change shows urease made by Helicobacter pylori. It gives a quick diagnosis of H. pylori infection.","abn":"Positive result: Helicobacter pylori infection; False negatives with recent PPI or antibiotic use","src":"t"},{"aka":"IgG avidity","expl":"Measures how tightly IgG antibodies bind to the virus or parasite (CMV or Toxoplasma). Low avidity suggests infection within the last few months, which matters in pregnancy; high avidity suggests older infection.","abn":"Low avidity: Recent primary infection (risk to the fetus in pregnancy)\nHigh avidity: Infection more than 3–4 months ago","src":"t"},{"aka":"Co","expl":"Measures cobalt in blood or urine, mainly to monitor patients with metal-on-metal hip implants and workers exposed to cobalt.","abn":"Increased levels: Metal-on-metal hip prosthesis wear; Occupational exposure; Supplements","src":"t"},{"aka":"VWF antigen, VWF activity, VWF multimers, FVIII","expl":"Measures the amount (antigen), function (activity, collagen binding) and structure (multimers) of von Willebrand factor, with factor VIII. Together they diagnose and classify von Willebrand disease, the commonest inherited bleeding disorder.","abn":"Decreased levels: von Willebrand disease (types 1, 2 and 3); Acquired von Willebrand syndrome; Blood group O (mildly lower)\nIncreased levels: Pregnancy; Inflammation; Stress","src":"t"},{"aka":"CBC, FBC, Full blood count","expl":"Measures red cells, haemoglobin, haematocrit and red cell indices, white cells and platelets. It is the basic screen for anaemia, infection, bleeding and blood disorders; the citrate sample gives a true platelet count when EDTA causes platelet clumping.","abn":"Low haemoglobin: Anaemia\nHigh white cells: Infection; Inflammation; Leukaemia\nLow platelets: Immune thrombocytopenia; Bone marrow failure; EDTA clumping (pseudothrombocytopenia)","src":"t"},{"aka":"Cu","expl":"Measures copper in serum or urine. Low serum copper with high urine copper suggests Wilson disease; copper deficiency causes anaemia and neurological problems.","abn":"Decreased serum copper: Wilson disease; Menkes disease; Malabsorption or bariatric surgery; Zinc excess\nIncreased urine copper: Wilson disease; Cholestatic liver disease\nIncreased serum copper: Pregnancy or oestrogen; Inflammation","src":"t"},{"aka":"SARS-CoV-2 antigen, SARS-CoV-2 antibody","expl":"Detects SARS-CoV-2, the cause of COVID-19, either as viral antigen on a swab or as antibodies in blood. Antigen tests diagnose current infection; antibodies show past infection or vaccination.","abn":"Positive antigen: Current COVID-19 infection\nPositive antibody: Past infection or vaccination","src":"t"},{"aka":"Enterovirus serology","expl":"Detects antibodies to enteroviruses such as coxsackievirus, echovirus or poliovirus. They have limited value for acute diagnosis (PCR is preferred) but can show past infection or vaccine immunity to polio.","abn":"Positive result: Recent or past enterovirus infection; Polio vaccine immunity","src":"t"},{"aka":"Fluid LDH","expl":"Measures lactate dehydrogenase in a body fluid, usually with a blood LDH. A high fluid LDH (as in Light's criteria) marks an exudate caused by infection, cancer or inflammation.","abn":"High fluid LDH (exudate): Infection or empyema; Malignancy; Tuberculosis; Inflammatory disease","src":"t"},{"aka":"UGT1A1 analysis","expl":"Investigates inherited defects of bilirubin conjugation (UGT1A1). It confirms Crigler-Najjar syndrome, which causes severe unconjugated jaundice from birth.","abn":"Abnormal result: Crigler-Najjar syndrome type 1 or 2; Gilbert syndrome (milder variants)","src":"t"},{"aka":"CrAg","expl":"Detects Cryptococcus capsular antigen in blood or CSF. It is a sensitive test for cryptococcal meningitis, especially in advanced HIV.","abn":"Positive result: Cryptococcal meningitis; Disseminated cryptococcosis","src":"t"},{"aka":"Cryptosporidium antigen, Modified acid-fast stain","expl":"Detects Cryptosporidium in stool by antigen test or acid-fast staining. It causes watery diarrhoea, prolonged and severe in immunocompromised patients.","abn":"Positive result: Cryptosporidiosis","src":"t"},{"aka":"Cyanide, Thiocyanate","expl":"Measures cyanide in blood, or thiocyanate, its breakdown product. They confirm cyanide poisoning (smoke inhalation, industrial exposure) and monitor nitroprusside treatment.","abn":"Increased levels: Cyanide poisoning; Smoke inhalation; Prolonged sodium nitroprusside treatment (thiocyanate); Smoking (mild)","src":"t"},{"aka":"Cystatin C","expl":"Measures cystatin C, a small protein filtered by the kidneys. It estimates kidney function (eGFR) independently of muscle mass, useful when creatinine is unreliable.","abn":"Increased levels: Reduced kidney function; High-dose corticosteroids; Hyperthyroidism","src":"t"},{"aka":"Taenia solium antibody","expl":"Detects antibodies to the pork tapeworm larva (Taenia solium). It supports the diagnosis of cysticercosis, including neurocysticercosis, a common cause of seizures in endemic areas.","abn":"Positive result: Cysticercosis; Neurocysticercosis","src":"t"},{"aka":"CMV IgG, CMV IgM","expl":"Detects antibodies to cytomegalovirus. IgM suggests recent infection (with avidity testing to confirm) and IgG shows past infection, which matters in pregnancy and transplantation.","abn":"Positive IgM: Recent or reactivated CMV infection\nPositive IgG: Past infection (risk of reactivation)","src":"t"},{"aka":"DAT, Direct Coombs (IgG/C3d)","expl":"Detects IgG antibody or complement (C3d) coating the patient's red cells. The pattern helps classify immune haemolysis.","abn":"IgG positive: Warm autoimmune haemolytic anaemia; Haemolytic transfusion reaction; Haemolytic disease of the newborn; Drug-induced haemolysis\nC3d positive: Cold agglutinin disease; Paroxysmal cold haemoglobinuria","src":"t"},{"aka":"DHEA, DHEA-S","expl":"Measures DHEA or its sulfate (DHEA-S), androgens made mainly by the adrenal glands. They help investigate excess hair, virilisation, early puberty and adrenal disorders.","abn":"Increased levels: Adrenal tumours; Congenital adrenal hyperplasia; Polycystic ovary syndrome; Cushing disease\nDecreased levels: Adrenal insufficiency; Hypopituitarism; Ageing","src":"t"},{"aka":"Dengue IgG, IgM","expl":"Detects antibodies to dengue virus. IgM indicates recent infection; IgG shows past infection, and a second infection carries a higher risk of severe dengue.","abn":"Positive IgM: Recent dengue infection\nPositive IgG: Past infection; Cross-reaction with other flaviviruses","src":"t"},{"aka":"Dexamethasone level","expl":"Measures the dexamethasone level at the time of the suppression test cortisol sample. It confirms that enough dexamethasone was absorbed, so a failure to suppress cortisol is not falsely blamed on Cushing syndrome.","abn":"Low level: Poor adherence; Rapid metabolism (e.g., enzyme-inducing drugs) — suppression test result unreliable","src":"t"},{"aka":"DAO","expl":"Measures diamine oxidase, the main enzyme that breaks down histamine from food. Low activity is proposed as a cause of histamine intolerance, although the evidence is limited.","abn":"Decreased activity: Proposed histamine intolerance; Bowel disease; Some drugs","src":"t"},{"aka":"Disaccharidase activity","expl":"Measures lactase, sucrase, maltase and other sugar-digesting enzymes in a small-bowel biopsy. Low activity explains diarrhoea from carbohydrate malabsorption.","abn":"Decreased activity: Lactase deficiency; Congenital sucrase-isomaltase deficiency; Coeliac disease or other mucosal damage","src":"t"},{"aka":"DPD activity, Dihydropyrimidine dehydrogenase","expl":"Assesses dihydropyrimidine dehydrogenase, the enzyme that breaks down fluorouracil and capecitabine. Deficiency causes severe, sometimes fatal, chemotherapy toxicity, so testing guides dose reduction.","abn":"Decreased activity: DPD deficiency (high risk of fluoropyrimidine toxicity)","src":"t"},{"aka":"Hydatid serology","expl":"Detects antibodies to Echinococcus, the tapeworm that causes hydatid cysts, mainly in the liver and lungs.","abn":"Positive result: Cystic echinococcosis (hydatid disease); Alveolar echinococcosis","src":"t"},{"aka":"eGFR","expl":"Estimates glomerular filtration rate from serum creatinine (or cystatin C), age and sex. It stages chronic kidney disease and guides drug dosing.","abn":"Decreased eGFR: Chronic kidney disease (staged by value); Acute kidney injury; Less accurate in extremes of muscle mass, pregnancy or unstable kidney function","src":"t"},{"aka":"Ehrlichia antibody","expl":"Detects antibodies to Ehrlichia, tick-borne bacteria that infect white blood cells and cause fever, low platelets and raised liver enzymes.","abn":"Rising titre: Human ehrlichiosis; Anaplasmosis (cross-reaction)","src":"t"},{"aka":"Faecal elastase-1","expl":"Measures elastase, a pancreatic enzyme, in stool. A low level shows pancreatic exocrine insufficiency; watery stool can give falsely low results.","abn":"Decreased levels: Pancreatic exocrine insufficiency (chronic pancreatitis, cystic fibrosis, pancreatic cancer, after pancreatic surgery)","src":"t"},{"aka":"Stool sodium, Stool potassium, Stool osmotic gap","expl":"Measures sodium and potassium in liquid stool to calculate the stool osmotic gap. It separates secretory diarrhoea from osmotic diarrhoea.","abn":"Low osmotic gap: Secretory diarrhoea (e.g., infection, hormone-secreting tumours, laxative abuse with stimulants)\nHigh osmotic gap: Osmotic diarrhoea (e.g., lactose intolerance, magnesium or osmotic laxatives)","src":"t"},{"aka":"E. histolytica antigen","expl":"Detects Entamoeba histolytica in stool by antigen test or microscopy. It diagnoses amoebic dysentery and distinguishes the harmful species from harmless amoebae.","abn":"Positive result: Amoebic colitis/dysentery; Amoebic liver abscess (stool may be negative)","src":"t"},{"aka":"E2","expl":"Measures estradiol, the main oestrogen, at baseline or at timed points during a stimulation test. It assesses ovarian function, puberty, fertility treatment and oestrogen-producing tumours.","abn":"Increased levels: Ovarian or adrenal tumours; Precocious puberty; Ovarian stimulation; Liver cirrhosis; Gynaecomastia in men\nDecreased levels: Ovarian failure or menopause; Hypopituitarism; Anorexia nervosa; Turner syndrome","src":"t"},{"aka":"FXIII screen, Clot solubility test","expl":"Checks factor XIII, which stabilises clots, usually by testing clot solubility. Deficiency causes delayed bleeding and poor wound healing despite normal PT and APTT.","abn":"Abnormal (clot dissolves): Factor XIII deficiency (inherited or acquired)","src":"t"},{"aka":"FGF23","expl":"Measures fibroblast growth factor 23, a bone hormone that makes the kidneys excrete phosphate. It helps diagnose causes of low phosphate such as X-linked hypophosphataemia and tumour-induced osteomalacia.","abn":"Increased levels: X-linked hypophosphataemia; Tumour-induced osteomalacia; Chronic kidney disease\nDecreased levels: Tumoral calcinosis","src":"t"},{"aka":"Filarial serology","expl":"Detects antibodies to filarial worms (such as Wuchereria, Brugia, Loa loa and Onchocerca). It supports diagnosis in people from endemic areas but cannot separate past from current infection.","abn":"Positive result: Lymphatic filariasis; Loiasis; Onchocerciasis; Cross-reaction with other helminths","src":"t"},{"aka":"F","expl":"Measures fluoride in plasma. It is used to detect excess exposure, for example from dialysis water, toothpaste ingestion in children or long-term voriconazole therapy.","abn":"Increased levels: Fluoride poisoning; Long-term voriconazole therapy (skeletal fluorosis); Contaminated water","src":"t"},{"aka":"Benzodiazepine level","expl":"Measures a benzodiazepine (such as flurazepam) and its active metabolites in plasma. It confirms use or overdose and helps assess sedation.","abn":"Detected / raised: Benzodiazepine use or overdose","src":"t"},{"aka":"Serum free light chains, Kappa/lambda ratio","expl":"Measures free kappa and lambda light chains in serum and their ratio. An abnormal ratio points to a plasma cell disorder and is used to diagnose and monitor myeloma and AL amyloidosis.","abn":"Abnormal kappa/lambda ratio: Multiple myeloma (especially light-chain myeloma); AL amyloidosis; MGUS\nBoth raised with normal ratio: Kidney disease; Inflammation","src":"t"},{"aka":"Urine fructose","expl":"Detects fructose in urine. It is used to investigate inherited disorders of fructose metabolism.","abn":"Increased levels: Essential fructosuria; Hereditary fructose intolerance; High fructose intake","src":"t"},{"aka":"Free T4 by equilibrium dialysis","expl":"Measures free thyroxine after separating it by equilibrium dialysis, the reference method. It is used when routine free T4 results do not fit the clinical picture, such as with abnormal binding proteins, heparin or biotin.","abn":"Increased levels: Hyperthyroidism; Thyroid hormone resistance\nDecreased levels: Hypothyroidism","src":"t"},{"aka":"Fungal culture, KOH prep","expl":"Detects fungi by microscopy (after potassium hydroxide treatment) and culture from skin, hair, nails or other specimens. Microscopy gives a quick answer; culture identifies the species.","abn":"Positive result: Dermatophyte infection (tinea); Candida infection; Mould infection","src":"t"},{"aka":"Antimicrobial susceptibility, MIC","expl":"Determines the lowest concentration of an antimicrobial drug that stops growth of the isolated organism (MIC). Results classify it as susceptible or resistant and guide treatment.","abn":"High MIC: Resistance to the drug tested\nLow MIC: Susceptibility","src":"t"},{"aka":"Plasma galactose","expl":"Measures galactose in blood. It is used in the diagnosis and monitoring of galactosaemia and other disorders of galactose metabolism.","abn":"Increased levels: Galactosaemia; Galactokinase deficiency; Liver disease (portosystemic shunting)","src":"t"},{"aka":"Anti-ganglioside, Anti-GQ1b, Anti-MAG","expl":"Detects antibodies against nerve glycolipids (gangliosides) or myelin-associated glycoprotein. They help classify autoimmune neuropathies.","abn":"Positive anti-GQ1b: Miller Fisher syndrome; Bickerstaff encephalitis\nPositive anti-GM1: Multifocal motor neuropathy; Guillain-Barré (axonal)\nPositive anti-MAG: IgM paraprotein-associated demyelinating neuropathy","src":"t"},{"aka":"Vaginal swab culture, Genital culture","expl":"Grows organisms from vaginal, cervical or device samples. It identifies yeast, group B streptococcus and other pathogens; bacterial vaginosis is diagnosed mainly from the Gram stain.","abn":"Positive result: Vulvovaginal candidiasis; Bacterial vaginosis; Group B streptococcus; Pelvic or device-related infection","src":"t"},{"aka":"Giardia antigen","expl":"Detects Giardia lamblia antigen in stool. It diagnoses giardiasis, a common cause of prolonged diarrhoea and malabsorption.","abn":"Positive result: Giardiasis","src":"t"},{"aka":"GnRH test","expl":"LH and FSH are measured after an injection of gonadotrophin-releasing hormone (or analogue). The response helps separate pituitary from hypothalamic causes of hypogonadism and assesses puberty.","abn":"Exaggerated LH rise: Central precocious puberty\nAbsent or poor rise: Pituitary disease; Hypogonadotropic hypogonadism","src":"t"},{"aka":"Gram stain","expl":"A rapid microscope stain showing whether bacteria are present, their shape and whether they are Gram-positive or Gram-negative, and how many white cells are present. It guides early antibiotic choice while culture is pending.","abn":"","src":"t"},{"aka":"Haloperidol","expl":"Measures haloperidol, an antipsychotic drug. Levels help check adherence and investigate side effects or poor response.","abn":"Above range: Toxicity (movement disorders, sedation, QT prolongation)\nBelow range: Poor adherence or rapid metabolism","src":"t"},{"aka":"HbA1c, A1C, Glycated haemoglobin","expl":"Measures the proportion of haemoglobin with glucose attached, which reflects average blood glucose over about 2–3 months. It diagnoses and monitors diabetes.","abn":"Increased levels: Diabetes (≥ 6.5%); Prediabetes (5.7–6.4%)\nFalsely low or high: Haemoglobin variants; Haemolysis or blood loss; Iron deficiency; Kidney failure","src":"t"},{"aka":"PF4 antibody, HIT screen","expl":"Detects antibodies against platelet factor 4–heparin complexes. With a typical fall in platelets after heparin, a positive result supports heparin-induced thrombocytopenia, which causes clots.","abn":"Positive result: Heparin-induced thrombocytopenia (confirm with functional assay); Low-titre positives without HIT","src":"t"},{"aka":"Plasma histamine","expl":"Measures histamine released from mast cells and basophils. It is used to investigate suspected anaphylaxis and mast cell disorders, but rises and falls quickly.","abn":"Increased levels: Anaphylaxis; Systemic mastocytosis; Allergic reactions","src":"t"},{"aka":"Histoplasma urine antigen","expl":"Detects Histoplasma antigen in urine. It is a sensitive test for disseminated histoplasmosis, especially in immunocompromised patients, and is used to monitor treatment.","abn":"Positive result: Disseminated or acute pulmonary histoplasmosis; Cross-reaction with blastomycosis","src":"t"},{"aka":"Anti-HMGCR","expl":"Detects antibodies to HMG-CoA reductase. They mark immune-mediated necrotising myopathy, often after statin use, with very high CK and muscle weakness that persists after stopping the statin.","abn":"Positive result: Statin-associated immune-mediated necrotising myopathy","src":"t"},{"aka":"HOMA-IR","expl":"Calculates insulin resistance from paired fasting glucose and insulin. Higher values indicate greater insulin resistance; it is mainly a research and screening estimate.","abn":"Increased index: Insulin resistance; Metabolic syndrome; Type 2 diabetes risk; Polycystic ovary syndrome","src":"t"},{"aka":"HHV-6 IgG, IgM, PCR","expl":"Detects human herpesvirus 6 by antibodies or viral DNA in blood. Primary infection causes roseola in infants; reactivation matters after transplantation.","abn":"Positive IgM or PCR: Primary infection (roseola) or reactivation; Chromosomally integrated HHV-6 (persistently high PCR)\nPositive IgG: Past infection (very common)","src":"t"},{"aka":"Hyaluronan","expl":"Measures hyaluronic acid in serum, which is cleared by the liver. Raised levels reflect liver fibrosis and form part of some fibrosis scores.","abn":"Increased levels: Liver fibrosis or cirrhosis; Rheumatoid arthritis; Some cancers (e.g., mesothelioma)","src":"t"},{"aka":"Sulfonylurea screen","expl":"Screens blood for sulfonylureas and similar glucose-lowering drugs. It is used when low blood sugar with high insulin may be caused by these drugs rather than an insulinoma.","abn":"Detected: Sulfonylurea or meglitinide ingestion (accidental, factitious or prescribed)","src":"t"},{"aka":"IA-2A, ZnT8A","expl":"Detects antibodies to islet antigen 2 or zinc transporter 8. Together with GAD antibodies, they identify autoimmune (type 1) diabetes and predict risk in relatives.","abn":"Positive result: Type 1 diabetes; Latent autoimmune diabetes in adults; Increased future risk in relatives","src":"t"},{"aka":"IgD","expl":"Measures immunoglobulin D. It is mainly used to identify the rare IgD myeloma and in investigation of periodic fever syndromes.","abn":"Increased levels: IgD myeloma; Hyper-IgD syndrome (mevalonate kinase deficiency); Chronic infection","src":"t"},{"aka":"CSF IgM","expl":"Measures IgM in cerebrospinal fluid. It helps detect antibody production within the nervous system, as in some infections and neuro-inflammatory disease.","abn":"Increased levels: CNS infection (e.g., neuroborreliosis); Multiple sclerosis; Blood–brain barrier damage","src":"t"},{"aka":"Influenza antigen, Influenza PCR","expl":"Detects influenza A and B in a nasal or nasopharyngeal swab. Rapid antigen tests are quick but less sensitive than PCR.","abn":"Positive result: Influenza A or B infection","src":"t"},{"aka":"Inhibin A, Inhibin B","expl":"Measures inhibins, hormones from the ovary, testis and placenta. Inhibin A is part of the quadruple prenatal screen; inhibin B reflects ovarian reserve and sperm production and is a marker of granulosa cell tumours.","abn":"Increased levels: Granulosa cell tumour; Down syndrome pregnancy (inhibin A)\nDecreased inhibin B: Reduced ovarian reserve; Impaired spermatogenesis","src":"t"},{"aka":"Interleukins, sIL-2R","expl":"Measures cytokines such as IL-6, IL-1β, IL-8, IL-10 or the soluble IL-2 receptor. They reflect immune activation and help assess conditions such as cytokine release syndrome, sepsis and haemophagocytic lymphohistiocytosis.","abn":"Increased levels: Sepsis; Cytokine release syndrome; Haemophagocytic lymphohistiocytosis (sIL-2R); Sarcoidosis; Lymphoma; Severe inflammation","src":"t"},{"aka":"Serum iodine","expl":"Measures iodine in blood. It reflects recent iodine intake or exposure, such as contrast media or amiodarone, more than long-term iodine status.","abn":"Increased levels: Iodinated contrast or amiodarone; Iodine supplements\nDecreased levels: Iodine deficiency","src":"t"},{"aka":"JEV IgG, IgM","expl":"Detects antibodies to Japanese encephalitis virus, a mosquito-borne flavivirus in Asia. IgM in serum or CSF supports recent infection; IgG may reflect vaccination.","abn":"Positive IgM: Recent Japanese encephalitis infection\nPositive IgG: Past infection or vaccination; Cross-reaction with other flaviviruses","src":"t"},{"aka":"Lactate, Blood lactate","expl":"Measures lactate on a blood gas analyser. A high level shows poor tissue oxygen delivery or impaired clearance and is a key marker of sepsis and shock severity.","abn":"Increased levels: Sepsis or septic shock; Hypoperfusion or cardiac arrest; Severe hypoxia; Metformin toxicity; Liver failure; Seizures or intense exercise","src":"t"},{"aka":"Leishmania antibody","expl":"Detects antibodies to Leishmania parasites. It is most useful for visceral leishmaniasis (kala-azar), which causes fever, weight loss and an enlarged spleen.","abn":"Positive result: Visceral leishmaniasis; Past infection","src":"t"},{"aka":"Leptin","expl":"Measures leptin, a hormone from fat tissue that signals energy stores to the brain. It is used in the investigation of rare genetic obesity and lipodystrophy.","abn":"Increased levels: Obesity; Leptin resistance\nDecreased levels: Congenital leptin deficiency; Lipodystrophy; Anorexia nervosa","src":"t"},{"aka":"FNA thyroglobulin","expl":"Measures thyroglobulin in the needle washout from a fine-needle aspirate of a neck lymph node or thyroid bed. A high level shows metastatic or recurrent differentiated thyroid cancer, even when cytology is unclear.","abn":"Increased levels: Metastatic or recurrent papillary or follicular thyroid cancer","src":"t"},{"aka":"Listeria antibody","expl":"Detects antibodies to Listeria monocytogenes. Serology has limited value; diagnosis of listeriosis relies mainly on blood or CSF culture.","abn":"Positive result: Possible recent listeriosis (confirm by culture)","src":"t"},{"aka":"Anti-LC1, Anti-SLA","expl":"Detects antibodies to liver cytosol type 1 or soluble liver antigen. They are markers of autoimmune hepatitis (anti-SLA is highly specific).","abn":"Positive result: Autoimmune hepatitis (type 2 for anti-LC1; type 1 for anti-SLA)","src":"t"},{"aka":"LFT, Liver panel","expl":"A group of tests (ALT, AST, ALP, GGT, bilirubin, albumin and total protein) that assess liver cell injury, bile flow and liver synthetic function.","abn":"Raised ALT/AST: Hepatitis; Fatty liver; Drug or alcohol injury\nRaised ALP/GGT: Cholestasis; Bile duct obstruction\nLow albumin: Chronic liver disease; Malnutrition","src":"t"},{"aka":"Macroprolactin","expl":"Measures the proportion of prolactin present as macroprolactin, a large inactive complex. It explains raised prolactin without symptoms and avoids unnecessary imaging or treatment.","abn":"High macroprolactin: Macroprolactinaemia (benign)","src":"t"},{"aka":"Red cell magnesium","expl":"Measures magnesium inside red cells, which may reflect body stores better than serum magnesium. It is mainly used in specialist and functional assessments.","abn":"Decreased levels: Magnesium depletion; Diuretics; Alcohol excess; Malabsorption","src":"t"},{"aka":"Malaria antigen, Blood film","expl":"Detects malaria parasites by rapid antigen test and thick and thin blood films. Films confirm the species and parasite load; testing is urgent in any febrile traveller from an endemic area.","abn":"Positive result: Plasmodium falciparum, vivax, ovale, malariae or knowlesi infection","src":"t"},{"aka":"Mn","expl":"Measures manganese in blood. It is used to detect toxicity from occupational exposure or long-term parenteral nutrition, which can cause a parkinsonian syndrome.","abn":"Increased levels: Occupational exposure (welding, mining); Long-term parenteral nutrition; Liver failure\nDecreased levels: Deficiency (rare)","src":"t"},{"aka":"Measles IgG, IgM","expl":"Detects antibodies to measles virus. IgM indicates recent infection; IgG shows immunity from past infection or vaccination.","abn":"Positive IgM: Recent measles infection\nPositive IgG: Immunity\nNegative IgG: Susceptible (vaccinate if appropriate)","src":"t"},{"aka":"Methadone","expl":"Measures methadone in blood. It confirms adherence in opioid substitution treatment and helps assess toxicity.","abn":"Above range: Toxicity (sedation, respiratory depression, QT prolongation)\nBelow range: Non-adherence or rapid metabolism","src":"t"},{"aka":"Methsuximide (N-desmethylmethsuximide)","expl":"Measures methsuximide, an antiepileptic drug, through its active metabolite. It guides dosing and detects toxicity.","abn":"Above range: Toxicity (drowsiness, ataxia)\nBelow range: Under-dosing or poor adherence","src":"t"},{"aka":"MMA","expl":"Measures methylmalonic acid in blood or urine. It rises early in vitamin B12 deficiency, even when B12 is borderline, and is very high in inherited methylmalonic acidaemia.","abn":"Increased levels: Vitamin B12 deficiency; Methylmalonic acidaemia; Kidney impairment (mild rise)","src":"t"},{"aka":"MRD by flow cytometry","expl":"Uses flow cytometry to detect very small numbers of leukaemia or myeloma cells left after treatment. MRD status is a strong predictor of relapse and guides therapy.","abn":"MRD positive: Residual disease (higher relapse risk)\nMRD negative: Deep remission","src":"t"},{"aka":"APTT mixing study","expl":"Patient plasma is mixed with normal plasma and the APTT repeated. Correction points to a factor deficiency; failure to correct points to an inhibitor such as lupus anticoagulant or a factor VIII inhibitor.","abn":"Corrects: Factor deficiency (VIII, IX, XI, XII)\nDoes not correct: Lupus anticoagulant; Factor inhibitor; Heparin","src":"t"},{"aka":"NTM, Nontuberculous mycobacteria","expl":"Detects and identifies mycobacteria other than M. tuberculosis (such as M. avium complex). They cause lung, skin and disseminated infection, especially in damaged lungs or immunosuppression.","abn":"Positive result: Nontuberculous mycobacterial infection; Colonisation (needs clinical correlation)","src":"t"},{"aka":"MRSA screen","expl":"Culture of nasal (and sometimes other) swabs to detect carriage of methicillin-resistant Staphylococcus aureus. Positive patients need isolation and decolonisation.","abn":"Positive result: MRSA colonisation","src":"t"},{"aka":"VRE screen, CRE screen","expl":"Culture of a rectal swab to detect carriage of multidrug-resistant gut bacteria: vancomycin-resistant enterococci or carbapenem-resistant Enterobacterales. Positive patients need infection-control precautions.","abn":"Positive result: VRE or CRE colonisation","src":"t"},{"aka":"GAGs, Mucopolysaccharides, Oligosaccharides","expl":"Measures glycosaminoglycans or oligosaccharides, mainly in urine. Raised levels screen for lysosomal storage disorders, with the pattern pointing to the type.","abn":"Increased levels: Mucopolysaccharidoses (e.g., Hurler, Hunter, Sanfilippo); Oligosaccharidoses (e.g., alpha-mannosidosis, fucosidosis)","src":"t"},{"aka":"GC culture","expl":"Grows Neisseria gonorrhoeae from genital, rectal or throat swabs. Culture allows antibiotic susceptibility testing, which is important because of rising resistance.","abn":"Positive result: Gonorrhoea","src":"t"},{"aka":"DHR test, Oxidative burst","expl":"Measures the ability of neutrophils to produce reactive oxygen (oxidative burst) by flow cytometry. Absent or reduced burst diagnoses chronic granulomatous disease.","abn":"Absent or reduced burst: Chronic granulomatous disease (patients and carriers); Severe G6PD deficiency","src":"t"},{"aka":"Ni","expl":"Measures nickel in blood, mainly to monitor occupational exposure and metal implant wear.","abn":"Increased levels: Occupational exposure; Metal implant wear","src":"t"},{"aka":"Urine organic acids","expl":"Measures organic acids in urine by gas chromatography–mass spectrometry. The pattern identifies inherited metabolic disorders presenting with acidosis, low blood sugar or developmental problems.","abn":"Abnormal pattern: Organic acidaemias (e.g., methylmalonic, propionic); Fatty acid oxidation disorders; Mitochondrial disorders; Aminoacidopathies","src":"t"},{"aka":"Oxcarbazepine (MHD)","expl":"Measures oxcarbazepine through its active metabolite (MHD). It guides dosing in epilepsy and helps assess toxicity, including low sodium.","abn":"Above range: Toxicity (dizziness, hyponatraemia)\nBelow range: Under-dosing or poor adherence","src":"t"},{"aka":"P50","expl":"Measures P50, the oxygen pressure at which haemoglobin is half saturated. It shows abnormal oxygen affinity of haemoglobin and helps investigate unexplained polycythaemia.","abn":"Low P50 (high affinity): High-oxygen-affinity haemoglobin variants; Low 2,3-DPG\nHigh P50 (low affinity): Low-affinity variants; Raised 2,3-DPG","src":"t"},{"aka":"Urine phosphate","expl":"Measures phosphate passed in the urine. It shows whether a low blood phosphate is caused by kidney losses.","abn":"Increased levels: Hyperparathyroidism; FGF23-mediated hypophosphataemia; Fanconi syndrome; Diuretics\nDecreased levels: Poor intake; Hypoparathyroidism; Vitamin D deficiency","src":"t"},{"aka":"Platelet glycoproteins by flow","expl":"Measures platelet surface glycoproteins (such as GPIIb/IIIa and GPIb/IX) by flow cytometry. Missing glycoproteins diagnose inherited platelet function disorders.","abn":"Absent GPIIb/IIIa: Glanzmann thrombasthenia\nAbsent GPIb/IX: Bernard-Soulier syndrome","src":"t"},{"aka":"Ionised calcium, Post-filter calcium","expl":"Measures ionised calcium after the filter in a dialysis circuit using citrate anticoagulation. It is used to adjust the citrate dose so the circuit does not clot.","abn":"Above target: Increase citrate (circuit clotting risk)\nBelow target: Reduce citrate","src":"t"},{"aka":"PCT","expl":"Measures procalcitonin, a protein that rises quickly in bacterial infection and sepsis but much less in viral infection. It helps decide whether to start or stop antibiotics.","abn":"Increased levels: Bacterial sepsis; Severe bacterial infection; Major trauma, surgery or burns; Medullary thyroid carcinoma","src":"t"},{"aka":"Proinsulin","expl":"Measures proinsulin, the precursor of insulin. A high level during low blood sugar supports insulinoma.","abn":"Increased levels: Insulinoma; Type 2 diabetes; Rare proinsulin processing defects","src":"t"},{"aka":"SPEP, UPEP","expl":"Separates proteins in serum or urine into bands. It detects a monoclonal protein (M-spike) in plasma cell disorders and shows patterns of inflammation, liver disease and protein loss.","abn":"Monoclonal band: Multiple myeloma; MGUS; Waldenström macroglobulinaemia; AL amyloidosis\nPolyclonal increase: Chronic infection; Liver disease; Autoimmune disease\nLow albumin/protein: Nephrotic syndrome; Protein-losing states","src":"t"},{"aka":"PT, INR, Coagulation screen","expl":"Measures the prothrombin time and INR (extrinsic pathway), with APTT in the coagulation screen. It monitors warfarin and screens for bleeding disorders, liver disease and vitamin K deficiency.","abn":"Prolonged: Warfarin; Vitamin K deficiency; Liver disease; DIC; Factor II, V, VII or X deficiency","src":"t"},{"aka":"FNA parathyroid hormone","expl":"Measures parathyroid hormone in the needle washout from a fine-needle aspirate. A high level confirms that a neck lesion is parathyroid tissue, helping localise an adenoma.","abn":"Increased levels: Parathyroid adenoma or tissue","src":"t"},{"aka":"PTHrP","expl":"Measures parathyroid hormone–related protein, made by some cancers. It causes high calcium with suppressed PTH (humoral hypercalcaemia of malignancy).","abn":"Increased levels: Humoral hypercalcaemia of malignancy (e.g., squamous cell, renal, breast cancers); Lactation","src":"t"},{"aka":"Pyruvate, Lactate/pyruvate ratio","expl":"Measures pyruvate in blood, usually with lactate. The lactate-to-pyruvate ratio helps separate mitochondrial disorders from pyruvate metabolism defects.","abn":"High lactate/pyruvate ratio: Mitochondrial respiratory chain disorders; Hypoxia\nNormal ratio with high both: Pyruvate dehydrogenase deficiency","src":"t"},{"aka":"Rapid strep test","expl":"Detects group A streptococcus antigen in a throat swab within minutes. It diagnoses strep throat; a negative result in children may be confirmed by culture.","abn":"Positive result: Group A streptococcal pharyngitis","src":"t"},{"aka":"Clinitest","expl":"Detects reducing sugars (such as glucose, galactose, fructose and lactose) in urine. In infants it screens for galactosaemia and other sugar disorders.","abn":"Positive result: Glycosuria (diabetes); Galactosaemia; Hereditary fructose intolerance; Lactosuria","src":"t"},{"aka":"RSV antigen","expl":"Detects respiratory syncytial virus antigen in a nasal sample. RSV is the main cause of bronchiolitis in infants.","abn":"Positive result: RSV infection","src":"t"},{"aka":"RBP4","expl":"Measures retinol-binding protein, which carries vitamin A. Low levels reflect poor nutrition; urine RBP is a marker of kidney tubule damage.","abn":"Increased levels: Chronic kidney disease\nDecreased levels: Malnutrition; Vitamin A or zinc deficiency; Liver disease","src":"t"},{"aka":"Rotavirus antigen","expl":"Detects rotavirus in stool. It is a common cause of severe diarrhoea and vomiting in young children.","abn":"Positive result: Rotavirus gastroenteritis","src":"t"},{"aka":"S100B","expl":"Measures S100B protein, released from brain and melanoma cells. It is used to monitor melanoma and to assess mild head injury.","abn":"Increased levels: Metastatic melanoma; Brain injury; Stroke","src":"t"},{"aka":"Aspirin level","expl":"Measures salicylate in blood after aspirin overdose. Levels guide treatment such as urine alkalinisation or haemodialysis.","abn":"Toxic levels: Salicylate poisoning (metabolic acidosis, respiratory alkalosis, tinnitus)","src":"t"},{"aka":"Schistosoma serology, Urine ova","expl":"Detects Schistosoma infection by antibodies in blood or eggs in urine. S. haematobium causes blood in the urine and bladder disease.","abn":"Positive result: Schistosomiasis (urinary or intestinal)","src":"t"},{"aka":"Se","expl":"Measures selenium, a trace element needed for antioxidant enzymes and thyroid hormone metabolism. It is monitored in long-term parenteral nutrition and suspected deficiency or toxicity.","abn":"Decreased levels: Parenteral nutrition without supplement; Malabsorption; Low-soil-selenium diet\nIncreased levels: Excess supplements","src":"t"},{"aka":"SHBG","expl":"Measures sex hormone–binding globulin, which carries testosterone and oestradiol. It is used to calculate free testosterone and to assess androgen status.","abn":"Increased levels: Hyperthyroidism; Oestrogen therapy or pregnancy; Liver cirrhosis; Ageing men\nDecreased levels: Obesity; Insulin resistance; Polycystic ovary syndrome; Hypothyroidism; Androgen use","src":"t"},{"aka":"Hydrogen/methane breath test","expl":"Hydrogen and methane are measured in breath after a sugar drink (glucose or lactulose). An early rise suggests small intestinal bacterial overgrowth.","abn":"Positive result: Small intestinal bacterial overgrowth; Rapid gut transit (false positive)","src":"t"},{"aka":"SO2, Oxygen saturation","expl":"Measures how much haemoglobin is carrying oxygen, by co-oximetry on a blood gas analyser. Arterial values assess oxygenation; venous values reflect oxygen use by tissues.","abn":"Low arterial SO2: Hypoxaemia (lung disease, hypoventilation)\nLow venous SO2: Poor cardiac output; High oxygen consumption","src":"t"},{"aka":"SCC antigen, CYFRA 21-1","expl":"Measures tumour markers for squamous cell cancers (SCC antigen) and lung cancer (CYFRA 21-1). They are used to monitor treatment and recurrence, not for screening.","abn":"Increased levels: Squamous cell carcinoma (cervix, head and neck, lung, oesophagus); Non-small cell lung cancer; Kidney failure and skin disease (false positives)","src":"t"},{"aka":"Urine citrate, Stone risk profile","expl":"Measures urine substances that promote or prevent stones (such as calcium, oxalate, uric acid, citrate and volume) in a 24-hour collection. It identifies correctable risks in recurrent kidney stone formers.","abn":"Low citrate: Renal tubular acidosis; Chronic diarrhoea; High-protein diet\nHigh calcium, oxalate or uric acid: Increased stone risk","src":"t"},{"aka":"Strongyloides serology","expl":"Detects antibodies to Strongyloides stercoralis, a worm that can persist for decades and become life-threatening with steroid treatment. Screening is advised before immunosuppression in people from endemic areas.","abn":"Positive result: Strongyloidiasis (current or past); Cross-reaction with other helminths","src":"t"},{"aka":"rT3","expl":"Measures reverse T3, an inactive form of thyroid hormone. It rises in severe non-thyroidal illness, starvation and some drugs.","abn":"Increased levels: Non-thyroidal illness; Starvation; Amiodarone or steroid therapy; Hyperthyroidism","src":"t"},{"aka":"Toxocara serology","expl":"Detects antibodies to Toxocara, the roundworm of dogs and cats. It supports diagnosis of visceral or ocular larva migrans, usually in children.","abn":"Positive result: Toxocariasis (visceral or ocular)","src":"t"},{"aka":"Trichinella serology","expl":"Detects antibodies to Trichinella, caught from undercooked pork or wild game. Infection causes muscle pain, fever, facial swelling and eosinophilia.","abn":"Positive result: Trichinellosis","src":"t"},{"aka":"T. cruzi antibody","expl":"Detects antibodies to Trypanosoma cruzi, the parasite that causes Chagas disease in Latin America. Chronic infection can damage the heart and gut.","abn":"Positive result: Chronic Chagas disease","src":"t"},{"aka":"Mast cell tryptase","expl":"Measures tryptase released by mast cells. A level taken 1–4 hours after a reaction confirms anaphylaxis, and a persistently high baseline suggests mastocytosis.","abn":"Increased levels: Anaphylaxis; Systemic mastocytosis; Hereditary alpha-tryptasaemia; Myeloid neoplasms","src":"t"},{"aka":"Urine dipstick","expl":"A reagent strip that screens urine for glucose, protein, blood, ketones, leucocytes, nitrite, bilirubin, urobilinogen, pH and specific gravity. Positive results are confirmed by laboratory tests.","abn":"Positive nitrite/leucocytes: Urinary tract infection\nProtein: Kidney disease\nBlood: Infection, stones, kidney or bladder disease\nGlucose/ketones: Diabetes","src":"t"},{"aka":"Serum viscosity","expl":"Measures how thick serum is compared with water. High viscosity, usually from a large paraprotein, causes hyperviscosity syndrome with visual and neurological symptoms.","abn":"Increased levels: Waldenström macroglobulinaemia; Multiple myeloma; Cryoglobulinaemia; Severe polyclonal hypergammaglobulinaemia","src":"t"},{"aka":"Calcitriol, 1,25(OH)2D","expl":"Measures 1,25-dihydroxyvitamin D, the active hormone form. It is used in kidney disease, granulomatous disease and unusual calcium or phosphate disorders, not to assess vitamin D status.","abn":"Increased levels: Sarcoidosis and other granulomatous diseases; Primary hyperparathyroidism; Lymphoma\nDecreased levels: Chronic kidney disease; Hypoparathyroidism; Vitamin D–dependent rickets","src":"t"},{"aka":"VIP","expl":"Measures vasoactive intestinal polypeptide. Very high levels confirm a VIPoma, a tumour causing severe watery diarrhoea and low potassium.","abn":"Increased levels: VIPoma (pancreatic neuroendocrine tumour); Neuroblastoma","src":"t"},{"aka":"Yersinia serology","expl":"Detects antibodies to Yersinia enterocolitica. Infection causes diarrhoea and abdominal pain resembling appendicitis, and can trigger reactive arthritis.","abn":"Positive result: Recent Yersinia infection; Reactive arthritis","src":"t"},{"aka":"Zn","expl":"Measures zinc in serum or red cells. Deficiency causes skin rash, hair loss, poor wound healing and taste changes.","abn":"Decreased levels: Poor intake; Malabsorption; Parenteral nutrition; Alcohol excess; Acrodermatitis enteropathica; Inflammation (low serum)\nIncreased levels: Excess supplements","src":"t"},{"aka":"DMD gene analysis","expl":"Tests the dystrophin (DMD) gene for deletions, duplications or point variants. It confirms Duchenne or Becker muscular dystrophy and identifies female carriers.","abn":"Pathogenic variant: Duchenne muscular dystrophy; Becker muscular dystrophy; Carrier status","src":"t"},{"aka":"HTT CAG repeat","expl":"Counts the CAG repeats in the huntingtin (HTT) gene. An expanded repeat confirms Huntington disease, a progressive inherited neurological disorder.","abn":"Expanded repeat (≥ 40): Huntington disease\n36–39 repeats: Reduced penetrance\n27–35 repeats: Intermediate (risk of expansion in children)","src":"t"},{"aka":"SMN1 deletion analysis","expl":"Tests the SMN1 gene for deletion and counts SMN2 copies. It diagnoses spinal muscular atrophy and identifies carriers; SMN2 copy number predicts severity.","abn":"Absent SMN1: Spinal muscular atrophy\nOne SMN1 copy: Carrier","src":"t"},{"aka":"BRCA1, BRCA2","expl":"Tests the BRCA1 and BRCA2 genes for inherited variants that greatly raise the risk of breast, ovarian, prostate and pancreatic cancers. Results guide screening, preventive options, treatment and testing of relatives.","abn":"Pathogenic variant: Hereditary breast and ovarian cancer syndrome","src":"t"},{"aka":"MMR immunohistochemistry, MSI","expl":"Screens tumour tissue for loss of mismatch repair proteins or microsatellite instability. An abnormal result suggests Lynch syndrome (HNPCC) and leads to germline genetic testing.","abn":"Abnormal result: Lynch syndrome; Sporadic MLH1 promoter methylation","src":"t"},{"aka":"JAK2 V617F","expl":"Tests blood for the JAK2 V617F mutation. It is found in almost all polycythaemia vera and about half of essential thrombocythaemia and primary myelofibrosis.","abn":"Detected: Polycythaemia vera; Essential thrombocythaemia; Primary myelofibrosis","src":"t"},{"aka":"Lysosomal enzyme screen","expl":"Screens blood for mucopolysaccharidoses and related lysosomal storage disorders, in which complex sugars build up because an enzyme is missing. Abnormal results are confirmed by specific enzyme and gene testing, usually alongside urine glycosaminoglycans.","abn":"Abnormal result: Mucopolysaccharidoses (e.g., Hurler, Hunter, Sanfilippo, Morquio syndromes)","src":"t"}];

const TUBE = [
  ['royal blue', '#1f3a93'], ['light green', '#8fd18a'], ['lav', '#c9b3e0'], ['lavender', '#c9b3e0'],
  ['light yellow', '#f2e39a'], ['red', '#c0392b'], ['yellow', '#e0b83a'], ['gold', '#c9a227'],
  ['green', '#4f9e5e'], ['blue', '#3a6fb0'], ['grey', '#9a9891'], ['gray', '#9a9891'],
  ['pink', '#e0a0b4'], ['orange', '#d98033'], ['swab', '#b8b4a8'], ['cup', '#b8b4a8'],
  ['cont', '#b8b4a8'], ['jug', '#b8b4a8'], ['bottle', '#8a8880'], ['btl', '#8a8880'], ['kit', '#8a8880'],
  ['card', '#b8b4a8'], ['plate', '#b8b4a8'], ['slide', '#b8b4a8'], ['tube', '#b8b4a8']
];
function tubeColor(ct) {
  const s = (ct || '').toLowerCase();
  for (const [k, c] of TUBE) if (s.includes(k)) return c;
  return '#d6d3cb';
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

const state = { q: '', dept: 'All', letter: 'All', open: null, limit: 60 };
const $ = id => document.getElementById(id);
function set(patch) { Object.assign(state, { open: null, limit: 60 }, patch); render(); }

const alphabet = ['All'].concat('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''));
const deptNames = ['All'].concat([...new Set(TESTS.map(t => t.d).filter(Boolean))].sort());

function filtered() {
  const term = state.q.trim().toLowerCase();
  const words = term.split(/\s+/).filter(Boolean);
  const browsing = words.length > 0 || state.dept !== 'All' || state.letter !== 'All';
  if (!browsing) return { list: [], browsing };
  let list = TESTS;
  if (state.dept !== 'All') list = list.filter(t => t.d === state.dept);
  if (state.letter !== 'All') list = list.filter(t => (t.n.replace(/^[^A-Za-z0-9]+/, '')[0] || '').toUpperCase() === state.letter);
  if (words.length) {
    list = list.filter(t => {
      const hay = (t.n + ' ' + t.d + ' ' + t.s + ' ' + t.ct + ' ' + t.m + ' ' + (t.k || '')).toLowerCase();
      return words.every(w => hay.includes(w));
    });
    const rank = t => {
      const n = t.n.toLowerCase();
      if (n === term || (t.k || '').includes('|' + term + '|')) return 0;
      return n.startsWith(term) ? 1 : n.includes(term) ? 2 : 3;
    };
    list = list.slice().sort((a, b) => rank(a) - rank(b) || a.n.toLowerCase().localeCompare(b.n.toLowerCase()));
  }
  return { list, browsing };
}

function detail(t) {
  const d = el('div', 'detail');
  const about = el('div', 'about');
  about.appendChild(el('div', 'lbl mono', 'About this test'));
  const g = t.g !== undefined ? GUIDE[t.g] : null;
  if (g) {
    if (g.aka) {
      const a = el('div', 'aka');
      a.appendChild(el('span', 'mono', 'ALSO KNOWN AS  '));
      a.appendChild(document.createTextNode(g.aka));
      about.appendChild(a);
    }
    about.appendChild(el('div', 'expl', g.expl));
    const abn = (g.abn || '').split('\n').map(s => s.trim()).filter(Boolean).map(line => {
      const ix = line.indexOf(':');
      return { label: ix > -1 ? line.slice(0, ix).trim() : 'Findings',
               items: (ix > -1 ? line.slice(ix + 1) : line).split(';').map(s => s.trim()).filter(Boolean) };
    });
    if (abn.length) {
      const box = el('div', 'abn');
      box.appendChild(el('div', 'lbl mono', 'Abnormal findings — main causes'));
      abn.forEach(a => {
        const grp = el('div', 'grp');
        grp.appendChild(el('div', 'gl', a.label));
        const chips = el('div', 'chips');
        a.items.forEach(c => chips.appendChild(el('span', null, c)));
        grp.appendChild(chips);
        box.appendChild(grp);
      });
      about.appendChild(box);
    }
    about.appendChild(el('div', 'src mono', g.src === 'm' ? "Source: Mosby's Diagnostic and Laboratory Test Reference" : g.src === 'f' ? "Source: A Manual of Laboratory and Diagnostic Tests" : g.src === 't' ? "Source: Tietz Textbook of Laboratory Medicine (7th ed.)" : "General summary — confirm against the lab's reference before clinical use"));
  }
  d.appendChild(about);
  const fields = el('div', 'fields');
  [['Sample type', t.s], ['Container', t.ct], ['Collection method', t.m], ['Department', t.d]]
    .filter(f => f[1]).forEach(([k, v]) => {
      const f = el('div');
      f.appendChild(el('div', 'lbl mono', k));
      f.appendChild(el('div', 'v', v));
      fields.appendChild(f);
    });
  d.appendChild(fields);
  if (t.h) {
    const h = el('div', 'handling');
    h.appendChild(el('span', 'hd'));
    const s = el('span');
    s.appendChild(el('div', 'hl mono', 'Special handling'));
    s.appendChild(el('div', 'hv', t.h));
    h.appendChild(s);
    d.appendChild(h);
  }
  return d;
}

function render() {
  $('clear').hidden = state.q.length === 0;

  const L = $('letters'); L.textContent = '';
  alphabet.forEach(ch => {
    const b = el('button', state.letter === ch ? 'on' : '', ch === 'All' ? '·' : ch);
    b.onclick = () => set({ letter: ch });
    L.appendChild(b);
  });
  const D = $('depts'); D.textContent = '';
  deptNames.forEach(dn => {
    const b = el('button', state.dept === dn ? 'on' : '', dn === 'All' ? 'All departments' : dn);
    b.onclick = () => set({ dept: dn });
    D.appendChild(b);
  });

  const { list, browsing } = filtered();
  const shown = list.slice(0, state.limit);
  $('count').textContent = browsing ? list.length + (list.length === 1 ? ' test' : ' tests') : TESTS.length + ' tests indexed';
  $('scope').textContent = browsing
    ? ([state.dept !== 'All' ? state.dept : null, state.letter !== 'All' ? state.letter : null].filter(Boolean).join(' · ') || 'Showing ' + shown.length)
    : 'Search or pick a letter to begin';

  const box = $('list'); box.textContent = '';
  shown.forEach((t, i) => {
    const key = t.n + '|' + i;
    const isOpen = state.open === key;
    const card = el('div', 'card' + (isOpen ? ' open' : ''));
    const row = el('button', 'row');
    const dot = el('span', 'dot'); dot.style.background = tubeColor(t.ct);
    const names = el('span', 'names');
    names.appendChild(el('span', 'n', t.n));
    names.appendChild(el('span', 's mono', [t.s, t.ct].filter(Boolean).join('  ·  ') || 'Details inside'));
    row.append(dot, names, el('span', 'pill mono', t.d || '—'), el('span', 'chev'));
    row.onclick = () => { state.open = isOpen ? null : key; render(); };
    card.appendChild(row);
    if (isOpen) card.appendChild(detail(t));
    box.appendChild(card);
  });

  $('empty').hidden = !(browsing && list.length === 0);
  $('more').hidden = !(list.length > shown.length);
}

$('q').addEventListener('input', e => set({ q: e.target.value, letter: 'All' }));
$('clear').onclick = () => { $('q').value = ''; set({ q: '' }); };
$('more').querySelector('button').onclick = () => { state.limit += 60; render(); };
render();
</script>
</body>
</html>
