<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Test Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --accent: #3c5c3a; --tint: rgba(60,92,58,0.10); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f6f5f2; color: #1a1c1b; font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .wrap { max-width: 940px; margin: 0 auto; padding: 40px 20px 80px; }
  header { display: flex; flex-direction: column; gap: 6px; padding: 24px 0 28px; }
  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
  .lede { margin: 4px 0 0; font-size: 15px; color: #6d6f6c; max-width: 56ch; text-wrap: pretty; }
  .bar { position: sticky; top: 0; z-index: 5; background: #f6f5f2; padding: 10px 0 12px; border-bottom: 1px solid #e4e2dc; }
  .search { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #d9d7d0; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(20,20,18,.04); }
  .search .ring { width: 16px; height: 16px; border: 2px solid var(--accent); border-radius: 50%; flex: none; }
  .search input { flex: 1; border: none; background: transparent; font: inherit; font-size: 17px; color: #1a1c1b; min-width: 0; outline: none; }
  .search input::placeholder { color: #9a9891; }
  .clear { border: none; background: #efeee9; color: #6d6f6c; font-size: 12px; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  .letters { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
  .letters button { border: none; background: transparent; color: #6d6f6c; font-size: 12px; width: 26px; height: 26px; border-radius: 5px; cursor: pointer; padding: 0; }
  .letters button.on { background: var(--accent); color: #fff; }
  .depts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .depts button { border: 1px solid #dddbd4; background: #fff; color: #6d6f6c; font-size: 11px; letter-spacing: .06em; padding: 6px 10px; border-radius: 6px; cursor: pointer; line-height: 1; }
  .depts button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .meta { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding: 22px 2px 10px; font-size: 12px; color: #8a8880; letter-spacing: .04em; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .card { background: #fff; border: 1px solid #e4e2dc; border-radius: 10px; overflow: hidden; }
  .row { width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: transparent; border: none; text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .row:hover { background: #fbfaf7; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .names { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .names .n { font-size: 16px; font-weight: 500; line-height: 1.3; }
  .names .s { font-size: 12px; color: #8a8880; }
  .pill { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 5px 9px; border-radius: 5px; white-space: nowrap; color: var(--accent); background: var(--tint); }
  .chev { width: 7px; height: 7px; border-right: 1.5px solid #b0aea6; border-bottom: 1.5px solid #b0aea6; flex: none; transform: rotate(45deg); transition: transform .15s; }
  .card.open .chev { transform: rotate(-135deg); }
  .detail { border-top: 1px solid #eeece6; background: #fcfbf9; padding: 20px 18px 22px; }
  .about { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px dashed #e4e2dc; display: flex; flex-direction: column; gap: 14px; }
  .lbl { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #9a9891; }
  .aka { font-size: 13px; color: #6d6f6c; line-height: 1.45; }
  .aka span { font-size: 11px; letter-spacing: .06em; color: #8a8880; }
  .expl { font-size: 15px; color: #3a3c39; line-height: 1.55; max-width: 68ch; text-wrap: pretty; }
  .abn { display: flex; flex-direction: column; gap: 10px; }
  .abn .grp { display: flex; flex-direction: column; gap: 6px; }
  .abn .gl { font-size: 13px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-size: 13px; color: #3a3c39; background: #fff; border: 1px solid #e4e2dc; border-radius: 5px; padding: 4px 8px; line-height: 1.3; }
  .src { font-size: 11px; letter-spacing: .04em; color: #8a8880; line-height: 1.45; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 18px 24px; }
  .fields .v { font-size: 15px; line-height: 1.45; margin-top: 5px; text-wrap: pretty; }
  .handling { margin-top: 18px; display: flex; gap: 12px; align-items: flex-start; background: #fdf6e9; border: 1px solid #f0e2c4; border-radius: 8px; padding: 12px 14px; }
  .handling .hd { width: 8px; height: 8px; border-radius: 50%; background: #c98a14; margin-top: 6px; flex: none; }
  .handling .hl { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #9a7b32; }
  .handling .hv { font-size: 15px; color: #4a3c1c; line-height: 1.45; margin-top: 3px; }
  .empty { text-align: center; padding: 70px 20px; color: #8a8880; }
  .empty div:first-child { font-size: 17px; color: #1a1c1b; margin-bottom: 6px; }
  .more { display: flex; justify-content: center; padding: 26px 0 0; }
  .more button { border: 1px solid #d9d7d0; background: #fff; color: #1a1c1b; font-size: 12px; letter-spacing: .06em; padding: 12px 22px; border-radius: 8px; cursor: pointer; }
  .more button:hover { background: #f1efea; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow mono">Laboratory Services</div>
    <h1>Test Directory</h1>
    <p class="lede">Search by test name to see what the test is for.</p>
  </header>
  <div class="bar">
    <div class="search">
      <div class="ring"></div>
      <input id="q" type="text" placeholder="Search tests, e.g. Vitamin D, CBC, Culture" autocomplete="off">
      <button id="clear" class="clear mono" hidden>Clear</button>
    </div>
    <div id="letters" class="letters mono"></div>
    <div id="depts" class="depts mono"></div>
  </div>
  <div class="meta mono"><span id="count"></span><span id="scope"></span></div>
  <div id="list" class="list"></div>
  <div id="empty" class="empty" hidden><div>No tests found</div><div style="font-size:14px">Try a shorter term, or check the specimen name instead.</div></div>
  <div id="more" class="more" hidden><button class="mono">LOAD MORE</button></div>
</div>

const GUIDE = [{"aka":"AChR Ab, Anti–AChR antibody","expl":"Looks for antibodies that attack the muscle's acetylcholine receptors, which stops nerve signals reaching the muscle. A positive result strongly points to myasthenia gravis; levels are also used to follow how well treatment is working.","abn":"Increased titer levels: Myasthenia gravis; Ocular myasthenia gravis; Thymoma","src":"m"},{"aka":"Prostatic acid phosphatase [PAP], Tartrate-resistant acid phosphatase [TRAP]","expl":"Measures an enzyme made mainly by the prostate. Today it is rarely used for prostate cancer (PSA is better); its main use is detecting semen in forensic samples, and it can also rise in some bone and lysosomal storage diseases.","abn":"Increased levels: Prostatic carcinoma; Benign prostatic hypertrophy; Prostatitis; Multiple myeloma; Paget disease; Hyperparathyroidism; Metastasis to the bone; Sickle cell crisis; Thrombocytosis; Lysosomal disorders (e.g., Gaucher disease); Renal diseases; Liver diseases (e.g., cirrhosis); Rape","src":"m"},{"aka":"ACT, Activated coagulation time","expl":"A quick bedside clotting test that shows how long whole blood takes to clot. It is used to check the heparin dose during heart surgery, bypass, angioplasty and dialysis.","abn":"Increased levels: Heparin administration; Clotting factor deficiencies; Cirrhosis of the liver; Lupus inhibitor; Warfarin administration\nDecreased levels: Thrombosis","src":"m"},{"aka":"Androstenediones [AD], Dehydroepiandrosterone [DHEA], Dehydroepiandrosterone sulfate [DHEA S], 11-Deoxycortisol, 17-Hydroxyprogesterone, 17-Hydroxypregnenolone, Pregnenolone","expl":"Measures the building blocks the adrenal glands use to make cortisol and sex hormones. Abnormal patterns help diagnose congenital adrenal hyperplasia, adrenal tumours and causes of excess male hormones.","abn":"Increased levels: Adrenal tumor; Congenital adrenal hyperplasia; Ectopic ACTH-producing tumors; Cushing syndrome (some cases); Stein-Leventhal syndrome; Ovarian sex cord tumor\nDecreased levels: Gonadal failure; Primary or secondary adrenal insufficiency","src":"m"},{"aka":"ALT, formerly Serum glutamic-pyruvic transaminase [SGPT]","expl":"Measures ALT, an enzyme found mostly in liver cells. When the liver is damaged ALT leaks into the blood, so high levels are a sensitive sign of liver injury such as hepatitis.","abn":"Increased levels: Hepatitis; Hepatic necrosis; Hepatic ischemia; Cirrhosis; Cholestasis; Hepatic tumor; Hepatotoxic drugs; Obstructive jaundice; Severe burns; Trauma to striated muscle; Myositis; Pancreatitis; Myocardial infarction; Infectious mononucleosis; Shock","src":"m"},{"aka":"","expl":"Measures aldolase, an enzyme found mainly in muscle and liver. High levels mostly suggest muscle damage, such as muscular dystrophy or inflammatory muscle disease.","abn":"Increased levels: Hepatocellular diseases (e.g., hepatitis); Muscular diseases (e.g., muscular dystrophy, dermatomyositis, and polymyositis); Muscular trauma (e.g., severe crush injuries); Muscular infections (e.g., trichinosis); Gangrenous processes (e.g., gangrene of the bowel); Myocardial infarction\nDecreased levels: Late muscular dystrophy; Hereditary fructose intolerance; Muscle-wasting disease","src":"m"},{"aka":"","expl":"Measures aldosterone, the adrenal hormone that controls salt, potassium and blood pressure. It is mainly used to diagnose hyperaldosteronism as a cause of high blood pressure.","abn":"Increased levels: Primary aldosteronism; Aldosterone-producing adrenal adenoma (Conn syndrome); Adrenal cortical nodular hyperplasia; Bartter syndrome; Secondary aldosteronism; Hyponatremia; Hyperkalemia; Diuretic ingestion resulting in hypovolemia and hyponatremia; Laxative abuse; Stress; Malignant hypertension; Generalized edema; Renal arterial stenosis; Pregnancy; Oral contraceptives; Hypovolemia or hemorrhage; Cushing syndrome\nDecreased levels: Aldosterone deficiency; Renin deficiency; Steroid therapy; Addison disease; Patients on a high sodium diet; Hypernatremia; Hypokalemia; Toxemia of pregnancy; Antihypertensive therapy","src":"m"},{"aka":"ALP","expl":"Measures ALP, an enzyme found mainly in the liver bile ducts and in bone. High levels point to bile duct blockage or liver disease, or to increased bone activity such as bone tumours or Paget disease.","abn":"Increased levels: Cirrhosis; Intrahepatic or extrahepatic biliary obstruction; Primary or metastatic liver tumor; Intestinal ischemia or infarction; Metastatic tumor to the bone; Healing fracture; Hyperparathyroidism; Paget disease of bone; Rheumatoid arthritis; Sarcoidosis; Osteomalacia; Rickets\nDecreased levels: Hypothyroidism; Malnutrition; Milk-alkali syndrome; Pernicious anemia; Hypophosphatemia; Scurvy (vitamin C deficiency); Celiac disease; Excess vitamin B ingestion; Hypophosphatasia","src":"m"},{"aka":"AFP, a1-Fetoprotein","expl":"Measures AFP, a protein made by the fetal liver. In pregnancy it screens for neural tube defects and Down syndrome; in adults high levels can indicate liver or testicular cancer.","abn":"Increased maternal AFP levels: Neural tube defects (e.g., anencephaly, encephalocele, spina bifida, myelomeningocele); Abdominal wall defects (e.g., gastroschisis or omphalocele); Multiple pregnancy; Threatened abortion; Fetal distress or congenital anomalies; Fetal death\nDecreased maternal serum AFP levels: Trisomy 21 (Down syndrome); Fetal wastage\nIncreased nonmaternal AFP levels: Primary hepatocellular cancer (hepatoma); Germ cell or yolk sac cancer of the ovary; Embryonal cell or germ cell tumor of the testes; Other cancers (e.g., stomach, colon, lung, breast, or lymphoma); Liver cell necrosis (e.g., cirrhosis or hepatitis)","src":"m"},{"aka":"Amino acid screen","expl":"Measures the levels of individual amino acids in blood or urine. It helps diagnose inherited metabolic disorders such as PKU and maple syrup urine disease.","abn":"Increased blood levels: Specific aminoacidopathies (e.g., PKU, maple syrup disease); Specific aminoacidemias (e.g., glutaric aciduria)\nDecreased blood levels: Hartnup disease; Nephritis; Nephrotic syndromes\nIncreased urine levels: Specific aminoacidurias (e.g., cystinuria, homocystinuria)","src":"m"},{"aka":"","expl":"Measures ammonia, a waste product the liver normally converts to urea. High levels suggest severe liver disease, hepatic encephalopathy or Reye syndrome.","abn":"Increased levels: Primary hepatocellular disease; Reye syndrome; Asparagine intoxication; Portal hypertension; Severe heart failure with congestive hepatomegaly; Hemolytic disease of the newborn (erythroblastosis fetalis); Gastrointestinal bleeding with mild liver disease; Gastrointestinal obstruction with mild liver disease; Hepatic encephalopathy and hepatic coma; Genetic metabolic disorder of the urea cycle\nDecreased levels: Essential or malignant hypertension; Hyperornithinemia","src":"m"},{"aka":"Amniotic fluid analysis","expl":"A needle is passed through the abdomen to take a sample of amniotic fluid. The fluid is tested for genetic problems, neural tube defects, infection and fetal lung maturity.","abn":"Hemolytic disease of the newborn; Rh isoimmunization; Neural tube closure defects (e.g., myelomeningocele, anencephaly, spina bifida); Abdominal wall closure defects (e.g., gastroschisis, omphalocele); Sacrococcygeal teratoma; Meconium staining; Immature fetal lungs; Hereditary metabolic disorders (e.g., cystic fibrosis, Tay-Sachs disease, galactosemia); Genetic or chromosomal aberrations (e.g., sickle cell anemia, thalassemia, trisomy 21 [Down syndrome]); Sex-linked disorders (e.g., hemophilia); Polyhydramnios; Oligohydramnios","src":"m"},{"aka":"","expl":"Measures amylase, a digestive enzyme from the pancreas and salivary glands. High levels in blood or urine are mainly used to diagnose acute pancreatitis.","abn":"Increased levels: Acute or chronic relapsing pancreatitis; Penetrating or perforated peptic ulcer; Necrotic or perforated bowel; Acute cholecystitis; Parotiditis (mumps); Ectopic pregnancy; Pulmonary infarction; Diabetic ketoacidosis; Duodenal obstruction; Osteogenic sarcoma; Cryoglobulinemia; Rheumatoid diseases","src":"m"},{"aka":"ACE, Serum angiotensin-converting enzyme [SACE]","expl":"Measures ACE, an enzyme made in large amounts by granulomas. It is used mainly to diagnose and follow sarcoidosis.","abn":"Increased levels: Sarcoidosis; Gaucher disease; Tuberculosis; Leprosy; Alcoholic cirrhosis\nIncreased levels (continued): Active histoplasmosis; Hodgkin disease; Myeloma; Idiopathic pulmonary fibrosis; Diabetes mellitus; Primary biliary cirrhosis; Amyloidosis; Hyperthyroidism; Scleroderma; Pulmonary embolism","src":"m"},{"aka":"ADH, Vasopressin","expl":"Measures ADH (vasopressin), which controls how much water the kidneys keep. It helps diagnose SIADH (too much) and diabetes insipidus (too little).","abn":"Increased levels: Syndrome of inappropriate antidiuretic hormone (SIADH); Nephrogenic diabetes insipidus caused by primary renal diseases; Postoperative days 1-3; Severe physical stress (e.g., trauma, pain, prolonged mechanical ventilation); Hypovolemia; Dehydration; Acute porphyria\nDecreased levels: Neurogenic (or central) diabetes insipidus; Surgical ablation of the pituitary gland; Hypervolemia; Decreased serum osmolality; Primary polydipsia","src":"m"},{"aka":"Anti-ENAs, Antibodies to extractable nuclear antigens, Antihistidyl transfer synthase [anti–Jo-1], Antiribonucleoprotein [anti-RNP], Anti-Smith [anti-SM]","expl":"Looks for antibodies to specific nuclear antigens (Smith, RNP, Jo-1 etc.). The pattern helps tell lupus, mixed connective tissue disease and other autoimmune diseases apart.","abn":"Increased anti-SM antibodies: Systemic lupus erythematosus\nIncreased anti-RNP antibodies: Mixed connective tissue disease; Systemic lupus erythematosus; Discoid lupus scleroderma\nIncreased anti–Jo-1 antibodies: Pulmonary fibrosis; Autoimmune myositis","src":"m"},{"aka":"Anti-GBM antibody, AGBM, Glomerular basement antibody, Goodpasture antibody","expl":"Looks for antibodies that attack the filtering membrane in the kidney (and lung). A positive result points to Goodpasture syndrome.","abn":"Positive; Goodpasture syndrome; Autoimmune glomerulonephritis; Lupus nephritis","src":"m"},{"aka":"ANCA","expl":"Looks for ANCA antibodies against neutrophils. They help diagnose and monitor small-vessel vasculitis such as granulomatosis with polyangiitis (Wegener).","abn":"Increased levels: Wegener granulomatosis; Microscopic polyarteritis; Idiopathic crescentic glomerulonephritis; Ulcerative colitis; Primary sclerosing cholangitis; Autoimmune hepatitis; Churg-Strauss vasculitis; Active viral hepatitis; Crohn disease","src":"m"},{"aka":"ANA","expl":"A screening test for antibodies against the cell nucleus. A positive ANA is seen in lupus and many other autoimmune diseases, and leads on to more specific tests.","abn":"Increased levels: Systemic lupus erythematosus; Rheumatoid arthritis; Chronic hepatitis; Periarteritis (polyarteritis) nodosa; Dermatomyositis; Scleroderma; Infectious mononucleosis; Raynaud disease; Sjögren syndrome; Other immune diseases; Leukemia; Myasthenia gravis; Cirrhosis","src":"m"},{"aka":"APCA","expl":"Looks for antibodies against stomach parietal cells, which make intrinsic factor. They are found in most people with pernicious anaemia and atrophic gastritis.","abn":"Increased levels: Pernicious anemia; Atrophic gastritis; Hashimoto thyroiditis; Myxedema; Insulin-dependent diabetes mellitus; Addison disease","src":"m"},{"aka":"Scl-70 antibody, Anti-topoisomerase I, Scleroderma antibody, RNA polymerase III antibody","expl":"Looks for Scl-70 (anti-topoisomerase I) antibodies. A positive result is specific for systemic scleroderma.","abn":"Positive results; Scleroderma; CREST syndrome","src":"m"},{"aka":"ASMA","expl":"Looks for antibodies against smooth muscle (actin). It is mainly used to diagnose autoimmune hepatitis.","abn":"Increased levels: Chronic active hepatitis; Mononucleosis hepatitis; Primary biliary cirrhosis; Viral hepatitis; Multiple sclerosis; Malignancy; Intrinsic asthma","src":"m"},{"aka":"Thyroid autoantibody, Thyroid antithyroglobulin antibody, Thyroglobulin antibody","expl":"Looks for antibodies against thyroglobulin. They are a marker of autoimmune thyroid disease such as Hashimoto thyroiditis.","abn":"Increased levels: Hashimoto thyroiditis; Rheumatoid arthritis; Rheumatoid-collagen disease; Pernicious anemia; Thyrotoxicosis; Hypothyroidism; Thyroid carcinoma; Myxedema; Autoimmune hemolytic anemia","src":"m"},{"aka":"Anti-TPO, TPO-Ab, Antithyroid microsomal antibody, Thyroid autoantibody","expl":"Looks for antibodies against thyroid peroxidase (TPO). They are the main marker of Hashimoto thyroiditis and are also common in Graves disease.","abn":"Increased levels: Hashimoto thyroiditis; Rheumatoid arthritis; Rheumatoid-collagen disease; Pernicious anemia; Thyrotoxicosis; Hypothyroidism; Thyroid carcinoma; Myxedema","src":"m"},{"aka":"","expl":"Measures the proteins that carry fats in the blood (apo A-I and apo B). They give an extra estimate of heart and blood vessel disease risk beyond standard cholesterol.","abn":"Increased apo A-I: Familial hyperalphalipoproteinemia; Pregnancy; Weight reduction\nDecreased apo A-I: Coronary artery disease; Ischemic coronary disease; Myocardial infarction; Familial hypoalphalipoproteinemia; Fish eye disease; Uncontrolled diabetes mellitus; Tangier disease; Nephrotic syndrome; Chronic renal failure; Cholestasis; Hemodialysis\nIncreased apo B: Hyperlipoproteinemia (types IIa, IIb, IV, V); Nephrotic syndrome; Pregnancy; Hemodialysis; Biliary obstruction; Coronary artery disease; Diabetes mellitus; Hypothyroidism; Anorexia nervosa; Renal failure\nDecreased apo B: Tangier disease; Hyperthyroidism; Malnutrition; Inflammatory joint disease; Chronic pulmonary disease; Weight reduction; Chronic anemia; Reye syndrome\nIncreased Lp(a): Premature coronary artery disease; Stenosis of cerebral arteries; Uncontrolled diabetes mellitus; Severe hypothyroidism; Familial hypercholesterolemia; Chronic renal failure; Estrogen depletion\nDecreased Lp(a): Alcoholism; Malnutrition; Chronic hepatocellular disease\nDecreased Apo E4 gene: Alzheimer disease","src":"m"},{"aka":"AST; Formerly called serum glutamic-oxaloacetic transaminase [SGOT]","expl":"Measures AST, an enzyme found in the liver, heart and muscle. High levels suggest liver cell damage, and less often heart or muscle injury.","abn":"Increased levels: Liver diseases; Hepatitis; Hepatic cirrhosis; Drug-induced liver injury; Hepatic metastasis; Hepatic necrosis (initial stages only); Hepatic surgery; Infectious mononucleosis with hepatitis; Hepatic infiltrative process (e.g., tumor); Skeletal muscle disveases; Skeletal muscle trauma; Recent noncardiac surgery; Multiple traumas; Severe, deep burns\nDecreased levels: Acute renal disease; Beriberi; Diabetic ketoacidosis; Pregnancy; Chronic renal dialysis\nIncreased levels: Skeletal muscle disveases (cont.); Progressive muscular dystrophy; Recent convulsions; Heat stroke; Primary muscle diseases (e.g., myopathy, myositis); Other diseases; Acute hemolytic anemia; Acute pancreatitis","src":"m"},{"aka":"BMP, Chemistry panel, Chem 7, Sequential multiple analysis [SMA] 7, SMAC 7, Chemistry Screen","expl":"A panel of eight common blood tests (glucose, calcium, sodium, potassium, chloride, CO2, urea and creatinine). It gives a quick picture of kidney function, electrolytes and blood sugar.","abn":"","src":"m"},{"aka":"Cholic acid, Chenodeoxycholic acid, Deoxycholic acid, Ursodeoxycholic acid","expl":"Measures bile acids in the blood. Raised levels are a sensitive sign of liver disease or reduced bile flow (cholestasis), including in pregnancy.","abn":"Increased bile acids Primary hepatocellular diseases Cholestasis Metabolic diseases of conjugated bile acids Portal vein obstruction Cirrhosis\nDecreased Bile Acids Malabsorption Metabolic abnormalities in bile acid synthesis","src":"m"},{"aka":"","expl":"Measures bilirubin, the yellow pigment made when red cells break down. High levels cause jaundice; the direct/indirect split shows whether the cause is red cell breakdown, liver disease or bile duct blockage.","abn":"Increased levels of conjugated (direct) bilirubin: Gallstones; Extrahepatic duct obstruction (tumor, inflammation, gallstone, scarring, or surgical trauma); Extensive liver metastasis; Cholestasis from drugs; Dubin–Johnson syndrome; Rotor syndrome\nIncreased levels of unconjugated (indirect) bilirubin: Hemolytic disease of the newborn; Hemolytic jaundice; Large-volume blood transfusion; Resolution of a large hematoma; Hepatitis; Sepsis; Neonatal hyperbilirubinemia; Hemolytic anemia; Crigler–Najjar syndrome; Gilbert syndrome; Pernicious anemia; Cirrhosis; Transfusion reaction; Sickle cell anemia","src":"m"},{"aka":"Blood group microarray testing","expl":"Finds a person's ABO group and Rh (D) type. It is essential before transfusion, in pregnancy and before organ transplant.","abn":"No list given in the source","src":"m"},{"aka":"","expl":"Measures urea nitrogen, a waste product of protein that the kidneys remove. High levels usually mean reduced kidney function or dehydration.","abn":"Increased levels: Prerenal causes; Hypovolemia; Shock; Burns; Dehydration; Congestive heart failure; Myocardial infarction; GI bleeding; Excessive protein ingestion; Alimentary tube feeding; Excessive protein catabolism; Starvation; Sepsis; Renal causes; Renal disease (e.g., glomerulonephritis, pyelonephritis, acute tubular necrosis); Renal failure; Nephrotoxic drugs; Postrenal azotemia; Ureteral obstruction; Bladder outlet obstruction\nDecreased levels: Liver failure; Overhydration caused by fluid overload or syndrome of inappropriate antidiuretic hormone (SIADH); Negative nitrogen balance (e.g., malnutrition or malabsorption); Pregnancy; Nephrotic syndrome","src":"m"},{"aka":"(Human calcitonin [HCT], Thyrocalcitonin), Procalcitonin (PCT)","expl":"Measures calcitonin, a hormone from the thyroid's C cells. High levels are a marker for medullary thyroid cancer.","abn":"Increased levels: Medullary carcinoma of the thyroid; C-cell hyperplasia; Oat cell carcinoma of the lung; Breast carcinoma; Pancreatic cancer; Primary hyperparathyroidism; Secondary hyperparathyroidism because of chronic renal failure; Pernicious anemia; Zollinger–Ellison syndrome; Alcoholic cirrhosis; Thyroiditis","src":"m"},{"aka":"Total/ionized calcium, Ca, Serum calcium","expl":"Measures calcium in blood or urine. Abnormal levels point to problems with the parathyroid glands, bones, kidneys or some cancers.","abn":"Increased levels (hypercalcemia): Hyperparathyroidism; Nonparathyroid PTHproducing tumor (e.g., lung or renal carcinoma); Metastatic tumor to the bone; Paget disease of bone; Prolonged immobilization; Milk-alkali syndrome; Vitamin D intoxication; Lymphoma; Granulomatous infections (e.g., sarcoidosis and tuberculosis); Addison disease; Acromegaly; Hyperthyroidism\nDecreased levels (hypocalcemia): Hypoparathyroidism; Renal failure; Hyperphosphatemia secondary to renal failure; Rickets; Vitamin D deficiency; Osteomalacia; Malabsorption; Pancreatitis; Fat embolism; Alkalosis; Hypoalbuminemia","src":"m"},{"aka":"Prenatal cell-free DNA screening, Noninvasive prenatal testing [NIPT], cell-free DNA in maternal blood, cf DNA screening","expl":"Looks at fragments of fetal DNA in the mother's blood. It screens for Down syndrome and other chromosome problems from early pregnancy.","abn":"Trisomy 21 (Down syndrome); Trisomy 18 (Edwards syndrome); Trisomy 13 (Patau syndrome); Duchenne muscular dystrophy; Hemophilia","src":"m"},{"aka":"CL","expl":"Measures chloride in the blood. It is used with sodium and bicarbonate to assess fluid and acid–base balance.","abn":"Increased levels (hyperchloremia): Dehydration; Renal tubular acidosis; Excessive infusion of normal saline; Cushing syndrome; Eclampsia; Multiple myeloma; Kidney dysfunction; Metabolic acidosis; Hyperventilation; Anemia; Respiratory alkalosis; Hyperparathyroidism\nDecreased levels (hypochloremia): Overhydration; Congestive heart failure; Syndrome of inappropriate antidiuretic hormone; Vomiting; Chronic gastric suction; Chronic respiratory acidosis; Salt-losing nephritis; Addison disease; Burns; Metabolic alkalosis; Diuretic therapy; Hypokalemia; Aldosteronism; Respiratory acidosis","src":"m"},{"aka":"","expl":"Measures total cholesterol in the blood. High levels increase the risk of heart disease and stroke.","abn":"Increased levels: Hypercholesterolemia; Hyperlipidemia; Hypothyroidism; Uncontrolled diabetes mellitus; Nephrotic syndrome; Pregnancy; High-cholesterol diet; Xanthomatosis; Hypertension; Myocardial infarction; Atherosclerosis; Biliary cirrhosis; Stress; Nephrosis\nDecreased levels: Malabsorption; Malnutrition; Hyperthyroidism; Cholesterol-lowering medication; Pernicious anemia; Hemolytic anemia; Sepsis; Stress; Liver disease; Acute myocardial infarction","src":"m"},{"aka":"Blood chromosome analysis, Chromosome studies, Cytogenetics, Karyotype","expl":"Chromosomes are counted and examined under the microscope. It detects conditions such as Down syndrome and other chromosome abnormalities.","abn":"Congenital anomalies; Mental retardation; Growth retardation; Delayed puberty; Infertility; Hypogonadism; Primary amenorrhea; Ambiguous genitalia; Chronic myelogenous leukemia; Neoplasm; Recurrent miscarriage; Trisomy 21 (Down syndrome); Tay–Sachs disease; Sickle cell anemia; Turner syndrome; Klinefelter syndrome","src":"m"},{"aka":"","expl":"Looks for antibodies that clump red cells at cold temperatures. They are seen in Mycoplasma pneumonia, some viral infections and cold agglutinin disease.","abn":"Increased levels: Mycoplasma pneumoniae infection; Viral illness; Infectious mononucleosis; Multiple myeloma; Scleroderma; Cirrhosis; Staphylococcemia; Thymic tumor; Influenza; Rheumatoid arthritis; Lymphoma; Systemic lupus erythematosus; Primary cold agglutinin disease","src":"m"},{"aka":"Microsatellite instability [MSI] testing, DNA mismatch repair [MMR] genetic testing, BRAF mutation analysis, Oncotype DX colon cancer assay","expl":"Colorectal cancer tissue is tested for genetic and molecular changes (e.g. KRAS, MSI). The results guide treatment choices and screening of relatives.","abn":"Unfavorable test results indicating a high risk of cancer reoccurrence","src":"m"},{"aka":"Total, C3 and C4 complement","expl":"Measures complement proteins (C3, C4, total) that help the immune system. Low levels are seen in active lupus and some kidney diseases.","abn":"Increased levels: Rheumatic fever (acute); Myocardial infarction (acute); Ulcerative colitis; Cancer\nDecreased levels: Cirrhosis; Autoimmune disease (e.g., systemic lupus erythematosus); Serum sickness (immune complex disease); Glomerulonephritis; Lupus nephritis; Renal transplant rejection (acute); Protein malnutrition; Anemia; Malnutrition; Hepatitis; Rheumatoid arthritis; Sjögren syndrome; Severe sepsis","src":"m"},{"aka":"(CMP, Chem 12, Chemistry panel, SMA 12 (Sequential Multiple Analysis), SMA 20","expl":"A panel of about 14 tests including glucose, electrolytes, kidney tests, liver enzymes and proteins. It is a broad check of organ function and metabolism.","abn":"","src":"m"},{"aka":"Direct antiglobulin test [DAT]","expl":"Detects antibodies or complement already stuck to the patient's red cells. It helps diagnose autoimmune haemolytic anaemia, transfusion reactions and haemolytic disease of the newborn.","abn":"Autoimmune hemolytic anemia; Transfusion reaction; Hemolytic disease of the newborn; Lymphoma; Systemic lupus erythematosus; Mycoplasmal infection; Infectious mononucleosis","src":"m"},{"aka":"Blood antibody screening, Indirect antiglobulin test [IAT]","expl":"Detects free antibodies in the patient's serum against red cells. It is used in cross-matching blood and in antenatal antibody screening.","abn":"Incompatible cross-matched blood; Maternal anti-Rh antibodies; Hemolytic disease of the newborn; Acquired immune hemolytic anemia; Presence of specific cold agglutinin antibody","src":"m"},{"aka":"Hydrocortisone, Serum cortisol, Salivary cortisol, Total cortisol, Free cortisol","expl":"Measures cortisol, the main stress hormone. High levels suggest Cushing syndrome and low levels suggest adrenal insufficiency.","abn":"Increased levels: Cushing syndrome; Adrenal adenoma or carcinoma; Ectopic ACTH-producing tumors; Hyperthyroidism; Obesity; Stress\nDecreased levels: Congenital adrenal hyperplasia; Addison disease; Hypopituitarism; Hypothyroidism; Liver disease","src":"m"},{"aka":"Connecting peptide insulin, Insulin C-peptide, Proinsulin C-peptide","expl":"Measures C-peptide, released in equal amounts with insulin. It shows how much insulin the body itself is making.","abn":"Increased levels: Insulinoma; Renal failure; Pancreas transplant; Type 2 diabetes mellitus\nDecreased levels: Factitious hypoglycemia; Radical pancreatectomy; Type 1 diabetes mellitus","src":"m"},{"aka":"CRP, High-sensitivity C-reactive protein [hs-CRP], Ultra-sensitive CRP","expl":"Measures CRP, a protein made by the liver during inflammation. It is a general marker of infection and inflammation; the high-sensitivity form estimates heart risk.","abn":"Increased levels: Arthritis; Acute rheumatic fever; Reiter syndrome; Crohn disease; Vasculitis syndrome; Systemic lupus erythematosus; Tissue infarction or damage; Acute myocardial infarction; Pulmonary infarction; Kidney transplant rejection; Bone marrow transplant rejection; Soft tissue trauma; Bacterial infection; Postoperative wound infection; Urinary tract infection; Tuberculosis; Malignant disease; Bacterial meningitis","src":"m"},{"aka":"CK, Creatine phosphokinase [CPK]","expl":"Measures CK, an enzyme in muscle, heart and brain. High levels show muscle damage, and the CK-MB fraction was used for heart attack.","abn":"Increased levels of total CK: Disease or injury affecting the heart, skeletal muscle, or brain\nIncreased levels of CK-BB: Disease affecting the central nervous system; Adenocarcinoma (especially breast and lung); Pulmonary infarction\nIncreased levels of CK-MB: Acute myocardial infarction and cardiac ischemia; Cardiac surgery; Cardiac arrhythmias, defibrillation or cardioversion; Inflammatory myopathy; Muscular dystrophy; Extreme exercise\nIncreased levels of CK-MM: Rhabdomyolysis; Muscular dystrophy; Myositis; Drug-induced myopathies; Hypothyroidism; Neuroleptic malignant syndrome; Malignant hyperthermia; Exercise; Trauma and crush injuries; Recent surgery\nIncreased levels of CK-MM (continued): Electromyography; Seizures and electroconvulsive therapy; IM injections; Hypokalemia and hyponatremia","src":"m"},{"aka":"Serum creatinine","expl":"Measures creatinine, a muscle waste product cleared by the kidneys. Raised levels mean reduced kidney function.","abn":"Increased levels: Glomerulonephritis; Pyelonephritis; Acute tubular necrosis; Urinary tract obstruction; Reduced renal blood flow (e.g., shock, dehydration, congestive heart failure, atherosclerosis); Diabetic nephropathy; Nephritis; Rhabdomyolysis; Acromegaly; Gigantism\nDecreased levels: Debilitation; Decreased muscle mass (e.g., muscular dystrophy, myasthenia gravis)","src":"m"},{"aka":"CC, Estimated glomerular filtration rate [eGFR]","expl":"Compares creatinine in a 24-hour urine with the blood level. It estimates how well the kidneys are filtering (GFR).","abn":"Increased levels\nDecreased levels Exercise: Impaired kidney function; Pregnancy (e.g., renal artery atherosclerosis,; High cardiac output glomerulonephritis, acute syndromes tubular necrosis) Conditions causing decreased GFR (e.g., congestive heart failure, cirrhosis with ascites, shock, dehydration)","src":"m"},{"aka":"","expl":"Looks for proteins that clump when blood is cooled. They are linked to hepatitis C, myeloma and autoimmune disease and can cause vasculitis.","abn":"Connective tissue disease (e.g., lupus erythematosus, Sjögren syndrome, rheumatoid arthritis); Lymphoid malignancies (e.g., multiple myeloma, leukemia, Waldenström macroglobulinemia, lymphoma); Acute and chronic infections (e.g., infectious mononucleosis, endocarditis, poststreptococcal glomerulonephritis); Liver disease (e.g., hepatitis, cirrhosis)","src":"m"},{"aka":"interleukins","expl":"Measures cytokines, chemical messengers of the immune system. They help assess severe inflammation, such as sepsis or cytokine storm.","abn":"Inflammatory disease; AIDS; Various malignancies","src":"m"},{"aka":"CMV","expl":"Tests for cytomegalovirus by antibodies or viral DNA. It is important in pregnancy, newborns and people with weak immunity, such as transplant patients.","abn":"CMV infection","src":"m"},{"aka":"Fragment D-dimer, Fibrin degradation product [FDP], Fibrin split products","expl":"Measures a fragment released when a blood clot breaks down. A normal result helps rule out DVT and pulmonary embolism; high levels also occur in DIC.","abn":"Increased levels: Fibrinolysis; During thrombolytic or defibrination therapy with tissue plasminogen activator; Deep vein thrombosis; Pulmonary embolism; Arterial thromboembolism; Disseminated intravascular coagulation; Sickle cell anemia with or without vasoocclusive crisis; Pregnancy; Malignancy; Surgery","src":"m"},{"aka":"DIC screening","expl":"A group of tests (platelets, PT, aPTT, fibrinogen, D-dimer) to diagnose DIC, where clotting and bleeding happen at the same time.","abn":"Disseminated intravascular coagulation Disease Triggers coagulation system DIC Intravascular fibrin clot Damaged RBC Organ ischemia Triggers fibrinolysis Consumption of platelets and clotting factors Bleeding tendency FDP; (DIC), which may result in bleeding tendency, organ ischemia,; and hemolytic anemia. FDP, Fibrin degradation product; RBC, red; blood cell.; Platelet count (p. 703) Decreased; Prothrombin time (p. 748) Prolonged; Partial thromboplastin time Prolonged (p. 682); Coagulating factors (p. 250) Decreased factors I, II, V, VIII, X, and XIII (more commonly used for diagnosis rather than for screening); Fibrin degradation products Increased (p. 867); Fibrinogen (p. 426) Decreased; D-dimer (p. 325) Increased; Fibrinopeptide A (p. 867) Increased; Prothrombin fragment (p. 867) Increased","src":"m"},{"aka":"EBV antibody titer","expl":"Tests antibodies against the Epstein-Barr virus. The pattern shows whether a person has current, past or no infection (glandular fever).","abn":"Infectious mononucleosis; Chronic fatigue syndrome; Chronic EBV carrier state; Burkitt lymphoma; Nasopharyngeal cancer; Posttransplant lymphoproliferative disease","src":"m"},{"aka":"Osmotic fragility [OF], Red blood cell fragility","expl":"Red cells are put into salt solutions of falling strength to see how easily they burst. It helps diagnose hereditary spherocytosis.","abn":"Increased erythrocyte: Acquired hemolytic anemia; Hereditary spherocytosis; Hemolytic disease of the newborn; Pyruvate kinase deficiency; Malaria\nDecreased erythrocyte fragility: Thalassemia; Hemoglobinopathies (C and S disease); Iron deficiency anemia; Reticulocytosis","src":"m"},{"aka":"ESR, Sed rate test","expl":"Measures how fast red cells settle in a tube (ESR). It is a general sign of inflammation and is used to monitor conditions such as arthritis and vasculitis.","abn":"Increased levels: Chronic renal failure; Malignant diseases; Bacterial infection; Inflammatory diseases; Necrotic tissue diseases; Hyperfibrinogenemia; Macroglobulinemia; Severe anemias (e.g., iron deficiency or B12 deficiency)\nDecreased levels: Sickle cell anemia; Spherocytosis; Hypofibrinogenemia; Polycythemia vera","src":"m"},{"aka":"EPO","expl":"Measures erythropoietin, the kidney hormone that drives red cell production. It helps separate types of anaemia and polycythaemia.","abn":"Increased levels: Iron-deficiency anemia; Megaloblastic anemia; Hemolytic anemia; Myelodysplastic syndrome; Chemotherapy; AIDS; Pheochromocytoma; Renal cell carcinoma; Adrenal carcinoma\nDecreased levels: Polycythemia vera; Renal diseases; Renal failure","src":"m"},{"aka":"Estriol excretion, Estradiol, Estrone","expl":"Measures the different forms of oestrogen. It is used in fertility work-up, pregnancy assessment and to investigate oestrogen-producing tumours.","abn":"Increased levels: Feminization syndromes; Precocious puberty; Ovarian tumor; Testicular tumor; Adrenal tumor; Normal pregnancy; Hepatic cirrhosis; Hepatic necrosis; Hyperthyroidism\nDecreased levels: Failing pregnancy; Turner syndrome; Hypopituitarism; Primary and secondary hypogonadism; Stein-Leventhal syndrome; Menopause; Anorexia nervosa","src":"m"},{"aka":"Ethyl alcohol, Blood alcohol, Blood EtOH","expl":"Measures alcohol in blood, urine or breath. It is used for medical assessment and legal purposes.","abn":"Alcohol intoxication or overdose","src":"m"},{"aka":"FVL, Leiden factor V, Mutation analysis","expl":"Looks for the factor V Leiden gene mutation. It is the most common inherited cause of increased blood clotting risk.","abn":"Activated protein C resistance; Factor V Leiden genetic mutation (homozygous or heterozygous)","src":"m"},{"aka":"Fat absorption, Quantitative stool fat determination","expl":"Measures fat in the stool. High levels show fat malabsorption, as in pancreatic insufficiency or coeliac disease.","abn":"Increased levels: Cystic fibrosis; Malabsorption secondary to sprue, celiac disease, Whipple disease, Crohn disease, or radiation enteritis; Maldigestion secondary to obstruction of the pancreaticobiliary tree (e.g., cancer, stricture, gallstones); Short-gut syndrome secondary to surgical resection, surgical bypass, or congenital anomaly","src":"m"},{"aka":"","expl":"Measures ferritin, the body's iron store protein. Low levels show iron deficiency; high levels can show iron overload or inflammation.","abn":"Increased levels: Hemochromatosis; Hemosiderosis; Megaloblastic anemia; Hemolytic anemia; Alcoholic or inflammatory hepatocellular disease; Inflammatory disease; Advanced cancers; Chronic illnesses (e.g., leukemias, cirrhosis, chronic hepatitis); Collagen vascular diseases; Hemophagocytic syndromes; Congenital and acquired sideroblastic anemias\nDecreased levels: Severe protein deficiency; Iron-deficiency anemia; Hemodialysis","src":"m"},{"aka":"Kleihauer–Betke","expl":"Measures haemoglobin F. It helps diagnose thalassaemia and sickle cell variants and detects fetal blood in the mother's circulation.","abn":"Fetal–maternal hemorrhage; Hereditary persistence of fetal hemoglobin; Intrachorionic thrombi","src":"m"},{"aka":"Factor I, Quantitative fibrinogen","expl":"Measures fibrinogen, a protein needed to form a clot. Low levels are seen in DIC and liver disease; high levels occur with inflammation.","abn":"Increased levels: Acute inflammatory reactions (e.g., rheumatoid arthritis, glomerulonephritis); Trauma; Acute infection (e.g., pneumonia); Coronary heart disease; Cigarette smoking; Pregnancy; Cerebrovascular accident; Myocardial infarction; Peripheral arterial disease\nDecreased levels: Liver disease (e.g., hepatitis, cirrhosis); Consumptive coagulopathy; Fibrinolysins; Congenital afibrinogenemia; Advanced carcinoma; Malnutrition; Large-volume blood transfusion; Hemophagocytic lymphohistiocytosis","src":"m"},{"aka":"Folate","expl":"Measures folate, a B vitamin needed to make red cells. Low levels cause macrocytic anaemia and in pregnancy raise the risk of neural tube defects.","abn":"Increased levels: Pernicious anemia; Vegetarianism; Recent blood transfusions\nDecreased levels: Folic acid deficiency anemia; Hemolytic anemia; Malnutrition; Malabsorption syndrome (e.g., sprue, celiac disease); Malignancy; Pregnancy; Alcoholism; Anorexia nervosa","src":"m"},{"aka":"(Antifungal antibodies; Beta-D-glucan,(1,3)- β-D-glucan, Fungitell, Fungal culture, Fungal antigen assay, Fungal PCR testing)","expl":"Tests blood, tissue or fluids for fungal infections by culture, microscopy, antigens or antibodies.","abn":"Increased levels: Acute fungal infection; Previous systemic exposure to fungal disease","src":"m"},{"aka":"GGTP, γ-GTP, Gamma-glutamyl transferase [GGT]","expl":"Measures GGT, a liver enzyme. It is a sensitive sign of bile duct disease and heavy alcohol use.","abn":"Increased levels: Hepatitis; Cirrhosis; Hepatic necrosis; Hepatic tumor or metastasis; Hepatotoxic drugs; Cholestasis; Jaundice; Myocardial infarction; Alcohol ingestion; Pancreatitis; Cancer of the pancreas; Epstein-Barr virus (infectious mononucleosis); Cytomegalovirus infections; Reye syndrome","src":"m"},{"aka":"","expl":"Measures gastrin, a hormone that stimulates stomach acid. Very high levels suggest a gastrin-secreting tumour (Zollinger-Ellison syndrome).","abn":"Increased levels: Zollinger-Ellison syndrome Chronic renal failure; G-cell hyperplasia Pyloric obstruction or; Pernicious anemia gastric outlet obstruction; Atrophic gastritis Retained antrum after; Gastric carcinoma gastric surgery","src":"m"},{"aka":"Breast cancer [BRCA] and ovarian cancer, Colon cancer, Cardiovascular disease, Tay–Sachs disease, Cystic fibrosis, Melanoma, Hemochromatosis, Thyroid cancer, Paternity [parentage analysis], Forensic genetic testing","expl":"Analyses DNA to find gene changes. It is used to diagnose inherited diseases, carrier status and risk of conditions such as some cancers.","abn":"Genetic carrier state; Affected state","src":"m"},{"aka":"Oncotype DX, Genotyping, Genomics","expl":"Tests a cancer's genes to estimate the chance of recurrence and guide whether chemotherapy is needed (e.g. Oncotype DX).","abn":"High risk for the presence of cancer; Aggressive versus nonaggressive cancer; High risk for cancer recurrence; High likelihood of benefit for aggressive anticancer treatment","src":"m"},{"aka":"","expl":"Measures glucagon, the pancreatic hormone that raises blood sugar. Very high levels suggest a glucagonoma.","abn":"Increased levels: Familial hyperglucagonemia; Glucagonoma; Diabetes mellitus; Chronic renal failure; Severe stress including infection, burns, surgery, and acute hypoglycemia; Acromegaly; Hyperlipidemia; Acute pancreatitis; Pheochromocytoma\nDecreased levels: Idiopathic glucagon deficiency; Cystic fibrosis; Chronic pancreatitis; Postpancreatectomy; Cancer of the pancreas; Diabetes mellitus","src":"m"},{"aka":"Blood sugar, Fasting blood sugar [FBS]","expl":"Measures the sugar level in blood, often after fasting. It diagnoses and monitors diabetes and low blood sugar.","abn":"Increased levels (hyperglycemia): Diabetes mellitus; Acute stress response; Cushing syndrome; Pheochromocytoma; Chronic renal failure; Glucagonoma; Acute pancreatitis; Diuretic therapy; Corticosteroid therapy; Acromegaly\nDecreased levels (hypoglycemia): Insulinoma; Hypothyroidism; Hypopituitarism; Addison disease; Extensive liver disease; Insulin overdose; Starvation","src":"m"},{"aka":"GHb, GHB, Glycohemoglobin, Glycolated hemoglobin, Hemoglobin [Hb A1c], Diabetic control index","expl":"Measures HbA1c, the percentage of haemoglobin with glucose attached. It reflects average blood sugar over the past 2–3 months and is used to diagnose and monitor diabetes.","abn":"Increased levels: Newly diagnosed diabetic patient; Poorly controlled diabetic patient; Nondiabetic hyperglycemia (e.g., acute stress response, Cushing syndrome, pheochromocytoma, glucagonoma, corticosteroid therapy, or acromegaly); Splenectomized patients; Pregnancy\nDecreased levels: Hemolytic anemia; Chronic blood loss; Chronic renal failure","src":"m"},{"aka":"","expl":"Measures haptoglobin, which binds free haemoglobin. Low levels show red cells are being destroyed in the blood vessels (haemolysis).","abn":"Increased levels: Collagen vascular disease; Infection; Tissue destruction; Biliary obstruction; Nephritis; Pyelonephritis; Ulcerative colitis; Peptic ulcer; Myocardial infarction; Acute rheumatic disease; Neoplasia\nDecreased levels: Hemolytic anemia; Transfusion reactions; Prosthetic heart valves; Systemic lupus erythematosus; Primary liver disease not associated with hemolytic anemia; Hemolytic disease of the newborn; Hematoma; Tissue hemorrhage; Megaloblastic anemia; Severe malnutrition","src":"m"},{"aka":"Anti–Helicobacter pylori antibody, Campylobacter-like organism [CLO] test, H. pylori stool antigen","expl":"Tests for H. pylori, a stomach bacterium causing ulcers and gastritis, by breath, stool, blood or biopsy.","abn":"Increased levels: Acute and chronic gastritis; Duodenal ulcer; Gastric ulcer; Gastric carcinoma","src":"m"},{"aka":"Hb, Hgb","expl":"Measures haemoglobin, the oxygen-carrying protein in red cells. Low levels mean anaemia; high levels can mean polycythaemia or dehydration.","abn":"Increased levels: Congenital heart disease; Polycythemia vera; Hemoconcentration of the blood; Chronic obstructive pulmonary disease; Congestive heart failure; High altitudes; Severe burns; Dehydration\nDecreased levels: Anemia; Hemorrhage; Hemolysis; Hemoglobinopathies; Nutritional deficiency; Lymphoma; Systemic lupus erythematosus; Sarcoidosis; Kidney disease; Chronic hemorrhage; Splenomegaly; Neoplasia","src":"m"},{"aka":"Herpesvirus types 1 and 2, Herpes simplex virus types 1 and 2 [HSV 1, HSV 2], Herpes genitalis","expl":"Tests for herpes simplex virus (HSV-1 and HSV-2) by PCR, culture or antibodies. It confirms cold sores, genital herpes and herpes infections of the brain or newborn.","abn":"Herpesvirus infection","src":"m"},{"aka":"Hexosaminidase A, Hex A, Total hexosaminidase, Hexosaminidase A and B","expl":"Measures hexosaminidase enzymes. Low hexosaminidase A identifies Tay-Sachs disease and carriers.","abn":"Decreased hexosaminidase A: Tay–Sachs disease\nDecreased hexosaminidase A and B: Sandhoff disease","src":"m"},{"aka":"AIDS immunoassay, Acquired immunodeficiency serology, AIDS screen, Human immunodeficiency virus [HIV] antibody test, Western blot test, p24 direct antigen, HIV-RNA viral test","expl":"Screening and confirmatory tests for HIV infection, usually combined antibody/antigen tests followed by confirmation tests.","abn":"Increased levels: AIDS; HIV infection","src":"m"},{"aka":"Hcy","expl":"Measures homocysteine, an amino acid. High levels are linked to heart disease and clots and can reflect low B12 or folate.","abn":"Increased levels: Cardiovascular disease; Cerebrovascular disease; Peripheral vascular disease; Cystinuria; Vitamin B6 or B12 deficiency; Folate deficiency","src":"m"},{"aka":"hCG, Pregnancy tests, hCG beta subunit","expl":"Measures hCG, the pregnancy hormone. It confirms pregnancy and is also a tumour marker for some testicular and placental cancers.","abn":"Increased levels: Pregnancy; Ectopic pregnancy; Hydatidiform mole of the uterus; Choriocarcinoma of the uterus, testes, or ovaries; Tumor\nDecreased levels: Spontaneous abortion; Fetal death; Ectopic pregnancy","src":"m"},{"aka":"HPV test, HPV DNA testing, HPV Genotyping, HPV mRNA testing","expl":"Tests cervical cells for high-risk HPV types. These viruses cause most cervical cancers, so it is used in cervical screening.","abn":"HPV infection","src":"m"},{"aka":"","expl":"Looks for antibodies against the adrenal enzyme 21-hydroxylase. A positive result points to autoimmune Addison disease.","abn":"Increased levels: Autoimmune adrenal insufficiency; Autoimmune polyglandular syndrome","src":"m"},{"aka":"","expl":"Measures insulin in the blood. It is mainly used to investigate low blood sugar, such as an insulin-making tumour (insulinoma).","abn":"Increased levels: Insulinoma; Cushing syndrome; Acromegaly; Obesity; Fructose or galactose intolerance\nDecreased levels: Diabetes mellitus; Hypopituitarism","src":"m"},{"aka":"IGF-1, Somatomedin C, Insulin-like growth factor binding proteins [IGF BP]","expl":"Measures IGF-1, which reflects average growth hormone activity. It screens for acromegaly and growth hormone deficiency.","abn":"Increased levels: Acromegaly; Gigantism; Hyperpituitarism; Obesity; Pregnancy; Precocious puberty\nDecreased levels: GH deficiency/resistance; Laron dwarfism; Inactive GH; Resistance to somatomedins; Nutritional deficiency; Delayed puberty; Pituitary tumor; Hypopituitarism; Cirrhosis of the liver","src":"m"},{"aka":"IF ab","expl":"Looks for antibodies against intrinsic factor. A positive result confirms pernicious anaemia as the cause of B12 deficiency.","abn":"Increased levels: Pernicious anemia","src":"m"},{"aka":"Fe and TIBC, Transferrin saturation, Transferrin","expl":"Measures iron in the blood and the capacity of transferrin to carry it. It helps tell iron deficiency from other anaemias and detects iron overload.","abn":"Increased serum iron levels: Hemosiderosis; Hemochromatosis; Hemolytic anemia; Hepatitis; Hepatic necrosis; Lead toxicity; Iron poisoning; Massive blood transfusion\nDecreased serum iron levels: Insufficient dietary iron; Chronic blood loss; Inadequate absorption of iron; Pregnancy (late); Iron deficiency anemia; Neoplasia; Chronic gastrointestinal blood loss; Chronic hematuria; Chronic heavy physiologic or pathologic menstruation\nIncreased TIBC or transferrin levels: Oral contraceptives; Pregnancy (late); Polycythemia vera; Iron deficiency anemia\nDecreased TIBC or transferrin levels: Hypoproteinemia; Inflammatory diseases; Cirrhosis; Hemolytic anemia; Pernicious anemia; Sickle cell anemia\nIncreased TS or TIBC saturation: Hemochromatosis; Hemosiderosis; Acute iron overdose; Hemolytic anemia\nDecreased TS or TIBC saturation: Iron deficiency anemia; Chronic illnesses (e.g., malignancy)","src":"m"},{"aka":"Urinary stone analysis, Renal calculus analysis","expl":"A passed or removed kidney stone is analysed for its chemical type. Knowing the type helps prevent new stones.","abn":"Kidney stones","src":"m"},{"aka":"Lactate","expl":"Measures lactate in the blood. High levels show tissues are short of oxygen, as in shock or sepsis.","abn":"Increased levels: Sepsis; Shock; Tissue ischemia; Carbon monoxide poisoning; Severe liver disease; Genetic errors of metabolism; Diabetes mellitus (nonketotic); Strenuous exercise","src":"m"},{"aka":"LDH, Lactate dehydrogenase","expl":"Measures LDH, an enzyme found in most tissues. High levels show tissue damage, such as haemolysis, liver disease or some cancers.","abn":"Increased values: Myocardial infarction; Pulmonary disease (e.g., embolism, infarction, pneumonia); Hepatic disease (e.g., hepatitis, active cirrhosis, neoplasm); Red blood cell disease (e.g., hemolytic or megaloblastic anemia or red blood cell destruction from prosthetic heart valves); Skeletal muscle disease and injury (e.g., muscular trauma); Renal parenchymal disease (e.g., infarction, glomerulonephritis, acute tubular necrosis); Intestinal ischemia and infarction; Testicular tumors (seminoma or dysgerminomas); Lymphoma and other reticuloendothelial system tumors; Advanced solid tumor malignancies; Pancreatitis; Diffuse disease or injury (e.g., heatstroke)","src":"m"},{"aka":"Pancreatic lipase, Lipoprotein lipase","expl":"Measures lipase, a pancreatic enzyme. It is the main blood test for diagnosing acute pancreatitis.","abn":"Acute pancreatitis; Chronic relapsing pancreatitis; Pancreatic cancer; Pancreatic pseudocyst; Acute cholecystitis; Cholangitis; Extrahepatic duct obstruction; Renal failure; Bowel obstruction or infarction; Salivary gland inflammation or tumor; Peptic ulcer disease","src":"m"},{"aka":"High-density lipoproteins [HDLs, HDL-C], Low-density lipoproteins [LDLs, LDL-C], Very-low-density lipoproteins [VLDLs], Lipoprotein electrophoresis, Lipoprotein phenotyping, Lipid fractionation, Non-HDL cholesterol, Lipid profile","expl":"Measures the fats in blood (HDL, LDL, VLDL and triglycerides). It estimates the risk of heart disease and guides treatment.","abn":"Increased HDL levels: Familial HDL lipoproteinemia; Excessive exercise\nDecreased HDL levels: Metabolic syndrome; Familial low HDL; Hepatocellular disease (e.g., hepatitis or cirrhosis); Hypoproteinemia (e.g., nephrotic syndrome or malnutrition)\nIncreased LDL and VLDL levels: Familial LDL lipoproteinemia; Nephrotic syndrome; Glycogen storage diseases (e.g., von Gierke disease); Hypothyroidism; Alcohol consumption; Chronic liver disease (e.g., hepatitis or cirrhosis); Hepatoma; Gammopathies (e.g., multiple myeloma); Familial hypercholesterolemia type IIa; Cushing syndrome; Apoprotein CII deficiency\nDecreased LDL and VLDL levels: Familial hypolipoproteinemia; Hypoproteinemia (e.g., malabsorption, severe burns, or malnutrition); Hyperthyroidism","src":"m"},{"aka":"AKT1, ALK, BRAF, Epidermal growth factor [EGFR], HER2, KRAS, MEK1, MET, NRAS, PIK3CA, RET, and ROS1","expl":"Lung cancer tissue is tested for gene changes (e.g. EGFR, ALK). The results show which targeted drugs may work.","abn":"Known mutation of respective gene.","src":"m"},{"aka":"","expl":"Measures magnesium in the blood. Abnormal levels affect the heart, nerves and muscles.","abn":"Increased levels: Renal insufficiency; Uncontrolled diabetes; Addison disease; Hypothyroidism; Ingestion of magnesiumcontaining antacids or salts\nDecreased levels: Malnutrition; Malabsorption; Hypoparathyroidism; Alcoholism; Chronic renal disease; Diabetic acidosis","src":"m"},{"aka":"","expl":"Looks for antibodies to the measles virus. It shows immunity or a recent infection.","abn":"Active measles virus infection; Previous measles virus infection leading to immunity","src":"m"},{"aka":"lead, arsenic, mercury","expl":"Measures heavy metals such as lead, arsenic and mercury. It diagnoses metal poisoning.","abn":"Increased levels: Exposure to lead, other heavy metals, and trace elements","src":"m"},{"aka":"MA","expl":"Detects very small amounts of albumin in urine. It is an early sign of kidney damage, especially in diabetes and high blood pressure.","abn":"Increased levels: Diabetes mellitus; Hypertension; Cardiovascular disease; Nephropathy; Urinary bleeding; Hemoglobinuria; Myoglobinuria","src":"m"},{"aka":"","expl":"Measures myoglobin, a muscle protein. It rises early after heart or muscle damage.","abn":"Increased levels: Myocardial infarction; Skeletal muscle inflammation (myositis); Malignant hyperthermia; Muscular dystrophy; Skeletal muscle ischemia; Skeletal muscle trauma; Rhabdomyolysis\nDecreased levels: Polymyositis","src":"m"},{"aka":"Atrial natriuretic peptide [ANP], Brain natriuretic peptide [BNP], N-terminal fragment of pro–brain [B-type] natriuretic peptide [NT–pro-BNP], C-type natriuretic peptide [CNP], Ventricular natriuretic peptide, CHF peptides","expl":"Measures BNP or NT-proBNP, released when the heart is stretched. It helps diagnose and monitor heart failure.","abn":"Increased levels: Congestive heart failure; Myocardial infarction; Systemic hypertension; Cor pulmonale; Heart transplant rejection","src":"m"},{"aka":"NSE","expl":"Measures neuron-specific enolase. It is a tumour marker for small cell lung cancer and neuroblastoma.","abn":"Increased levels: Small cell lung cancer; Neuroblastoma; APUD tumors","src":"m"},{"aka":"Nicotine, Cotinine, 3-Hydroxy Cotinine, Nornicotine, Anabasine","expl":"Measures nicotine and its breakdown product cotinine. It shows whether someone smokes or is exposed to tobacco smoke.","abn":"Tobacco exposure","src":"m"},{"aka":"","expl":"Measures 5'-nucleotidase, a liver enzyme. It confirms that a high ALP comes from the liver rather than bone.","abn":"Increased levels: Bile duct obstruction; Cholestasis; Hepatitis; Cirrhosis; Hepatic necrosis, ischemia, tumor; Hepatotoxic drugs","src":"m"},{"aka":"Serum osmolality","expl":"Measures the concentration of particles in blood. It helps assess water and salt balance and detect poisoning.","abn":"Increased levels: Hypernatremia; Dehydration; Hyperglycemia; Mannitol therapy; Azotemia; Uremia; Ingestion of ethanol, methanol, or ethylene glycol; Hyperosmolar nonketotic hyperglycemia; Diabetes insipidus; Hypercalcemia; Renal tubular necrosis; Severe pyelonephritis; Ketosis; Shock\nDecreased levels: Hyponatremia; Overhydration; Syndrome of inappropriate antidiuretic hormone (SIADH) secretion; Paraneoplastic syndromes associated with lung carcinoma","src":"m"},{"aka":"PE, EL1, Elastase-1, Fecal Elastase","expl":"Measures elastase, a pancreatic enzyme, in stool. Low levels show the pancreas is not making enough digestive enzymes.","abn":"Decreased stool levels: Pancreatic insufficiency (e.g., chronic pancreatitis); Pancreatic resection; Cystic fibrosis; Diabetes mellitus; Cholelithiasis; Osteoporosis\nIncreased serum levels: Pancreatitis\nDecreased serum levels: Hypothyroidism","src":"m"},{"aka":"","expl":"Looks for antibodies to parvovirus B19 (fifth disease). It is important in pregnancy and in people with anaemia.","abn":"Increased levels: Erythema infectiosum (fifth disease); Joint arthralgia and arthritis; Hydrops fetalis; Fetal loss; Transient aplastic anemia; Chronic anemia in immunodeficient patients; Bone marrow failure","src":"m"},{"aka":"","expl":"Measures pepsinogen, made by the stomach lining. Low levels suggest atrophic gastritis and higher risk of stomach cancer.","abn":"Decreased values: Pernicious anemia; Gastric atrophy; Chronic gastritis; Peptic ulcer disease","src":"m"},{"aka":"PGF","expl":"Measures placental growth factor in pregnancy. Low levels help predict or diagnose pre-eclampsia.","abn":"Decreased blood levels: Hypertension; Preeclampsia","src":"m"},{"aka":"Fibrinolysin","expl":"Measures plasminogen, which breaks down clots. Low levels can increase clotting risk.","abn":"Increased levels: Pregnancy; Inflammatory conditions\nDecreased levels: Hyperfibrinolytic state (e.g., DIC, fibrinolysis); Primary liver disease; Syndrome associated with hypercoagulation; Rare congenital deficiencies; Malnutrition","src":"m"},{"aka":"PAI-1","expl":"Measures PAI-1, which slows clot breakdown. High levels raise the risk of clots and heart disease.","abn":"Increased levels: Acute coronary syndrome; Coronary artery disease; Restenosis after coronary angioplasty; Infection; Inflammation; Trauma; Diabetes mellitus; Insulin resistance syndrome; Pregnancy\nDecreased levels: Bleeding disorders","src":"m"},{"aka":"Antiplatelet antibody detection","expl":"Looks for antibodies against platelets. They cause low platelet counts, as in ITP or after transfusion.","abn":"Increased levels: Idiopathic thrombocytopenia purpura; Neonatal thrombocytopenia; Posttransfusion purpura; HIT; Drug-induced thrombocytopenia; Paroxysmal hemoglobinuria","src":"m"},{"aka":"Thrombocyte count","expl":"Counts the platelets in the blood. Low counts cause bleeding; high counts can cause clots.","abn":"Increased levels (thrombocytosis): Malignant disorder; Polycythemia vera; Postsplenectomy syndrome; Rheumatoid arthritis; Iron-deficiency anemia\nDecreased levels (thrombocytopenia): Hypersplenism; Hemorrhage; Immune thrombocytopenia; Leukemia and other myelofibrosis disorders; Thrombotic thrombocytopenia; Inherited thrombocytopenia disorders (e.g., Wiskott–Aldrich, Bernard–Soulier, or Zieve syndromes); DIC; Systemic lupus erythematosus; Pernicious anemia; Some hemolytic anemias; Cancer chemotherapy; Acute or chronic infection","src":"m"},{"aka":"Platelet closure time, PCT, Aspirin resistance tests, Bleeding time [BT], 11-Dehydro-thromboxane B2","expl":"Measures how well platelets work, usually on a PFA machine. It screens for bleeding disorders and the effect of aspirin.","abn":"Prolonged times or increased values: Intrinsic platelet defects; Some myelodysplastic syndromes; Some myeloid leukemias; Some myeloproliferative neoplasms; Bernard–Soulier syndrome; Glanzmann thromboasthenia; Hermansky–Pudlak syndrome; Hereditary telangiectasia; Platelet–blood vessel interaction defects; von Willebrand disease; Cushing syndrome; Henoch–Schönlein syndrome; Uremia; Elevated B2 (11-dTXB2) (on aspirin therapy); Increased risk of thromboembolic disease","src":"m"},{"aka":"K","expl":"Measures potassium in the blood. Both high and low levels can cause dangerous heart rhythm problems.","abn":"Increased levels (hyperkalemia): Excessive dietary intake; Excessive IV intake; Acute or chronic renal failure; Hypoaldosteronism; Aldosterone-inhibiting diuretics; Crush injury to tissues; Hemolysis; Transfusion of hemolyzed blood; Infection; Acidosis; Dehydration\nDecreased levels (hypokalemia): Deficient dietary intake; Deficient IV intake; Burns; GI disorders (e.g., diarrhea); Diuretics; Hyperaldosteronism; Cushing syndrome; Renal tubular acidosis; Licorice ingestion; Insulin administration; Glucose administration; Ascites; Renal artery stenosis; Cystic fibrosis; Trauma; Surgery","src":"m"},{"aka":"","expl":"Measures progesterone. It confirms ovulation and checks early pregnancy health.","abn":"Increased levels: Ovulation; Pregnancy; Luteal cysts of ovary; Hyperadrenocorticalism; Adrenocortical hyperplasia; Choriocarcinoma of ovary; Hydatidiform mole of the uterus\nDecreased levels: Preeclampsia; Toxemia of pregnancy; Threatened abortion; Placental failure; Fetal death; Ovarian neoplasm; Amenorrhea; Ovarian hypofunction","src":"m"},{"aka":"PRLs","expl":"Measures prolactin, the milk-making hormone from the pituitary. High levels cause infertility and milk discharge and may mean a pituitary tumour.","abn":"Increased levels: Galactorrhea; Amenorrhea; Prolactin-secreting pituitary tumor; Infiltrative diseases of the hypothalamus and pituitary stalk; Hypothyroidism; Renal failure; Anorexia nervosa; Perineoplastic ectopic production of prolactin; Metastatic cancer to the pituitary gland; Polycystic ovary syndrome; Stress; Empty sella syndrome\nDecreased levels: Pituitary apoplexy; Pituitary destruction from tumor (craniopharyngioma)","src":"m"},{"aka":"(PSA), prostate cancer gene 3 (PCA3), MI-prostate score (MiPS)","expl":"Measures PSA, a protein from the prostate. It is used for prostate cancer screening and to monitor treatment.","abn":"Increased levels: Prostate cancer; Benign prostatic hypertrophy; Prostatitis","src":"m"},{"aka":"Protein electrophoresis, Immunofixation electrophoresis [IFE], Serum protein electrophoresis [SPEP], Albumin, Globulin, Total protein","expl":"Measures total protein, albumin and globulin in blood or protein in urine. It reflects nutrition, liver and kidney function.","abn":"Increased blood monoclonal immunoglobulins: Multiple myeloma; Waldenström macroglobulinemia\nIncreased blood polyclonal immunoglobulins: Amyloidosis; Autoimmune diseases; Chronic infection or inflammation; Chronic liver disease\nIncreased urine monoclonal immunoglobulins: Multiple myeloma; Waldenström macroglobulinemia","src":"m"},{"aka":"","expl":"Measures protein C and protein S, natural anticoagulants. Low levels increase the risk of clots.","abn":"Decreased levels: Congenital deficiency of protein C or protein S; DIC; Hypercoagulable states; Pulmonary emboli; Arterial or venous thrombosis; Vitamin K deficiency because of drugs or malnutrition; Malignancy; Autoimmune diseases; Inflammation; Warfarin","src":"m"},{"aka":"PT, Protime, International normalized ratio [INR]","expl":"Measures how long plasma takes to clot through the extrinsic pathway (PT/INR). It monitors warfarin and checks liver function.","abn":"Increased levels: Cirrhosis; Hepatitis; Vitamin K deficiency; Salicylate intoxication; Bile duct obstruction; Coumarin ingestion; DIC; Massive blood transfusion; Hereditary factor deficiency","src":"m"},{"aka":"Plasma renin activity [PRA], Plasma renin concentration [PRC]","expl":"Measures renin activity in the plasma. With aldosterone it helps find the cause of high blood pressure.","abn":"Increased levels: Essential hypertension; Malignant hypertension; Renovascular hypertension; Chronic renal failure; Salt-losing gastrointestinal disease (e.g., diarrhea); Addison disease; Renin-producing renal tumor; Bartter syndrome; Cirrhosis; Hyperkalemia; Hemorrhage; Hypovolemia\nDecreased levels: Primary hyperaldosteronism; Steroid therapy; Congenital adrenal hyperplasia; Chronic renal impairment; Hypervolemia; Ectopic adrenocorticotrophic hormone syndrome","src":"m"},{"aka":"Retic count","expl":"Counts young red cells (reticulocytes). It shows whether the bone marrow is making enough red cells.","abn":"Increased levels: Hemolytic anemia; Sickle cell anemia; Hemorrhage (3-4 days later); Postsplenectomy; Hemolytic disease of the newborn; Pregnancy; Leukemias; Recovery from nutritional anemias\nDecreased levels: Pernicious anemia; Folic acid deficiency; Iron-deficiency anemia; Adrenocortical hypofunction; Aplastic anemia; Radiation therapy; Marrow failure; Anterior pituitary hypofunction; Chronic infection; Cirrhosis; Malignancy","src":"m"},{"aka":"RF","expl":"Looks for rheumatoid factor, an autoantibody. It helps diagnose rheumatoid arthritis and Sjögren syndrome.","abn":"Increased levels: RA; Other autoimmune diseases (e.g., systemic lupus erythematosus); Chronic viral infection; Subacute bacterial endocarditis; Tuberculosis; Chronic hepatitis; Dermatomyositis; Scleroderma; Infectious mononucleosis; Leukemia; Cirrhosis; Syphilis; Renal disease","src":"m"},{"aka":"German measles test","expl":"Looks for antibodies to rubella (German measles). It checks immunity, especially before or during pregnancy.","abn":"Active rubella infection; Previous rubella infection leading to immunity","src":"m"},{"aka":"Sperm count, Sperm examination","expl":"Examines semen for sperm count, movement and shape. It is the first test for male infertility and confirms vasectomy success.","abn":"Infertility; Vasectomy; Orchitis; Testicular atrophy; Testicular failure; Hyperpyrexia","src":"m"},{"aka":"(5-hydroxytryptamine, 5-HT) and chromogranin A","expl":"Measures serotonin in the blood. High levels suggest a carcinoid tumour.","abn":"Increased levels: Carcinoid tumors; Neuroendocrine tumors; Pheochromocytoma; Small cell lung cancer","src":"m"},{"aka":"Sickledex, Hemoglobin [Hgb] S test","expl":"A screening test for haemoglobin S. A positive result means sickle cell disease or trait.","abn":"Sickle cell trait; Sickle cell anemia","src":"m"},{"aka":"(Na), blood","expl":"Measures sodium in the blood. It reflects water balance; abnormal levels can cause confusion and seizures.","abn":"Increased levels (hypernatremia): Increased sodium intake; Excessive dietary intake; Excessive sodium in IV fluids; Decreased sodium loss; Cushing syndrome; Hyperaldosteronism; Excessive free body water loss; Excessive sweating; Extensive thermal burns; Diabetes insipidus; Osmotic diuresis; GI loss\nDecreased levels (hyponatremia): Decreased sodium intake; Deficient dietary intake; Deficient sodium in IV fluids; Increased sodium loss; Addison disease; Diarrhea; Vomiting or nasogastric aspiration; Diuretic administration; Chronic renal insufficiency; Increased free body water; Excessive oral water intake; Excessive IV water intake; Congestive heart failure; Syndrome of inappropriate ADH (SIADH) secretion; Osmotic dilution; Third-space losses of sodium; Ascites; Peripheral edema; Pleural effusion; Intraluminal bowel loss (ileus or mechanical obstruction)","src":"m"},{"aka":"stool for occult blood, Stool for OB, Fecal occult blood test [FOBT], Fecal immunotest [FIT], DNA stool sample","expl":"Stool tests for hidden blood (FOBT/FIT) or cancer DNA. They screen for colorectal cancer.","abn":"GI tumor Ischemic bowel disease; Polyps GI trauma; Ulcer Recent GI surgery; Varices Hemorrhoids; Inflammatory bowel disease Esophagitis; Diverticulosis Gastritis","src":"m"},{"aka":"Stool for culture and sensitivity [C&S], Stool for ova and parasites [O&P]","expl":"Stool is cultured for bacteria and examined for parasites. It finds the cause of infectious diarrhoea.","abn":"Bacterial enterocolitis; Protozoan enterocolitis; Parasitic enterocolitis","src":"m"},{"aka":"Antistreptolysin O titer [ASO], Antideoxyribonuclease-B titer, [Anti-DNase-B, ADNase-B, ADB], Streptococcus group B antigen detection, Streptozyme","expl":"Looks for antibodies to Streptococcus (ASO, anti-DNase B). They show recent strep infection, linked to rheumatic fever and glomerulonephritis.","abn":"Increased levels: Streptococcal infection; Acute rheumatic fever; Acute glomerulonephritis; Bacterial endocarditis; Scarlet fever; Streptococcal pyoderma","src":"m"},{"aka":"Sweat electrolyte test, Sweat chloride test, Sweat conductivity test, Iontophoretic sweat test","expl":"Measures salt (chloride) in sweat. High levels diagnose cystic fibrosis.","abn":"CF","src":"m"},{"aka":"Serologic test for syphilis [STS], Venereal Disease Research Laboratory [VDRL], Rapid plasma reagin [RPR], Fluorescent treponemal antibody test [FTA]","expl":"Blood tests (e.g. RPR, VDRL, treponemal antibodies) that diagnose syphilis and monitor treatment.","abn":"Syphilis","src":"m"},{"aka":"Dihydrotestosterone [DHT]","expl":"Measures testosterone. It assesses male hormone deficiency and excess male hormones in women.","abn":"Increased levels (male): Idiopathic sexual precocity; Pinealoma; Encephalitis; Congenital adrenal hyperplasia; Adrenocortical tumor; Testicular or extragonadal tumor; Hyperthyroidism; Testosterone resistance syndromes\nDecreased levels (male): Klinefelter syndrome; Cryptorchidism; Primary and secondary hypogonadism; Trisomy 21 (Down syndrome); Orchidectomy; Hepatic cirrhosis\nIncreased levels (female): Ovarian tumor; Adrenal tumor; Congenital adrenocortical hyperplasia; Trophoblastic tumor; Polycystic ovaries; Idiopathic hirsutism","src":"m"},{"aka":"Tg, Thyrogen-stimulated thyroglobulin","expl":"Measures thyroglobulin, made only by thyroid tissue. It is used after thyroid cancer treatment to detect recurrence.","abn":"Increased levels: Residual thyroid tissue in the neck; Metastatic thyroid cancer","src":"m"},{"aka":"TSH, Thyrotropin, TRH stimulation test","expl":"Measures TSH, the pituitary hormone controlling the thyroid. It is the best single screening test for an underactive or overactive thyroid.","abn":"Increased levels: Primary hypothyroidism (thyroid dysfunction); Thyroiditis; Thyroid agenesis; Congenital hypothyroidism; Large doses of iodine; Severe and chronic illnesses; Pituitary TSH-secreting tumor\nDecreased levels: Secondary hypothyroidism (pituitary dysfunction); Hyperthyroidism; Pituitary hypofunction","src":"m"},{"aka":"TSIs, Long-acting thyroid stimulator [LATS], Thyroid-binding inhibitory immunoglobulin [TBII], Thyrotropin receptor antibody, Thyroid-stimulating hormone receptor [TSHR] antibodies","expl":"Looks for antibodies that stimulate the TSH receptor. They confirm Graves disease.","abn":"Increased levels: Hyperthyroidism Hashimoto thyroiditis; Malignant exophthalmos Neonatal thyrotoxicosis; Graves disease","src":"m"},{"aka":"T4, Thyroxine screen, FT4","expl":"Measures thyroxine (T4), the main thyroid hormone. Free T4 shows the active hormone and helps diagnose thyroid disease.","abn":"Increased levels: Graves disease; Toxic thyroid adenoma; Acute thyroiditis; Familial dysalbuminemic hyperthyroxinemia; Factitious hyperthyroidism; Struma ovarii; Pregnancy; Hepatitis; Congenital hyperproteinemia; Thyroid cancer; Toxic multinodular goiter\nDecreased levels: Congenital hypothyroidism; Surgical ablation of the thyroid; Myxedema; Pituitary insufficiency; Hypothalamic failure; Iodine insufficiency; Renal failure; Cushing syndrome; Cirrhosis; Hashimoto thyroiditis; Thyroid agenesis; TSH receptor defects","src":"m"},{"aka":"TBG, Thyroid-binding globulin","expl":"Measures the protein that carries thyroid hormone. It explains abnormal total T4 levels when thyroid function is normal.","abn":"Increased levels: Pregnancy; Estrogen replacement therapy; Estrogen-producing tumors; Infectious hepatitis; Genetic increased TBG; Acute intermittent porphyria\nDecreased levels: Protein-losing enteropathy; Protein-losing nephropathy; Malnutrition; Testosterone-producing tumors; Ovarian failure; Major stress","src":"m"},{"aka":"(TfR) assay","expl":"Measures soluble transferrin receptor. It rises in iron deficiency but not in anaemia of chronic disease, helping to tell them apart.","abn":"Increased plasma TfR levels: Iron-deficiency anemia; Reticulocytosis; Erythropoietin therapy\nDecreased plasma TfR levels: Hemochromatosis","src":"m"},{"aka":"TGs","expl":"Measures triglycerides, a type of fat in the blood. High levels add to heart disease risk and can cause pancreatitis.","abn":"Increased levels: Glycogen storage disease; Hyperlipidemias; Hypothyroidism; High-carbohydrate diet; Poorly controlled diabetes; Risk of arteriosclerotic occlusive coronary disease and peripheral vascular disease; Nephrotic syndrome; Hypertension; Alcoholic cirrhosis; Pregnancy; Myocardial infarction\nDecreased levels: Malabsorption syndrome; Malnutrition; Hyperthyroidism","src":"m"},{"aka":"","expl":"Measures uric acid in blood or urine. High levels are linked to gout and kidney stones.","abn":"Increased blood levels (hyperuricemia): Gout; Increased ingestion of purines; Genetic inborn error in purine metabolism; Metastatic cancer; Multiple myeloma; Leukemia; Cancer chemotherapy; Hemolysis; Rhabdomyolysis (e.g., heavy exercise, burns, crush injury, epileptic seizure, or myocardial infarction); Chronic renal disease; Acidosis (ketotic or lactic); Hypothyroidism; Toxemia of pregnancy; Hyperlipoproteinemia; Alcoholism; Shock or chronic blood volume depletion states; Idiopathic\nDecreased blood levels: Wilson disease; Fanconi syndrome; Lead poisoning; Yellow atrophy of the liver\nIncreased urine levels: Gout; Metastatic cancer; Multiple myeloma; Leukemia; Cancer chemotherapy; High purine diet; Lead toxicity\nDecreased urine levels: Kidney disease; Eclampsia; Chronic alcohol ingestion; Acidosis (ketotic or lactic)","src":"m"},{"aka":"UA","expl":"A physical, chemical and microscopic exam of urine. It screens for kidney disease, urinary infection and diabetes.","abn":"Appearance and color; Bacteria Dehydration; Pus Overhydration; Red blood cells Diabetes insipidus; Certain foods (e.g., beets, carrots) Fever; Drug therapy Excessive
