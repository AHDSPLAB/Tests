gra.","abn":"","src":"g"},{"aka":"","expl":"Measures pantothenic acid (B5), needed for energy metabolism.","abn":"","src":"g"},{"aka":"","expl":"Measures vitamin B6. Deficiency causes neuropathy and anaemia; excess also causes neuropathy.","abn":"","src":"g"},{"aka":"","expl":"Measures biotin (B7). High intake can interfere with many lab tests.","abn":"","src":"g"},{"aka":"","expl":"Measures vitamin C. Deficiency causes scurvy.","abn":"","src":"g"},{"aka":"","expl":"Measures 1,25-dihydroxyvitamin D, the active hormone form. Used in kidney disease, sarcoidosis and unusual calcium disorders.","abn":"","src":"g"},{"aka":"","expl":"Measures vitamin E, an antioxidant. Low in fat malabsorption.","abn":"","src":"g"},{"aka":"","expl":"Measures vitamin K1, needed to make clotting factors.","abn":"","src":"g"},{"aka":"","expl":"Detects antibodies against nerve-muscle proteins. Used to diagnose myasthenia gravis, Lambert-Eaton syndrome and related disorders.","abn":"","src":"g"},{"aka":"","expl":"Tests von Willebrand factor level, function or structure. Used to diagnose von Willebrand disease, the most common inherited bleeding disorder.","abn":"","src":"g"},{"aka":"","expl":"Tests von Willebrand factor level, function or structure. Used to diagnose von Willebrand disease, the most common inherited bleeding disorder.","abn":"","src":"g"},{"aka":"","expl":"Tests von Willebrand factor level, function or structure. Used to diagnose von Willebrand disease, the most common inherited bleeding disorder.","abn":"","src":"g"},{"aka":"","expl":"Measures a single clotting factor. Used to diagnose haemophilia and other factor deficiencies.","abn":"","src":"g"},{"aka":"","expl":"Measures voriconazole, an antifungal, to ensure effective and safe levels.","abn":"","src":"g"},{"aka":"","expl":"Screening swab for antibiotic-resistant organisms, used for infection control.","abn":"","src":"g"},{"aka":"","expl":"Counts the types of white blood cells, to help identify infection, allergy or blood cancer.","abn":"","src":"g"},{"aka":"","expl":"Genetic test that classifies a weak RhD result, deciding whether a person should be treated as RhD positive or negative for transfusion and anti-D prophylaxis.","abn":"","src":"g"},{"aka":"","expl":"Detects antibodies against the named organism. IgM usually suggests recent infection; IgG shows past infection or immunity.","abn":"","src":"g"},{"aka":"","expl":"Broad genetic sequencing of many genes at once, used when a genetic cause is suspected but not identified by targeted tests.","abn":"","src":"g"},{"aka":"","expl":"Sequences the ATP7B gene for Wilson disease, an inherited copper overload condition.","abn":"","src":"g"},{"aka":"","expl":"Genetic test of the gene(s) linked to the named condition. Used to confirm a suspected inherited disorder, guide care and test family members.","abn":"","src":"g"},{"aka":"","expl":"Grows bacteria or fungi from the sample to identify the cause of infection, with antibiotic sensitivity testing.","abn":"","src":"g"},{"aka":"","expl":"Tests the Y chromosome for small deletions that cause low or absent sperm production.","abn":"","src":"g"},{"aka":"","expl":"Detects antibodies against the named organism. IgM usually suggests recent infection; IgG shows past infection or immunity.","abn":"","src":"g"},{"aka":"","expl":"Detects antibodies against the named organism. IgM usually suggests recent infection; IgG shows past infection or immunity.","abn":"","src":"g"},{"aka":"","expl":"Measures ZAP-70 on CLL cells, a marker that predicts how aggressive the disease is.","abn":"","src":"g"},{"aka":"","expl":"Measures zinc, an essential trace element. Low in malnutrition and malabsorption.","abn":"","src":"g"},{"aka":"","expl":"Measures zinc, an essential trace element. Low in malnutrition and malabsorption.","abn":"","src":"g"},{"aka":"","expl":"Detects autoantibodies against insulin-producing cells. Helps distinguish type 1 (autoimmune) diabetes from other types.","abn":"","src":"g"},{"aka":"Sterile fluid culture","expl":"Grows bacteria from a normally sterile body fluid such as peritoneal, pleural or joint fluid to find the cause of an infection. If an organism grows, sensitivity testing shows which antibiotics will work.","abn":"Positive culture: Spontaneous bacterial peritonitis; Secondary peritonitis (e.g., bowel perforation); Empyema; Septic arthritis","src":"g"},{"aka":"","expl":"Grows organisms from a bone marrow sample. It is used for fever of unknown origin and suspected disseminated infection such as tuberculosis, brucellosis, typhoid or fungal infection, especially when blood cultures are negative.","abn":"Positive culture: Disseminated tuberculosis or atypical mycobacteria; Brucellosis; Typhoid fever; Histoplasmosis","src":"g"},{"aka":"","expl":"A rapid microscope stain that shows whether bacteria are present, whether they are Gram-positive or Gram-negative, and how many white cells are present. It guides early antibiotic choice while the culture result is awaited.","abn":"","src":"g"},{"aka":"Alpha-MSH","expl":"Measures melanocyte-stimulating hormone, a peptide made from the same precursor as ACTH that stimulates skin pigmentation and helps regulate appetite. It is a specialised test, used mainly in the investigation of pituitary and adrenal disorders and rare genetic causes of obesity.","abn":"","src":"g"},{"aka":"PCT","expl":"Measures procalcitonin, a protein that rises quickly in bacterial infection and sepsis but much less in viral infection. It helps decide whether antibiotics are needed and when they can safely be stopped.","abn":"Increased levels: Bacterial sepsis; Severe bacterial infection (e.g., pneumonia); Major trauma, surgery or burns; Medullary thyroid carcinoma","src":"g"},{"aka":"RBP, RBP4","expl":"Measures retinol-binding protein, which carries vitamin A in the blood. Low levels point to poor nutrition or vitamin A deficiency, and high levels are seen in kidney disease.","abn":"Increased levels: Chronic kidney disease\nDecreased levels: Malnutrition; Vitamin A deficiency; Liver disease; Zinc deficiency","src":"g"},{"aka":"","expl":"A genetic panel that looks for changes in the genes that control how thyroid hormone is made, transported and used by the body. It is used for congenital hypothyroidism, thyroid hormone resistance and unexplained inherited thyroid test patterns.","abn":"","src":"g"},{"aka":"Red cell antibody titre","expl":"Measures how strong a red cell antibody is by testing serial dilutions of the patient's plasma. In pregnancy it is used to monitor antibodies such as anti-D that can cause haemolytic disease of the fetus and newborn.","abn":"Rising titre: Increasing risk of haemolytic disease of the fetus and newborn","src":"g"},{"aka":"Follicle-stimulating hormone, Follitropin","expl":"Measures follicle-stimulating hormone, a pituitary hormone that drives egg development in women and sperm production in men. It helps investigate infertility, menstrual problems, menopause and disorders of puberty.","abn":"Increased levels: Menopause and primary ovarian insufficiency; Primary testicular failure; Turner syndrome; Klinefelter syndrome\nDecreased levels: Hypothalamic or pituitary disorders; Hyperprolactinaemia; Anorexia nervosa; Pregnancy","src":"g"},{"aka":"CSF glucose","expl":"Measures glucose in cerebrospinal fluid, interpreted against a blood glucose taken at the same time. A low CSF glucose suggests bacterial, tuberculous or fungal meningitis.","abn":"Decreased levels: Bacterial meningitis; Tuberculous meningitis; Fungal meningitis; Meningeal spread of cancer; Subarachnoid haemorrhage","src":"g"},{"aka":"CSF chloride","expl":"Measures chloride in cerebrospinal fluid. It is a minor CSF test that largely follows the blood chloride level and is now rarely used on its own.","abn":"","src":"g"},{"aka":"Urine chloride","expl":"Measures chloride passed in the urine. It helps find the cause of metabolic alkalosis and assess fluid status and salt intake.","abn":"Increased levels: Diuretic use; Bartter and Gitelman syndromes; High salt intake\nDecreased levels: Vomiting or nasogastric suction; Dehydration; Low salt intake","src":"g"},{"aka":"Urine glucose, Glycosuria","expl":"Measures glucose spilling into the urine. Glucose appears when blood glucose rises above the kidney threshold, as in uncontrolled diabetes, or when the kidney tubules leak glucose.","abn":"Increased levels: Uncontrolled diabetes mellitus; Renal glycosuria; Pregnancy; SGLT2 inhibitor treatment; Fanconi syndrome","src":"g"},{"aka":"Urine potassium","expl":"Measures potassium in the urine. It helps show whether a low or high blood potassium is caused by the kidneys or by losses elsewhere, such as the gut.","abn":"Increased levels: Diuretic use; Hyperaldosteronism; Cushing syndrome; Renal tubular acidosis\nDecreased levels: Gastrointestinal potassium loss (e.g., diarrhoea); Adrenal insufficiency; Low potassium intake","src":"g"},{"aka":"Urine creatinine","expl":"Measures creatinine in the urine. A 24-hour value checks that the collection is complete and is used to calculate creatinine clearance; a random value corrects other urine results, such as albumin or protein, for urine concentration.","abn":"","src":"g"},{"aka":"Urine osmolality","expl":"Measures how concentrated the urine is. Compared with blood osmolality, it helps investigate low sodium, passing large volumes of urine and the kidney's ability to concentrate urine.","abn":"Increased levels: Dehydration; SIADH; Adrenal insufficiency; Heart failure\nDecreased levels: Diabetes insipidus; Excess water intake; Chronic kidney disease","src":"g"},{"aka":"CSF protein","expl":"Measures total protein in cerebrospinal fluid. A raised level points to inflammation, infection, bleeding or a blockage affecting the brain or spinal cord.","abn":"Increased levels: Bacterial or tuberculous meningitis; Guillain-Barré syndrome; Subarachnoid haemorrhage; Spinal cord compression; Multiple sclerosis","src":"g"},{"aka":"CSF albumin, CSF/serum albumin ratio","expl":"Measures albumin in cerebrospinal fluid. Compared with blood albumin, it shows whether the blood–brain barrier is leaking, and it is used to interpret CSF antibody (IgG) results.","abn":"Increased levels: Meningitis; Guillain-Barré syndrome; Spinal canal blockage; Blood–brain barrier damage","src":"g"},{"aka":"CSF cell count","expl":"Counts and classifies the cells in cerebrospinal fluid. Raised white cells suggest meningitis or inflammation, and red cells suggest bleeding or a traumatic tap.","abn":"Raised neutrophils: Bacterial meningitis\nRaised lymphocytes: Viral, tuberculous or fungal meningitis; Multiple sclerosis\nRed cells present: Subarachnoid haemorrhage; Traumatic lumbar puncture","src":"g"},{"aka":"Urine sodium","expl":"Measures sodium passed in the urine. It helps work out the cause of a low or high blood sodium, assess fluid status and check salt intake.","abn":"Increased levels: Diuretic use; SIADH; Adrenal insufficiency; High salt intake\nDecreased levels: Dehydration; Heart failure; Liver cirrhosis; Low salt intake","src":"g"},{"aka":"Urine magnesium","expl":"Measures magnesium passed in the urine. It shows whether a low blood magnesium is caused by the kidneys losing magnesium or by poor intake or gut losses.","abn":"Increased levels: Diuretic use; Alcohol excess; Gitelman syndrome; Some drugs (e.g., cisplatin)\nDecreased levels: Poor dietary intake; Malabsorption; Chronic diarrhoea","src":"g"},{"aka":"UPEP, Urine immunofixation, Bence Jones protein","expl":"Separates the proteins in urine and identifies them. It detects free light chains (Bence Jones protein) and shows the pattern of kidney protein loss.","abn":"Abnormal findings: Multiple myeloma; AL amyloidosis; Waldenström macroglobulinaemia; Glomerular or tubular kidney disease","src":"g"},{"aka":"","expl":"Measures acetone, a ketone, in urine. Ketones appear when the body burns fat for energy, as in uncontrolled diabetes, starvation or prolonged vomiting.","abn":"Increased levels: Diabetic ketoacidosis; Starvation or fasting; Prolonged vomiting; Alcoholic ketoacidosis; Isopropyl alcohol poisoning","src":"g"},{"aka":"","expl":"Detects Histoplasma antigen in urine. It is a sensitive test for disseminated histoplasmosis, especially in people with weak immune systems, and is used to follow treatment.","abn":"Positive result: Disseminated histoplasmosis; Acute pulmonary histoplasmosis; Cross-reaction with blastomycosis","src":"g"},{"aka":"","expl":"Measures fructose in urine. It is used to investigate inherited problems with fructose handling, such as hereditary fructose intolerance and essential fructosuria.","abn":"Increased levels: Essential fructosuria; Hereditary fructose intolerance; High fructose intake","src":"g"},{"aka":"","expl":"Measures how acidic or alkaline the urine is. It helps assess acid–base balance, kidney stone risk and renal tubular acidosis.","abn":"Acid urine (low pH): Metabolic acidosis; Diabetic ketoacidosis; High-protein diet; Uric acid stones\nAlkaline urine (high pH): Urinary infection with urea-splitting bacteria; Renal tubular acidosis; Vomiting; Vegetarian diet","src":"g"},{"aka":"","expl":"Measures adenosine deaminase activity in blood. Low activity is used to diagnose ADA-deficiency severe combined immunodeficiency, and levels can rise in some infections and blood disorders.","abn":"Decreased levels: ADA-deficiency severe combined immunodeficiency (SCID)\nIncreased levels: Tuberculosis; Some leukaemias and lymphomas; Infectious mononucleosis","src":"g"},{"aka":"","expl":"Screens blood for mucopolysaccharidoses, inherited storage disorders where complex sugars build up in the body. Abnormal results are followed by specific enzyme or gene testing.","abn":"Abnormal findings: Mucopolysaccharidoses (e.g., Hurler, Hunter, Sanfilippo syndromes)","src":"g"},{"aka":"","expl":"Measures mycotoxins, the toxins produced by moulds, to assess exposure to mould, for example in water-damaged buildings. It is a specialty functional-medicine test.","abn":"","src":"g"},{"aka":"","expl":"Blood antibody test (Cyrex Array 22) for antibodies linked to irritable bowel syndrome and small intestinal bacterial overgrowth after gut infection, such as anti-CdtB and anti-vinculin.","abn":"","src":"g"},{"aka":"","expl":"Hormone profile from a specialty lab, measured in blood. It covers sex hormones and cortisol, and the larger profiles add thyroid hormones and antibodies.","abn":"","src":"g"},{"aka":"","expl":"Thyroid and adrenal profile from a specialty lab, measured in blood. It covers thyroid hormones, thyroid antibodies and cortisol.","abn":"","src":"g"},{"aka":"","expl":"Liquid biopsy: tests tumour DNA circulating in the blood for gene changes in advanced solid cancers. The results help choose targeted treatment when tissue is not available.","abn":"","src":"g"},{"aka":"","expl":"Liquid biopsy: tests tumour DNA circulating in the blood for gene changes in advanced solid cancers. The results help choose targeted treatment when tissue is not available.","abn":"","src":"g"},{"aka":"","expl":"Blood-based cancer profiling: analyses tumour DNA and RNA circulating in the blood to look for gene changes that guide cancer treatment.","abn":"","src":"g"},{"aka":"","expl":"Blood test that looks for tiny amounts of tumour DNA after cancer treatment (minimal residual disease). A positive result suggests a higher risk of recurrence.","abn":"","src":"g"},{"aka":"","expl":"Personalised blood test that tracks tumour DNA after cancer treatment, using the patient's own tumour profile. A positive result signals residual or returning disease.","abn":"","src":"g"},{"aka":"","expl":"Blood-based colorectal cancer screening test that looks for DNA signals from colorectal cancer. A positive result should be followed by colonoscopy.","abn":"","src":"g"},{"aka":"","expl":"Tests blood for inherited gene changes (for example BRCA1 and BRCA2) that raise the risk of cancer. Results guide screening, preventive options and testing of relatives.","abn":"","src":"g"},{"aka":"","expl":"Fast-turnaround blood test for inherited gene changes (such as BRCA1 and BRCA2) in a person newly diagnosed with breast cancer. Results guide surgery and drug choices.","abn":"","src":"g"},{"aka":"","expl":"Measures phosphorylated tau 217 (and, in the ratio test, amyloid beta 42) in blood. These are markers of Alzheimer disease pathology and help decide on further assessment.","abn":"","src":"g"},{"aka":"","expl":"Consumer DNA test from a cheek (buccal) swab. It reports genetic traits, ancestry and inherited health risk markers; findings with medical implications should be confirmed by a clinical genetic test.","abn":"","src":"g"},{"aka":"","expl":"Looks for fungal elements (yeasts and hyphae) under the microscope after treating the specimen with potassium hydroxide. It gives a quick indication of fungal infection while culture is awaited.","abn":"Positive result: Dermatophyte infection; Candida infection; Other fungal infection","src":"g"},{"aka":"","expl":"Combined specialty-lab kit: a comprehensive stool analysis with parasitology, a dried urine hormone profile (DUTCH Plus, which adds saliva cortisol on waking) and a urine organic acids test.","abn":"","src":"g"},{"aka":"","expl":"Combined specialty-lab kit: a dried urine hormone profile (DUTCH Complete) and a stool DNA test of gut microbes and pathogens (GI-MAP).","abn":"","src":"g"},{"aka":"","expl":"Combined specialty-lab kit: a dried urine hormone profile with saliva cortisol on waking (DUTCH Plus) and a stool DNA test of gut microbes and pathogens (GI-MAP).","abn":"","src":"g"},{"aka":"","expl":"Specialty-lab hormone profile (DUTCH Plus): dried urine samples measure sex hormones, cortisol and their breakdown products, and saliva samples taken after waking measure the cortisol awakening response.","abn":"","src":"g"}];

const TUBE = [
  ['royal blue', '#1f3a93'], ['light green', '#8fd18a'], ['lav', '#c9b3e0'], ['lavender', '#c9b3e0'],
  ['light yellow', '#f2e39a'], ['red', '#c0392b'], ['yellow', '#e0b83a'], ['gold', '#c9a227'],
  ['green', '#4f9e5e'], ['blue', '#3a6fb0'], ['grey', '#9a9891'], ['gray', '#9a9891'],
  ['pink', '#e0a0b4'], ['orange', '#d98033'], ['swab', '#b8b4a8'], ['cup', '#b8b4a8'],
  ['cont', '#b8b4a8'], ['jug', '#b8b4a8'], ['bottle', '#8a8880'], ['btl', '#8a8880'], ['kit', '#8a8880'],
  ['card', '#b8b4a8'], ['plate', '#b8b4a8'], ['slide', '#b8b4a8'], ['tube', '#b8b4a8']
];
function tubeColor(ct) {
  const s = (ct || '').toLowerCase();
  for (const [k, c] of TUBE) if (s.includes(k)) return c;
  return '#d6d3cb';
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

const state = { q: '', dept: 'All', letter: 'All', open: null, limit: 60 };
const $ = id => document.getElementById(id);
function set(patch) { Object.assign(state, { open: null, limit: 60 }, patch); render(); }

const alphabet = ['All'].concat('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''));
const deptNames = ['All'].concat([...new Set(TESTS.map(t => t.d).filter(Boolean))].sort());

function filtered() {
  const term = state.q.trim().toLowerCase();
  const words = term.split(/\s+/).filter(Boolean);
  const browsing = words.length > 0 || state.dept !== 'All' || state.letter !== 'All';
  if (!browsing) return { list: [], browsing };
  let list = TESTS;
  if (state.dept !== 'All') list = list.filter(t => t.d === state.dept);
  if (state.letter !== 'All') list = list.filter(t => (t.n.replace(/^[^A-Za-z0-9]+/, '')[0] || '').toUpperCase() === state.letter);
  if (words.length) {
    list = list.filter(t => {
      const hay = (t.n + ' ' + t.d + ' ' + t.s + ' ' + t.ct + ' ' + t.m + ' ' + (t.k || '')).toLowerCase();
      return words.every(w => hay.includes(w));
    });
    const rank = t => {
      const n = t.n.toLowerCase();
      if (n === term || (t.k || '').includes('|' + term + '|')) return 0;
      return n.startsWith(term) ? 1 : n.includes(term) ? 2 : 3;
    };
    list = list.slice().sort((a, b) => rank(a) - rank(b) || a.n.toLowerCase().localeCompare(b.n.toLowerCase()));
  }
  return { list, browsing };
}

function detail(t) {
  const d = el('div', 'detail');
  const about = el('div', 'about');
  about.appendChild(el('div', 'lbl mono', 'About this test'));
  const g = t.g !== undefined ? GUIDE[t.g] : null;
  if (g) {
    if (g.aka) {
      const a = el('div', 'aka');
      a.appendChild(el('span', 'mono', 'ALSO KNOWN AS  '));
      a.appendChild(document.createTextNode(g.aka));
      about.appendChild(a);
    }
    about.appendChild(el('div', 'expl', g.expl));
    const abn = (g.abn || '').split('\n').map(s => s.trim()).filter(Boolean).map(line => {
      const ix = line.indexOf(':');
      return { label: ix > -1 ? line.slice(0, ix).trim() : 'Findings',
               items: (ix > -1 ? line.slice(ix + 1) : line).split(';').map(s => s.trim()).filter(Boolean) };
    });
    if (abn.length) {
      const box = el('div', 'abn');
      box.appendChild(el('div', 'lbl mono', 'Abnormal findings — main causes'));
      abn.forEach(a => {
        const grp = el('div', 'grp');
        grp.appendChild(el('div', 'gl', a.label));
        const chips = el('div', 'chips');
        a.items.forEach(c => chips.appendChild(el('span', null, c)));
        grp.appendChild(chips);
        box.appendChild(grp);
      });
      about.appendChild(box);
    }
    about.appendChild(el('div', 'src mono', g.src === 'm' ? "Source: Mosby's Diagnostic and Laboratory Test Reference" : "General summary — confirm against the lab's reference before clinical use"));
  }
  d.appendChild(about);
  const fields = el('div', 'fields');
  [['Sample type', t.s], ['Container', t.ct], ['Collection method', t.m], ['Department', t.d]]
    .filter(f => f[1]).forEach(([k, v]) => {
      const f = el('div');
      f.appendChild(el('div', 'lbl mono', k));
      f.appendChild(el('div', 'v', v));
      fields.appendChild(f);
    });
  d.appendChild(fields);
  if (t.h) {
    const h = el('div', 'handling');
    h.appendChild(el('span', 'hd'));
    const s = el('span');
    s.appendChild(el('div', 'hl mono', 'Special handling'));
    s.appendChild(el('div', 'hv', t.h));
    h.appendChild(s);
    d.appendChild(h);
  }
  return d;
}

function render() {
  $('clear').hidden = state.q.length === 0;

  const L = $('letters'); L.textContent = '';
  alphabet.forEach(ch => {
    const b = el('button', state.letter === ch ? 'on' : '', ch === 'All' ? '·' : ch);
    b.onclick = () => set({ letter: ch });
    L.appendChild(b);
  });
  const D = $('depts'); D.textContent = '';
  deptNames.forEach(dn => {
    const b = el('button', state.dept === dn ? 'on' : '', dn === 'All' ? 'All departments' : dn);
    b.onclick = () => set({ dept: dn });
    D.appendChild(b);
  });

  const { list, browsing } = filtered();
  const shown = list.slice(0, state.limit);
  $('count').textContent = browsing ? list.length + (list.length === 1 ? ' test' : ' tests') : TESTS.length + ' tests indexed';
  $('scope').textContent = browsing
    ? ([state.dept !== 'All' ? state.dept : null, state.letter !== 'All' ? state.letter : null].filter(Boolean).join(' · ') || 'Showing ' + shown.length)
    : 'Search or pick a letter to begin';

  const box = $('list'); box.textContent = '';
  shown.forEach((t, i) => {
    const key = t.n + '|' + i;
    const isOpen = state.open === key;
    const card = el('div', 'card' + (isOpen ? ' open' : ''));
    const row = el('button', 'row');
    const dot = el('span', 'dot'); dot.style.background = tubeColor(t.ct);
    const names = el('span', 'names');
    names.appendChild(el('span', 'n', t.n));
    names.appendChild(el('span', 's mono', [t.s, t.ct].filter(Boolean).join('  ·  ') || 'Details inside'));
    row.append(dot, names, el('span', 'pill mono', t.d || '—'), el('span', 'chev'));
    row.onclick = () => { state.open = isOpen ? null : key; render(); };
    card.appendChild(row);
    if (isOpen) card.appendChild(detail(t));
    box.appendChild(card);
  });

  $('empty').hidden = !(browsing && list.length === 0);
  $('more').hidden = !(list.length > shown.length);
}

$('q').addEventListener('input', e => set({ q: e.target.value, letter: 'All' }));
$('clear').onclick = () => { $('q').value = ''; set({ q: '' }); };
$('more').querySelector('button').onclick = () => { state.limit += 60; render(); };
render();
</script>
</body>
</html>
