ne(s) linked to the named condition. Used to confirm a suspected inherited disorder, guide care and test family members.","abn":"","src":"g"},{"aka":"","expl":"Genetic test of cancer-related genes, either in a tumour (to guide targeted therapy) or inherited (to assess cancer risk in the patient and family).","abn":"","src":"g"},{"aka":"","expl":"Looks for parasites, eggs or parasite antigens in the sample.","abn":"","src":"g"},{"aka":"","expl":"Microscopy of a sample to look for organisms or cells.","abn":"","src":"g"},{"aka":"","expl":"Detects antibodies against nerve-muscle proteins. Used to diagnose myasthenia gravis, Lambert-Eaton syndrome and related disorders.","abn":"","src":"g"},{"aka":"","expl":"Examines joint fluid under polarised light for crystals: urate (gout) or calcium pyrophosphate (pseudogout).","abn":"","src":"g"},{"aka":"","expl":"FISH test using fluorescent DNA probes to detect specific chromosome changes in cells. Used to diagnose and classify cancers or genetic syndromes. This version is done on joint (synovial) fluid.","abn":"","src":"g"},{"aka":"","expl":"Tests whether B or T cells are clonal (all from one cell), which supports a diagnosis of lymphoma or leukaemia.","abn":"","src":"g"},{"aka":"","expl":"Tests whether B or T cells are clonal (all from one cell), which supports a diagnosis of lymphoma or leukaemia.","abn":"","src":"g"},{"aka":"","expl":"Calculated index from fasting glucose and insulin that estimates insulin resistance.","abn":"","src":"g"},{"aka":"","expl":"Measures protective antibodies after vaccination. Used to check immunity and to assess immune function (response to vaccines).","abn":"","src":"g"},{"aka":"","expl":"TSH with free T4 (and sometimes T3) to assess how well the thyroid is working.","abn":"","src":"g"},{"aka":"","expl":"Molecular test on thyroid nodule biopsy cells when the cytology is indeterminate, estimating whether the nodule is benign or cancer.","abn":"","src":"g"},{"aka":"","expl":"Detects antibodies against the named organism. IgM usually suggests recent infection; IgG shows past infection or immunity.","abn":"","src":"g"},{"aka":"","expl":"Genetic test of the gene(s) linked to the named condition. Used to confirm a suspected inherited disorder, guide care and test family members.","abn":"","src":"g"},{"aka":"","expl":"Measures total protein in a body fluid, used to classify it as transudate or exudate.","abn":"","src":"g"},{"aka":"","expl":"PCR test detecting the organism’s genetic material, confirming active infection. Quantitative versions measure viral load to guide treatment.","abn":"","src":"g"},{"aka":"","expl":"PCR test detecting the organism’s genetic material, confirming active infection. Quantitative versions measure viral load to guide treatment.","abn":"","src":"g"},{"aka":"","expl":"Genetic test of cancer-related genes, either in a tumour (to guide targeted therapy) or inherited (to assess cancer risk in the patient and family).","abn":"","src":"g"},{"aka":"","expl":"Measures TPMT and/or NUDT15. Low activity means a high risk of toxicity from thiopurine drugs, so dose is reduced.","abn":"","src":"g"},{"aka":"","expl":"Culture of the blood unit involved in a transfusion reaction, to rule out bacterial contamination of the product.","abn":"","src":"g"},{"aka":"","expl":"Rechecks the ABO/RhD group of a donor blood unit to confirm it is labelled correctly.","abn":"","src":"g"},{"aka":"","expl":"Specialty lab screening panel combining several blood markers or biological-age measures for wellness assessment.","abn":"","src":"g"},{"aka":"","expl":"Pharmacogenetic test of genes affecting drug metabolism. Helps choose drugs and doses.","abn":"","src":"g"},{"aka":"","expl":"Measures urea in urine, used to estimate protein intake and kidney handling of nitrogen.","abn":"","src":"g"},{"aka":"","expl":"Measures urea in urine, used to estimate protein intake and kidney handling of nitrogen.","abn":"","src":"g"},{"aka":"","expl":"Looks for parasites, eggs or parasite antigens in the sample.","abn":"","src":"g"},{"aka":"","expl":"PCR test detecting the organism’s genetic material, confirming active infection. Quantitative versions measure viral load to guide treatment. This version is done on bronchoalveolar lavage (lung wash).","abn":"","src":"g"},{"aka":"","expl":"PCR test detecting the organism’s genetic material, confirming active infection. Quantitative versions measure viral load to guide treatment.","abn":"","src":"g"},{"aka":"","expl":"PCR test detecting the organism’s genetic material, confirming active infection. Quantitative versions measure viral load to guide treatment.","abn":"","src":"g"},{"aka":"","expl":"Measures VEGF-D, used to diagnose lymphangioleiomyomatosis (LAM).","abn":"","src":"g"},{"aka":"","expl":"Tests for syphilis by detecting antibodies to Treponema pallidum. This version is done on spinal fluid (CSF).","abn":"","src":"g"},{"aka":"","expl":"Measures a heart drug level in blood. Used to guide dosing and detect toxicity.","abn":"","src":"g"},{"aka":"","expl":"Measures very long chain fatty acids. Raised in peroxisomal disorders such as adrenoleukodystrophy.","abn":"","src":"g"},{"aka":"","expl":"Genetic test of cancer-related genes, either in a tumour (to guide targeted therapy) or inherited (to assess cancer risk in the patient and family).","abn":"","src":"g"},{"aka":"","expl":"Identifies the exact species or type of an organism grown in culture.","abn":"","src":"g"},{"aka":"","expl":"Detects antibodies against nerve-muscle proteins. Used to diagnose myasthenia gravis, Lambert-Eaton syndrome and related disorders.","abn":"","src":"g"},{"aka":"","expl":"Tests von Willebrand factor level, function or structure. Used to diagnose von Willebrand disease, the most common inherited bleeding disorder.","abn":"","src":"g"},{"aka":"","expl":"Broad genetic sequencing of many genes at once, used when a genetic cause is suspected but not identified by targeted tests.","abn":"","src":"g"},{"aka":"","expl":"Sequences the ATP7B gene for Wilson disease, an inherited copper overload condition.","abn":"","src":"g"},{"aka":"","expl":"Genetic test of the gene(s) linked to the named condition. Used to confirm a suspected inherited disorder, guide care and test family members.","abn":"","src":"g"},{"aka":"","expl":"Tests the Y chromosome for small deletions that cause low or absent sperm production.","abn":"","src":"g"},{"aka":"","expl":"Measures ZAP-70 on CLL cells, a marker that predicts how aggressive the disease is.","abn":"","src":"g"},{"aka":"Alpha-MSH","expl":"Measures melanocyte-stimulating hormone, a peptide made from the same precursor as ACTH that stimulates skin pigmentation and helps regulate appetite. It is a specialised test, used mainly in the investigation of pituitary and adrenal disorders and rare genetic causes of obesity.","abn":"","src":"g"},{"aka":"","expl":"A genetic panel that looks for changes in the genes that control how thyroid hormone is made, transported and used by the body. It is used for congenital hypothyroidism, thyroid hormone resistance and unexplained inherited thyroid test patterns.","abn":"","src":"g"},{"aka":"CSF chloride","expl":"Measures chloride in cerebrospinal fluid. It is a minor CSF test that largely follows the blood chloride level and is now rarely used on its own.","abn":"","src":"g"},{"aka":"","expl":"Measures mycotoxins, the toxins produced by moulds, to assess exposure to mould, for example in water-damaged buildings. It is a specialty functional-medicine test.","abn":"","src":"g"},{"aka":"","expl":"Blood antibody test (Cyrex Array 22) for antibodies linked to irritable bowel syndrome and small intestinal bacterial overgrowth after gut infection, such as anti-CdtB and anti-vinculin.","abn":"","src":"g"},{"aka":"","expl":"Hormone profile from a specialty lab, measured in blood. It covers sex hormones and cortisol, and the larger profiles add thyroid hormones and antibodies.","abn":"","src":"g"},{"aka":"","expl":"Thyroid and adrenal profile from a specialty lab, measured in blood. It covers thyroid hormones, thyroid antibodies and cortisol.","abn":"","src":"g"},{"aka":"","expl":"Liquid biopsy: tests tumour DNA circulating in the blood for gene changes in advanced solid cancers. The results help choose targeted treatment when tissue is not available.","abn":"","src":"g"},{"aka":"","expl":"Liquid biopsy: tests tumour DNA circulating in the blood for gene changes in advanced solid cancers. The results help choose targeted treatment when tissue is not available.","abn":"","src":"g"},{"aka":"","expl":"Blood-based cancer profiling: analyses tumour DNA and RNA circulating in the blood to look for gene changes that guide cancer treatment.","abn":"","src":"g"},{"aka":"","expl":"Blood test that looks for tiny amounts of tumour DNA after cancer treatment (minimal residual disease). A positive result suggests a higher risk of recurrence.","abn":"","src":"g"},{"aka":"","expl":"Personalised blood test that tracks tumour DNA after cancer treatment, using the patient's own tumour profile. A positive result signals residual or returning disease.","abn":"","src":"g"},{"aka":"","expl":"Blood-based colorectal cancer screening test that looks for DNA signals from colorectal cancer. A positive result should be followed by colonoscopy.","abn":"","src":"g"},{"aka":"","expl":"Tests blood for inherited gene changes (for example BRCA1 and BRCA2) that raise the risk of cancer. Results guide screening, preventive options and testing of relatives.","abn":"","src":"g"},{"aka":"","expl":"Fast-turnaround blood test for inherited gene changes (such as BRCA1 and BRCA2) in a person newly diagnosed with breast cancer. Results guide surgery and drug choices.","abn":"","src":"g"},{"aka":"","expl":"Measures phosphorylated tau 217 (and, in the ratio test, amyloid beta 42) in blood. These are markers of Alzheimer disease pathology and help decide on further assessment.","abn":"","src":"g"},{"aka":"","expl":"Consumer DNA test from a cheek (buccal) swab. It reports genetic traits, ancestry and inherited health risk markers; findings with medical implications should be confirmed by a clinical genetic test.","abn":"","src":"g"},{"aka":"","expl":"Combined specialty-lab kit: a comprehensive stool analysis with parasitology, a dried urine hormone profile (DUTCH Plus, which adds saliva cortisol on waking) and a urine organic acids test.","abn":"","src":"g"},{"aka":"","expl":"Combined specialty-lab kit: a dried urine hormone profile (DUTCH Complete) and a stool DNA test of gut microbes and pathogens (GI-MAP).","abn":"","src":"g"},{"aka":"","expl":"Combined specialty-lab kit: a dried urine hormone profile with saliva cortisol on waking (DUTCH Plus) and a stool DNA test of gut microbes and pathogens (GI-MAP).","abn":"","src":"g"},{"aka":"","expl":"Specialty-lab hormone profile (DUTCH Plus): dried urine samples measure sex hormones, cortisol and their breakdown products, and saliva samples taken after waking measure the cortisol awakening response.","abn":"","src":"g"},{"aka":"ACTH, Corticotropin","expl":"Measures ACTH, the pituitary hormone that drives cortisol production by the adrenal glands. Read together with cortisol, it shows whether a cortisol problem starts in the pituitary or in the adrenal gland.","abn":"Increased levels: Addison disease (primary adrenal insufficiency); Pituitary-dependent Cushing syndrome; Ectopic ACTH syndrome; Stress\nDecreased levels: Secondary adrenal insufficiency (pituitary); Hypopituitarism; Adrenal adenoma or carcinoma","src":"m"},{"aka":"Allergen-specific IgE, RAST, IgE antibody test","expl":"Measures IgE antibodies in the blood, either total IgE or IgE against a specific allergen. It confirms an allergy and identifies the trigger, and is useful when skin testing is unsuitable or risky.","abn":"Increased levels: Asthma; Allergic rhinitis; Food allergy; Drug allergy; Dermatitis; Occupational allergy; Angioedema","src":"m"},{"aka":"AAT, A1AT","expl":"Measures alpha1-antitrypsin, a protein that protects the lungs and liver from damage. Low levels, usually from an inherited gene variant, cause early-onset emphysema in adults and liver disease in children.","abn":"Increased levels: Acute or chronic inflammation; Infection; Stress\nDecreased levels: Early-onset emphysema; Liver cirrhosis in children; Neonatal respiratory distress syndrome; Low serum protein (e.g., nephrotic syndrome)","src":"m"},{"aka":"Al","expl":"Measures aluminium. It is mainly used in kidney failure and dialysis patients, who cannot clear aluminium and can build up toxic levels that affect the brain and bones.","abn":"Increased levels: Aluminium toxicity (e.g., dialysis patients, aluminium-based phosphate binders)","src":"m"},{"aka":"ACA, Antiphospholipid antibodies","expl":"Detects IgG and IgM antibodies to cardiolipin, a type of antiphospholipid antibody. They are linked to blood clots, recurrent pregnancy loss and low platelets, and help diagnose antiphospholipid syndrome.","abn":"Increased levels: Antiphospholipid syndrome; Systemic lupus erythematosus; Thrombosis; Thrombocytopenia; Recurrent fetal loss; Syphilis; Acute infection","src":"m"},{"aka":"Anti-CCP, Citrulline antibody","expl":"Detects antibodies to citrullinated peptides. They appear early in rheumatoid arthritis and are highly specific for it, which helps when rheumatoid factor is negative or borderline.","abn":"Increased levels: Rheumatoid arthritis","src":"m"},{"aka":"Anti-dsDNA, Double-stranded DNA antibody","expl":"Detects antibodies against double-stranded DNA, which are found in most patients with active lupus (SLE) and rarely in other conditions. Levels fall with treatment and rise with flares, especially lupus nephritis.","abn":"Increased levels: Systemic lupus erythematosus; Lupus nephritis; Chronic hepatitis; Infectious mononucleosis; Biliary cirrhosis","src":"m"},{"aka":"Anti-Xa, Heparin assay, LMWH level","expl":"Measures heparin activity in the blood through its effect on factor Xa. It is used to monitor low molecular weight heparin, and unfractionated heparin when the APTT is unreliable.","abn":"Increased levels: Heparin treatment; Renal failure (reduced clearance of heparin)","src":"m"},{"aka":"Anti-LKM-1","expl":"Detects liver/kidney microsomal type 1 antibodies. They are the marker of type 2 autoimmune hepatitis, which mostly affects young females and tends to be severe but responds to treatment.","abn":"Increased levels: Autoimmune hepatitis type 2; Chronic hepatitis C (some patients)","src":"m"},{"aka":"AMA, M2 antibody","expl":"Detects antibodies to mitochondria. They are found in about 95% of patients with primary biliary cholangitis (primary biliary cirrhosis), so the test is the main serological marker for that disease.","abn":"Increased levels: Primary biliary cholangitis; Chronic active hepatitis; Autoimmune hepatitis; Drug-induced cholestasis; Systemic lupus erythematosus; Syphilis","src":"m"},{"aka":"AT-III, Antithrombin III","expl":"Measures antithrombin, a natural anticoagulant made by the liver. Low levels, inherited or acquired, increase the risk of venous clots and can cause poor response to heparin.","abn":"Decreased levels: Hereditary antithrombin deficiency; Liver disease; Disseminated intravascular coagulation; Nephrotic syndrome; Heparin treatment; Venous thrombosis","src":"m"},{"aka":"ABG, VBG, CBG, Blood gases","expl":"Measures pH, carbon dioxide (Pco2), oxygen (Po2), bicarbonate and oxygen saturation. It assesses breathing, oxygenation and acid–base balance, and is used to monitor ventilated and critically ill patients.","abn":"Decreased pH (acidosis): Diabetic ketoacidosis; Lactic acidosis; Renal failure; Severe diarrhoea; Respiratory failure\nIncreased pH (alkalosis): Prolonged vomiting or gastric suction; Hypokalaemia; Hyperventilation","src":"m"},{"aka":"Beta-hydroxybutyric acid, BHB, Ketones","expl":"Measures beta-hydroxybutyrate, the main ketone body made when the body burns fat. It is the preferred test to diagnose and monitor diabetic ketoacidosis and is more reliable than urine ketones.","abn":"Increased levels: Diabetic ketoacidosis; Alcoholic ketoacidosis; Fasting and starvation; Ketogenic or high-fat diet; Salicylate poisoning","src":"m"},{"aka":"Blood C/S","expl":"Grows bacteria from blood to detect bloodstream infection (bacteraemia). Two sets from separate sites help tell a true infection from skin contamination, and sensitivity testing guides antibiotic choice.","abn":"Positive culture: Bacteraemia; Sepsis; Infective endocarditis","src":"m"},{"aka":"Peripheral smear, Blood film, RBC morphology","expl":"A stained blood film is examined under the microscope to look at the size, shape and appearance of red cells, white cells and platelets. It helps diagnose anaemias, leukaemias, infections and the effects of drugs on blood cells.","abn":"","src":"m"},{"aka":"BTMs, CTX, NTx, P1NP, Osteocalcin, Bone-specific alkaline phosphatase","expl":"Measures substances released when bone is broken down or formed. These markers show changes in bone turnover within months, so they are used to monitor osteoporosis treatment and other bone diseases.","abn":"Increased levels: Osteoporosis; Paget disease of bone; Bone metastases or bone tumours; Hyperparathyroidism; Hyperthyroidism; Acromegaly\nDecreased levels: Effective antiresorptive treatment; Hypoparathyroidism; Hypothyroidism; Corticosteroid therapy","src":"m"},{"aka":"Tumour markers","expl":"Measures a substance made in excess by certain cancers. Tumour markers are mainly used to monitor treatment response and detect recurrence; they are not reliable for screening because non-cancer conditions can also raise them.","abn":"Increased levels: Cancer (primary or recurrent); Metastatic cancer; Some benign conditions (e.g., liver disease, inflammation)","src":"m"},{"aka":"Total CO2, CO2 content, Serum bicarbonate","expl":"Measures bicarbonate (total carbon dioxide) in serum, usually as part of the electrolyte panel. It reflects the metabolic part of acid–base balance.","abn":"Increased levels: Metabolic alkalosis; Severe vomiting; Aldosteronism; Emphysema (compensation)\nDecreased levels: Metabolic acidosis; Diabetic ketoacidosis; Renal failure; Severe diarrhoea; Salicylate toxicity; Shock; Starvation","src":"m"},{"aka":"Lymphocyte immunophenotyping, CD4/CD8, T-cell subsets","expl":"Counts lymphocyte subsets (T cells including CD4 and CD8, B cells and NK cells) by flow cytometry. It is used to follow HIV and other immune deficiencies and to monitor transplant patients.","abn":"Decreased CD4 count: HIV infection and AIDS; Congenital immunodeficiency; Immunosuppressive treatment","src":"m"},{"aka":"Chlamydia antibodies","expl":"Detects antibodies to Chlamydia species. These organisms cause genital infection (C. trachomatis), pneumonia (C. pneumoniae) and psittacosis (C. psittaci); IgM suggests recent infection and IgG past exposure.","abn":"Positive result: Chlamydia trachomatis infection; Chlamydia pneumoniae pneumonia; Psittacosis","src":"m"},{"aka":"True cholinesterase, RBC cholinesterase","expl":"Measures cholinesterase enzyme activity. It identifies poisoning by organophosphate insecticides and inherited enzyme deficiency that causes prolonged paralysis after certain anaesthetic drugs.","abn":"Decreased levels: Organophosphate insecticide poisoning; Congenital cholinesterase deficiency; Liver disease; Malnutrition","src":"m"},{"aka":"C. diff toxin","expl":"Detects Clostridioides difficile toxins in stool. This infection usually follows antibiotic use and ranges from mild diarrhoea to severe pseudomembranous colitis.","abn":"Positive result: Antibiotic-associated diarrhoea; Pseudomembranous colitis; C. difficile colitis","src":"m"},{"aka":"Coagulation factors, Clotting factor assay","expl":"Measures the activity of an individual clotting factor. It is used to find the cause of a prolonged PT or APTT or a bleeding tendency, and to diagnose and monitor haemophilia and other factor deficiencies.","abn":"Decreased levels: Inherited factor deficiency (e.g., haemophilia A or B); Liver disease; Vitamin K deficiency; Warfarin treatment; Disseminated intravascular coagulation; Factor inhibitors","src":"m"},{"aka":"Delta-ALA, ALA","expl":"Measures aminolevulinic acid, an early building block of haem, in urine. Raised levels are found in some porphyrias, especially acute intermittent porphyria, and in lead poisoning.","abn":"Increased levels: Acute porphyria; Lead poisoning; Chronic alcohol excess","src":"m"},{"aka":"DST, Overnight dexamethasone test","expl":"Cortisol is measured after a dose of dexamethasone, which normally switches off ACTH and lowers cortisol. Failure of cortisol to fall points to Cushing syndrome.","abn":"Failure to suppress: Cushing syndrome; Cushing disease; Ectopic ACTH-producing tumour; Adrenal adenoma or carcinoma; Depression; Hyperthyroidism","src":"m"},{"aka":"Diabetes autoantibodies, GAD antibody, Insulin autoantibody","expl":"Detects autoantibodies against the insulin-producing cells of the pancreas or insulin itself. They help distinguish type 1 (autoimmune) diabetes from type 2 diabetes.","abn":"Positive result: Type 1 diabetes; Latent autoimmune diabetes of adults; Insulin antibodies after insulin treatment","src":"m"},{"aka":"TDM, Therapeutic drug monitoring","expl":"Measures the level of a drug in the blood to keep it within the effective range and avoid toxicity. It is used for drugs with a narrow therapeutic range, such as some antibiotics, anticonvulsants, antiarrhythmics and immunosuppressants.","abn":"Abnormal levels: Below the therapeutic range (under-dosing or poor adherence); Above the therapeutic range (risk of toxicity)","src":"m"},{"aka":"Febrile agglutinins","expl":"Detects antibodies to organisms that cause febrile illness, such as Brucella, Rickettsia and Francisella tularensis. Rising titres support the diagnosis and falling titres follow successful treatment.","abn":"Increased titres: Brucellosis; Rickettsial disease; Tularaemia; Salmonellosis","src":"m"},{"aka":"Faecal calprotectin","expl":"Measures calprotectin, a protein from neutrophils, in stool. It shows inflammation of the gut and helps tell inflammatory bowel disease from irritable bowel syndrome.","abn":"Increased levels: Crohn disease; Ulcerative colitis; Infectious colitis; Coeliac disease; Necrotising enterocolitis","src":"m"},{"aka":"Coeliac antibodies, tTG, EMA, Gliadin antibodies","expl":"Detects antibodies made in coeliac disease against tissue transglutaminase, endomysium or gliadin. These tests diagnose coeliac disease and check that a gluten-free diet is working.","abn":"Positive result: Coeliac disease; Dermatitis herpetiformis","src":"m"},{"aka":"OGTT, GTT","expl":"Glucose is measured fasting and at set times after a standard glucose drink (usually 75 g). It diagnoses diabetes, including gestational diabetes, when fasting results are borderline.","abn":"Raised results: Diabetes mellitus; Gestational diabetes; Cushing syndrome; Acromegaly; Acute stress; Corticosteroid or diuretic therapy","src":"m"},{"aka":"GH stimulation test, Glucagon stimulation test","expl":"Growth hormone is measured at timed intervals after a stimulus such as glucagon, arginine, clonidine or insulin. A poor GH rise confirms growth hormone deficiency, because a single random GH level is unreliable.","abn":"Inadequate GH response: Growth hormone deficiency; Hypopituitarism","src":"m"},{"aka":"Hb electrophoresis, Haemoglobinopathy screen","expl":"Separates and measures the different types of haemoglobin (such as A, A2, F, S and C). It diagnoses sickle cell disease, thalassaemias and other haemoglobin variants.","abn":"Abnormal patterns: Sickle cell disease or trait; Beta thalassaemia major or minor; HbH disease; HbC disease","src":"m"},{"aka":"Hepatitis serology, Hepatitis markers","expl":"Detects antigens, antibodies or viral DNA/RNA of the hepatitis viruses (A, B, C, D and E). The pattern of results shows whether infection is current, past or chronic, whether a person is immune, and how much virus is present.","abn":"Positive result: Acute or chronic viral hepatitis; Past infection; Vaccine immunity (hepatitis B surface antibody)","src":"m"},{"aka":"HIV genotype, HIV resistance testing","expl":"Looks for changes in the HIV genome that make the virus resistant to antiretroviral drugs. Results help choose an effective treatment combination.","abn":"","src":"m"},{"aka":"HIV viral load","expl":"Measures the amount of HIV RNA in the blood. It sets a baseline before treatment, shows whether treatment is working and helps detect resistance or poor adherence.","abn":"Detectable or rising viral load: Untreated HIV infection; Treatment failure; Drug resistance; Poor adherence","src":"m"},{"aka":"HIV test, HIV Ag/Ab, HIV PCR","expl":"Detects HIV infection, either through antibodies and the p24 antigen or directly through the virus's genetic material. PCR can detect infection earlier, before antibodies appear.","abn":"Positive result: HIV-1 or HIV-2 infection","src":"m"},{"aka":"HLA-B27","expl":"Detects the HLA-B27 tissue type, which is strongly linked with ankylosing spondylitis and related inflammatory arthritis. A positive result supports the diagnosis but does not prove it.","abn":"Present: Ankylosing spondylitis; Reactive arthritis (Reiter syndrome); Anterior uveitis; Psoriatic arthritis","src":"m"},{"aka":"HTLV-I/II antibody","expl":"Detects antibodies to human T-cell lymphotropic virus types I and II. HTLV-I is linked to adult T-cell leukaemia/lymphoma and a spinal cord disease; a positive screen needs a confirmatory test.","abn":"Positive result: HTLV infection; Adult T-cell leukaemia/lymphoma; Tropical spastic paraparesis","src":"m"},{"aka":"5-HIAA","expl":"Measures 5-HIAA, the breakdown product of serotonin, in urine. It is used to diagnose and follow carcinoid (neuroendocrine) tumours.","abn":"Increased levels: Carcinoid tumour; Some foods and drugs (e.g., bananas, avocado)\nDecreased levels: Depression; Migraine","src":"m"},{"aka":"IgG, IgA, IgM levels","expl":"Measures the main antibody classes in the blood. Low levels point to immune deficiency, and high levels are seen in chronic infection, inflammation, liver disease and some blood cancers.","abn":"Increased levels: Chronic infection; Autoimmune disease; Chronic liver disease; Multiple myeloma (one class)\nDecreased levels: Congenital immunodeficiency; Protein loss (e.g., nephrotic syndrome); Immunosuppressive treatment","src":"m"},{"aka":"Legionella antibody","expl":"Detects antibodies to Legionella, the cause of Legionnaires disease (a severe pneumonia) and Pontiac fever. A fourfold rise between acute and convalescent samples confirms recent infection.","abn":"Positive result: Legionnaires disease; Pontiac fever","src":"m"},{"aka":"Borrelia antibody, Lyme serology","expl":"Detects antibodies to Borrelia burgdorferi, the tick-borne bacterium that causes Lyme disease. A positive screen is confirmed by Western blot, and PCR can detect the organism directly.","abn":"Positive result: Lyme disease","src":"m"},{"aka":"Maternal triple screen, Quad screen","expl":"A second-trimester blood screen combining AFP, hCG and other markers with the mother's details. It estimates the risk of Down syndrome, trisomy 18 and neural tube defects; a high-risk result needs diagnostic testing.","abn":"Increased risk: Trisomy 21 (Down syndrome); Trisomy 18; Neural tube defects; Abdominal wall defects","src":"m"},{"aka":"Plasma metanephrines, Normetanephrine","expl":"Measures metanephrine and normetanephrine, breakdown products of adrenaline and noradrenaline, in plasma. It is a highly sensitive test for pheochromocytoma; a normal result makes the tumour very unlikely.","abn":"Increased levels: Pheochromocytoma; Paraganglioma","src":"m"},{"aka":"B2M, Beta-2 microglobulin","expl":"Measures beta-2 microglobulin, a small protein on the surface of most cells. Blood levels reflect tumour burden in myeloma and lymphoma and rise in kidney disease.","abn":"Increased levels: Multiple myeloma; Lymphoma; Leukaemia; Kidney disease; Renal transplant rejection; Chronic inflammation; HIV and CMV infection","src":"m"},{"aka":"Mycoplasma IgG, Mycoplasma IgM","expl":"Detects antibodies to Mycoplasma pneumoniae, a common cause of 'atypical' pneumonia. A positive IgM suggests recent infection, while IgG alone shows past exposure.","abn":"Positive result: Mycoplasma pneumonia; Tracheobronchitis; Pharyngitis","src":"m"},{"aka":"Neutrophil antibodies, Granulocyte antibodies","expl":"Detects antibodies against neutrophils. It is used to investigate transfusion reactions such as TRALI, and unexplained neutropenia in infants and adults.","abn":"Positive result: Transfusion-related acute lung injury (TRALI); Alloimmune neonatal neutropenia; Autoimmune neutropenia","src":"m"},{"aka":"NBS, Newborn screen, Heel prick test","expl":"Screens newborn blood for inherited metabolic, endocrine and blood disorders that are not apparent at birth, such as phenylketonuria and congenital hypothyroidism. Early treatment prevents serious illness or disability.","abn":"Positive screen: Inborn errors of metabolism; Congenital hypothyroidism; Congenital adrenal hyperplasia; Haemoglobinopathies","src":"m"},{"aka":"APTT, PTT","expl":"Measures how long plasma takes to clot through the intrinsic and common pathways. It screens for clotting factor deficiencies and is used to monitor unfractionated heparin.","abn":"Prolonged: Haemophilia A or B; Von Willebrand disease; Heparin treatment; Liver disease; Vitamin K deficiency; Disseminated intravascular coagulation; Lupus anticoagulant\nShortened: Early disseminated intravascular coagulation; Extensive cancer","src":"m"},{"aka":"Phosphate, Inorganic phosphorus","expl":"Measures phosphate in the blood. Its level is closely linked to calcium and parathyroid hormone, and abnormal results point to kidney, bone or parathyroid disorders.","abn":"Increased levels: Renal failure; Hypoparathyroidism; Bone metastases; High phosphate intake; Acromegaly\nDecreased levels: Hyperparathyroidism; Poor intake or malabsorption; Chronic antacid use; Alcoholism; Refeeding syndrome","src":"m"},{"aka":"Anti-PLA2R","expl":"Detects antibodies to the phospholipase A2 receptor, found in most patients with primary membranous nephropathy. Levels follow disease activity and help separate primary from secondary causes of nephrotic syndrome.","abn":"Positive result: Primary membranous nephropathy","src":"m"},{"aka":"PNH flow cytometry, FLAER, CD55/CD59","expl":"Flow cytometry checks red and white cells for missing GPI-anchored proteins (such as CD55 and CD59). Their loss confirms paroxysmal nocturnal haemoglobinuria, an acquired cause of haemolysis and clots.","abn":"Decreased expression: Paroxysmal nocturnal haemoglobinuria","src":"m"},{"aka":"Porphyrins, PBG, Porphobilinogen","expl":"Measures porphyrins and porphobilinogen, building blocks of haem, in urine. The pattern helps identify the type of porphyria and detects lead poisoning.","abn":"Increased levels: Porphyrias; Lead poisoning; Liver disease; Pellagra","src":"m"},{"aka":"Urine potassium","expl":"Measures potassium passed in the urine. It shows whether a low or high blood potassium is caused by the kidneys or by losses elsewhere.","abn":"Increased levels: Diuretic therapy; Hyperaldosteronism; Cushing syndrome; Renal tubular acidosis; Chronic renal failure; Alkalosis\nDecreased levels: Vomiting or diarrhoea; Addison disease; Dehydration; Malnutrition; Acute renal failure","src":"m"},{"aka":"PAPP-A","expl":"Measures pregnancy-associated plasma protein-A in early pregnancy, usually with free beta-hCG and nuchal scan. Low levels at 8–14 weeks are linked with Down syndrome and poor pregnancy outcomes such as growth restriction.","abn":"Decreased levels: Trisomy 21 or trisomy 18 risk; Intrauterine growth restriction; Preeclampsia; Preterm delivery; Stillbirth","src":"m"},{"aka":"CgA","expl":"Measures chromogranin A, a protein released by neuroendocrine cells. It is used as a marker to diagnose and monitor carcinoid and other neuroendocrine tumours.","abn":"Increased levels: Carcinoid tumours; Neuroendocrine tumours; Pheochromocytoma; Small cell lung cancer","src":"m"},{"aka":"Urine sodium","expl":"Measures sodium passed in the urine. It helps assess fluid status and find the cause of low blood sodium or acute kidney injury.","abn":"Increased levels: Diuretic therapy; Adrenal insufficiency; SIADH; Diabetic ketoacidosis; Hypothyroidism\nDecreased levels: Heart failure; Dehydration or diarrhoea; Prerenal kidney injury; Cushing syndrome; Aldosteronism","src":"m"},{"aka":"Sputum C/S","expl":"Grows bacteria from sputum or other respiratory samples to identify the cause of a chest infection, with a Gram stain as the first step. Sensitivity testing then shows which antibiotics will work.","abn":"Positive culture: Bacterial pneumonia; Bronchitis; Atypical infection (e.g., tuberculosis)","src":"m"},{"aka":"Drug screen, Drugs of abuse","expl":"Screens urine for common drugs of abuse such as amphetamines, benzodiazepines, cocaine and opiates. A positive screen should be confirmed by a more specific method.","abn":"Positive result: Recent drug use (confirm with a specific test)","src":"m"},{"aka":"Throat swab culture, Nose swab culture","expl":"Grows organisms from a throat or nose swab to find specific pathogens, mainly group A streptococcus in sore throat, or carriage of organisms such as Staphylococcus aureus.","abn":"Positive culture: Streptococcal pharyngitis; Other bacterial pathogens (e.g., Bordetella pertussis, Corynebacterium diphtheriae)","src":"m"},{"aka":"Toxoplasma IgG, Toxoplasma IgM","expl":"Detects antibodies to Toxoplasma gondii, a parasite caught from undercooked meat or cat faeces. It is used especially in pregnancy, where new infection can harm the fetus; IgM suggests recent infection and IgG past exposure.","abn":"Positive result: Recent or past toxoplasmosis; Congenital toxoplasmosis","src":"m"},{"aka":"T3, Triiodothyronine","expl":"Measures triiodothyronine (T3), the active thyroid hormone. It is most useful in suspected hyperthyroidism, especially when T4 is normal (T3 toxicosis).","abn":"Increased levels: Graves disease; Toxic nodular goitre; Thyroiditis; Pregnancy\nDecreased levels: Hypothyroidism; Pituitary insufficiency; Severe non-thyroidal illness; Malnutrition","src":"m"},{"aka":"cTnI, Cardiac troponin","expl":"Measures cardiac troponin, a protein released when heart muscle is damaged. It is the main blood test for diagnosing heart attack and assessing risk in chest pain.","abn":"Increased levels: Myocardial infarction; Myocardial injury (e.g., myocarditis, heart failure, pulmonary embolism)","src":"m"},{"aka":"AFB culture, AFB smear, Mycobacterial culture","expl":"Detects and grows acid-fast mycobacteria, including Mycobacterium tuberculosis, from clinical samples. The stain gives a quick result, while culture takes weeks but confirms the species and allows drug-susceptibility testing.","abn":"Positive result: Tuberculosis; Nontuberculous mycobacterial infection","src":"m"},{"aka":"Urine C/S, MSU culture","expl":"Grows bacteria from urine to diagnose urinary tract infection, with sensitivity testing to guide antibiotics. The sample should be collected before antibiotics are started.","abn":"Positive culture: Urinary tract infection","src":"m"},{"aka":"WBC differential, Diff","expl":"Counts the different types of white blood cells (neutrophils, lymphocytes, monocytes, eosinophils and basophils). The pattern helps point to infection, inflammation, allergy or blood disorders.","abn":"Increased white cells: Infection; Inflammation; Leukaemia; Tissue necrosis; Stress\nDecreased white cells: Bone marrow failure; Drug toxicity; Overwhelming infection; Autoimmune disease","src":"m"},{"aka":"Wound C/S, Pus culture","expl":"Grows organisms from a wound or pus sample to identify the cause of infection. A Gram stain gives an early guide, and sensitivity testing shows which antibiotics will work.","abn":"Positive culture: Wound infection; Abscess","src":"m"},{"aka":"Drug screen, Drugs of abuse","expl":"Screens blood for a drug or drug class, such as amphetamines, benzodiazepines or cocaine. A positive screen should be confirmed by a more specific method.","abn":"Positive result: Recent drug use (confirm with a specific test)","src":"m"},{"aka":"TB PCR, Mycobacterium tuberculosis NAAT","expl":"Detects Mycobacterium tuberculosis DNA directly in a clinical sample such as respiratory fluid, CSF or tissue. It gives a rapid result for active tuberculosis; culture remains the reference test and is needed for drug-susceptibility testing.","abn":"Positive result: Active tuberculosis","src":"m"},{"aka":"IGRA, QuantiFERON-TB Gold","expl":"Blood test that measures the immune response to tuberculosis proteins (interferon-gamma release assay). A positive result shows TB infection, latent or active, and further tests are needed to look for active disease.","abn":"Positive result: Latent TB infection; Active tuberculosis","src":"m"},{"aka":"Porphyrins, Erythrocyte porphyrins","expl":"Measures porphyrins, building blocks of haem, in blood. The pattern helps identify the type of porphyria, especially those affecting red cells and skin, and detects lead poisoning.","abn":"Increased levels: Porphyrias (e.g., erythropoietic protoporphyria); Lead poisoning; Iron deficiency","src":"m"},{"aka":"B-cell count, CD19/CD20","expl":"Counts B lymphocytes (CD20-positive cells) by flow cytometry. It is used to assess immune deficiency, lymphoproliferative disorders and the effect of B-cell–depleting treatment such as rituximab.","abn":"Increased B cells: Chronic lymphocytic leukaemia; Other lymphoproliferative disorders\nDecreased B cells: Congenital or acquired immunodeficiency; Anti-CD20 treatment (e.g., rituximab); Immunosuppressive therapy","src":"f"},{"aka":"Hb","expl":"Measures haemoglobin, the oxygen-carrying protein in red cells, here on a blood gas analyser. It detects anaemia and bleeding and guides transfusion in acute care.","abn":"Decreased levels: Anaemia (iron deficiency, thalassaemia, B12 deficiency); Acute or chronic bleeding; Haemolysis; Kidney or liver disease\nIncreased levels: Dehydration; Polycythaemia; Chronic lung disease; High altitude","src":"f"},{"aka":"G6PD","expl":"Measures glucose-6-phosphate dehydrogenase, a red cell enzyme that protects the cells from oxidative damage. Inherited deficiency causes episodes of haemolysis after certain drugs, fava beans or infection, and is common in Mediterranean, Middle Eastern, Asian and African populations.","abn":"Decreased levels: G6PD deficiency; Neonatal haemolysis and jaundice\nIncreased levels: Untreated megaloblastic anaemia; Hyperthyroidism; Viral hepatitis","src":"f"},{"aka":"Serum iron, Transferrin saturation","expl":"Measures iron in the blood and how much of the iron-carrying protein transferrin is filled (saturation). Read with TIBC and ferritin, it distinguishes iron deficiency from anaemia of chronic disease and iron overload.","abn":"Decreased levels: Iron deficiency anaemia; Chronic blood loss; Anaemia of chronic disease; Pregnancy\nIncreased levels: Haemochromatosis; Iron poisoning; Repeated transfusions; Haemolytic anaemia; Acute liver damage","src":"f"},{"aka":"Red cell folate","expl":"Measures folate inside red cells, which reflects body folate stores over the previous months better than a serum level. Low folate causes megaloblastic anaemia and, in early pregnancy, neural tube defects.","abn":"Decreased levels: Poor diet or alcohol excess; Malabsorption (e.g., coeliac disease); Increased demand (pregnancy, haemolysis); Vitamin B12 deficiency; Some drugs (e.g., methotrexate, phenytoin)","src":"f"},{"aka":"FDP, Fibrin split products","expl":"Measures fragments released when fibrin and fibrinogen are broken down by plasmin. Raised levels show active clotting and clot breakdown and help diagnose disseminated intravascular coagulation.","abn":"Increased levels: Disseminated intravascular coagulation; Venous thrombosis or pulmonary embolism; Recent surgery or trauma; Thrombolytic therapy; Liver disease","src":"f"},{"aka":"Urine SG","expl":"Measures how concentrated the urine is compared with water. It reflects hydration and the kidneys' ability to concentrate or dilute urine; osmolality is the more exact test.","abn":"Low SG: Diabetes insipidus; High fluid intake; Chronic kidney disease; Diuretics\nHigh SG: Dehydration; SIADH; Glycosuria (diabetes); Contrast media; Heart failure","src":"f"},{"aka":"Urine osmolality","expl":"Measures the concentration of dissolved particles in urine. Compared with serum osmolality, it assesses the kidneys' concentrating ability and helps investigate low sodium and passing large volumes of urine.","abn":"Increased: Dehydration; SIADH; Prerenal azotaemia; Heart failure; Addison disease\nDecreased: Diabetes insipidus; Excess water intake; Acute kidney injury; Hypokalaemia; Hypercalcaemia","src":"f"},{"aka":"Urine pH","expl":"Measures how acidic or alkaline the urine is. It reflects the kidneys' role in acid–base balance and helps assess kidney stone risk, urinary infection and renal tubular acidosis.","abn":"Acid urine (low pH): Metabolic or respiratory acidosis; Diabetic ketoacidosis; Starvation; High-protein diet; Uric acid and cystine stones\nAlkaline urine (high pH): Urinary infection with urea-splitting bacteria; Renal tubular acidosis; Vomiting; Vegetarian diet","src":"f"},{"aka":"Urine glucose, Glycosuria","expl":"Measures glucose in urine. Glucose appears when blood glucose rises above the kidney threshold (about 10 mmol/L) or when the kidney tubules fail to reabsorb it.","abn":"Increased levels: Diabetes mellitus; Gestational diabetes; Cushing syndrome, thyrotoxicosis or acromegaly; Fanconi syndrome and renal tubular disease; SGLT2 inhibitor treatment","src":"f"},{"aka":"Urine ketones, Acetone","expl":"Detects ketones (acetone, acetoacetate) in urine. They appear when the body burns fat instead of carbohydrate, as in uncontrolled diabetes, fasting or vomiting.","abn":"Increased levels: Diabetic ketoacidosis; Starvation or fasting; Prolonged vomiting or diarrhoea; Low-carbohydrate or high-fat diet; Alcoholic ketoacidosis; Glycogen storage disease","src":"f"},{"aka":"Urine pregnancy test, Urine hCG","expl":"Detects hCG in urine, the hormone made by the placenta from early pregnancy. A positive result usually means pregnancy, but hCG is also produced by some tumours.","abn":"Positive result: Pregnancy (including ectopic); Hydatidiform mole; Choriocarcinoma; Some testicular tumours\nNegative or falling: Miscarriage; Fetal demise","src":"f"},{"aka":"Urine chloride","expl":"Measures chloride passed in the urine. It reflects salt intake and fluid and electrolyte balance, and helps find the cause of metabolic alkalosis.","abn":"Decreased levels: Vomiting or gastric suction; Diarrhoea or heavy sweating; Low salt intake; Chloride-responsive metabolic alkalosis\nIncreased levels: Diuretic therapy; Addison disease; High salt intake; Bartter syndrome","src":"f"},{"aka":"Urine magnesium","expl":"Measures magnesium passed in the urine. It shows whether a low blood magnesium is caused by kidney losses or by poor intake and gut losses, and is part of kidney stone assessment.","abn":"Increased levels: Alcohol excess; Diuretic therapy; Bartter or Gitelman syndrome; Some drugs (e.g., cisplatin)\nDecreased levels: Poor intake or malabsorption; Chronic alcoholism; Long-term parenteral nutrition; Chronic kidney disease","src":"f"},{"aka":"Urine oxalate","expl":"Measures oxalate passed in the urine. High levels increase the risk of calcium oxalate kidney stones, and the test is used to investigate recurrent stones.","abn":"Increased levels: Primary hyperoxaluria; Enteric hyperoxaluria (Crohn disease, bowel resection, bariatric surgery, fat malabsorption); High oxalate or vitamin C intake; Ethylene glycol poisoning; Vitamin B6 deficiency","src":"f"},{"aka":"Urine catecholamines, VMA, Metanephrines","expl":"Measures adrenaline, noradrenaline, dopamine and their breakdown products (such as VMA) in urine. It is used to detect pheochromocytoma and, in children, neuroblastoma.","abn":"Increased levels: Pheochromocytoma; Paraganglioma; Neuroblastoma; Ganglioneuroma; Severe stress, acute myocardial infarction; Some drugs and foods","src":"f"},{"aka":"Urine creatinine, Creatinine clearance","expl":"Measures creatinine in the urine. A 24-hour value checks the collection is complete and, with a blood creatinine, gives the creatinine clearance (an estimate of kidney filtration); a random value corrects other urine results for urine concentration.","abn":"Decreased clearance: Kidney disease (glomerulonephritis, nephrotic syndrome, interstitial nephritis); Dehydration or shock; Heart failure\nIncreased clearance: Pregnancy; High cardiac output states; Burns","src":"f"},{"aka":"Urine cystine, Cystinuria screen","expl":"Measures cystine (with lysine, ornithine and arginine in the profile) in urine. Raised levels diagnose cystinuria, an inherited cause of recurrent kidney stones.","abn":"Increased levels: Cystinuria; Generalised aminoaciduria (e.g., Fanconi syndrome)","src":"f"},{"aka":"Muramidase","expl":"Measures lysozyme, an enzyme released by granulocytes and monocytes. Levels are high in acute myeloid and monocytic leukaemia and can help tell them from acute lymphoblastic leukaemia.","abn":"Increased levels: Acute myeloid or monocytic leukaemia; Sarcoidosis; Tuberculosis; Crohn disease; Kidney disease or transplant rejection\nDecreased levels: Neutropenia with bone marrow hypoplasia","src":"f"},{"aka":"Stool reducing sugars, SRS","expl":"Detects unabsorbed sugars (such as lactose, glucose or fructose) in a fresh liquid stool. A positive result points to carbohydrate malabsorption as the cause of watery diarrhoea, especially in infants.","abn":"Positive result: Lactose intolerance; Disaccharidase deficiency; Glucose–galactose malabsorption; Post-infectious or short-bowel diarrhoea","src":"f"},{"aka":"Faecal chymotrypsin","expl":"Measures chymotrypsin, a digestive enzyme made by the pancreas, in stool. Low levels suggest pancreatic insufficiency; faecal elastase is now the more reliable test.","abn":"Decreased levels: Pancreatic insufficiency; Cystic fibrosis; Chronic pancreatitis","src":"f"},{"aka":"CSF cell count","expl":"Counts and identifies the white and red cells in cerebrospinal fluid. The total and the cell type are the most sensitive sign of inflammation or infection of the brain and meninges.","abn":"Raised neutrophils: Bacterial meningitis; Brain abscess\nRaised lymphocytes: Viral, tuberculous or fungal meningitis; Multiple sclerosis; Neurosyphilis\nRed cells: Subarachnoid haemorrhage; Traumatic tap","src":"f"},{"aka":"CSF glucose","expl":"Measures glucose in cerebrospinal fluid, normally about 60% of the blood level, so a blood glucose should be taken at the same time. A low CSF glucose suggests bacterial, tuberculous or fungal meningitis.","abn":"Decreased levels: Bacterial meningitis; Tuberculous, fungal or amoebic meningitis; Meningeal spread of cancer; Subarachnoid haemorrhage; Low blood glucose\nIncreased levels: High blood glucose","src":"f"},{"aka":"CSF protein","expl":"Measures total protein in cerebrospinal fluid. It is a non-specific but sensitive sign of disease of the brain or spinal cord, rising with infection, bleeding, blockage of CSF flow and inflammation.","abn":"Increased levels: Bacterial, tuberculous or fungal meningitis; Guillain-Barré syndrome; Subarachnoid haemorrhage; Spinal cord blockage; Brain tumour or abscess; Multiple sclerosis; Traumatic tap\nDecreased levels: CSF leak; Removal of large CSF volumes","src":"f"},{"aka":"CSF albumin, CSF IgG, IgG index","expl":"Compares albumin and IgG in CSF with the levels in blood. Albumin shows leakage across the blood–brain barrier, and a raised IgG index shows antibody made within the central nervous system, as in multiple sclerosis.","abn":"Raised CSF albumin: Meningitis; Guillain-Barré syndrome; Blockage of CSF flow; CNS tumours\nRaised IgG index: Multiple sclerosis; Neurosyphilis; Subacute sclerosing panencephalitis; Chronic CNS infection","src":"f"},{"aka":"Oligoclonal bands, CSF electrophoresis","expl":"Looks for oligoclonal IgG bands in CSF that are not present in a matched blood sample. Their presence shows antibody production within the central nervous system and strongly supports multiple sclerosis.","abn":"Positive (CSF-only bands): Multiple sclerosis; Neurosyphilis; Subacute sclerosing panencephalitis; Chronic CNS infection; CNS lupus","src":"f"},{"aka":"Insulin","expl":"Measures insulin, the pancreatic hormone that lowers blood glucose, often alongside glucose in a timed test. It is used to investigate low blood sugar (such as insulinoma) and insulin resistance.","abn":"Increased levels: Insulinoma; Insulin resistance and type 2 diabetes; Obesity; Cushing syndrome; Acromegaly; Insulin injection (factitious)\nDecreased levels: Type 1 diabetes; Hypopituitarism","src":"f"},{"aka":"Plasma glucose, Blood sugar","expl":"Measures glucose in blood, fasting or at timed points during a test. It diagnoses and monitors diabetes and investigates low blood sugar.","abn":"Increased levels: Diabetes mellitus; Stress (e.g., myocardial infarction, stroke, sepsis); Cushing syndrome; Pancreatitis; Corticosteroid or thiazide treatment\nDecreased levels: Insulin or sulfonylurea excess; Insulinoma; Adrenal insufficiency; Liver failure; Starvation","src":"f"},{"aka":"Glycated serum protein","expl":"Measures fructosamine, glucose bound to serum proteins. It reflects average glucose over the previous 2–3 weeks, which helps when HbA1c is unreliable (for example haemoglobin variants or recent blood loss) or when a short-term check is needed.","abn":"Increased levels: Poorly controlled diabetes\nFalsely low: Low albumin or protein loss (e.g., nephrotic syndrome)","src":"f"},{"aka":"Androstenedione","expl":"Measures androstenedione, an androgen made by the ovaries and adrenal glands that is converted to testosterone and oestrogen. It helps investigate excess hair growth, virilisation and congenital adrenal hyperplasia, including during stimulation tests.","abn":"Increased levels: Polycystic ovary syndrome; Congenital adrenal hyperplasia; Cushing syndrome; Ovarian or adrenal tumours; Ectopic ACTH production\nDecreased levels: Adrenal or ovarian failure","src":"f"},{"aka":"Serum cortisol, Urinary free cortisol","expl":"Measures cortisol, the main adrenal stress hormone, which is normally highest in the early morning and lowest in the evening. Timed or site-specific samples help diagnose Cushing syndrome and adrenal insufficiency.","abn":"Increased levels: Cushing syndrome (loss of the normal day–night variation); Stress, trauma or surgery; Adrenal or ACTH-producing tumours; Pregnancy or oestrogen therapy\nDecreased levels: Addison disease; Pituitary insufficiency; Congenital adrenal hyperplasia; Long-term steroid treatment","src":"f"},{"aka":"Short Synacthen test, Cosyntropin stimulation test","expl":"Cortisol is measured before and at set times after an injection of synthetic ACTH (cosyntropin/Synacthen). A normal rise in cortisol excludes adrenal insufficiency, and an absent or blunted rise confirms it.","abn":"Absent or blunted response: Addison disease (primary adrenal insufficiency); Secondary adrenal insufficiency (pituitary); Long-term steroid treatment; Adrenal tumour","src":"f"},{"aka":"FSH, LH, Gonadotrophins","expl":"Measures the pituitary hormones FSH and LH, which control the ovaries and testes, as single levels or at timed points after GnRH stimulation. They help investigate infertility, menstrual problems, menopause and disorders of puberty.","abn":"Increased levels: Menopause and primary ovarian insufficiency; Primary testicular failure; Turner or Klinefelter syndrome; Polycystic ovary syndrome (LH)\nDecreased levels: Pituitary or hypothalamic failure; Kallmann syndrome; Hyperprolactinaemia; Anorexia nervosa; Hormone-secreting tumours","src":"f"},{"aka":"Prolactin with dilution","expl":"Measures prolactin, the pituitary hormone that controls milk production; the diluted sample checks for very high levels that can be under-read (the hook effect) in large pituitary tumours.","abn":"Increased levels: Prolactinoma; Hypothalamic or pituitary stalk disease; Primary hypothyroidism; Polycystic ovary syndrome; Kidney failure; Dopamine-blocking drugs\nDecreased levels: Pituitary insufficiency","src":"f"},{"aka":"Total testosterone, Free testosterone","expl":"Measures testosterone, the main male sex hormone, either total or the unbound active (free) fraction. It is used for low testosterone in men, excess hair growth or virilisation in women, and puberty disorders, including during stimulation tests.","abn":"Decreased in men: Hypogonadism; Pituitary failure; Klinefelter syndrome; Liver cirrhosis; Delayed puberty\nIncreased in women: Polycystic ovary syndrome; Congenital adrenal hyperplasia; Ovarian or adrenal tumours","src":"f"},{"aka":"Free PSA, Free/total PSA ratio","expl":"Measures the free (unbound) form of PSA and its ratio to total PSA. When total PSA is mildly raised, a low free-to-total ratio points more towards prostate cancer and a high ratio towards benign enlargement.","abn":"Low free/total ratio: Higher likelihood of prostate cancer\nHigh free/total ratio: Benign prostatic hyperplasia; Prostatitis","src":"f"},{"aka":"CK isoenzymes, CK-MB","expl":"Separates creatine kinase into its forms from skeletal muscle (MM), heart (MB) and brain (BB). It helps identify the source of a raised CK, though troponin has replaced CK-MB for heart attack.","abn":"Increased CK-MB: Myocardial infarction; Myocarditis; Cardiac surgery\nIncreased CK-MM: Muscle injury or rhabdomyolysis; Muscular dystrophy; Strenuous exercise\nIncreased CK-BB: Brain injury; Some cancers","src":"f"},{"aka":"GALT, Galactose-1-phosphate","expl":"Measures the enzymes (GALT, galactokinase) and the metabolite (galactose-1-phosphate) involved in handling the sugar galactose. They diagnose and monitor galactosaemia, an inherited disorder that causes liver disease, cataracts and failure to thrive in infants.","abn":"Decreased enzyme activity: Classic galactosaemia (GALT deficiency); Galactokinase deficiency\nIncreased galactose-1-phosphate: Galactosaemia; Poor dietary control","src":"f"},{"aka":"LDL-C, Low-density lipoprotein","expl":"Measures LDL cholesterol, the main cholesterol carried in the blood and the key target for reducing heart and stroke risk.","abn":"Increased levels: Familial hypercholesterolaemia; Diet high in saturated fat; Hypothyroidism; Nephrotic syndrome; Diabetes; Cholestatic liver disease; Chronic kidney disease\nDecreased levels: Hyperthyroidism; Malnutrition or malabsorption; Liver disease; Abetalipoproteinaemia","src":"f"},{"aka":"FFA, Non-esterified fatty acids","expl":"Measures free fatty acids released from fat stores into the blood. Levels rise with fasting and poorly controlled diabetes, and the test is used in the investigation of metabolic disorders and low blood sugar.","abn":"Increased levels: Poorly controlled diabetes; Fasting or starvation; Pheochromocytoma; Hyperthyroidism; Alcohol excess; Fatty acid oxidation defects\nDecreased levels: Malabsorption; Cystic fibrosis","src":"f"},{"aka":"Total T4, Thyroxine","expl":"Measures total thyroxine (T4), both bound and free. It assesses thyroid function, but results also change with the level of binding proteins, so free T4 is usually preferred.","abn":"Increased levels: Hyperthyroidism (Graves disease, toxic goitre); Thyroiditis; High binding protein (pregnancy, oestrogen)\nDecreased levels: Hypothyroidism; Low binding protein (nephrotic syndrome, malnutrition); T3 treatment","src":"f"},{"aka":"WNV antibody","expl":"Detects IgM and IgG antibodies to West Nile virus, a mosquito-borne flavivirus. IgM suggests recent infection, which may cause fever or, less often, encephalitis or meningitis.","abn":"Positive result: West Nile fever; West Nile encephalitis or meningitis; Cross-reaction with other flaviviruses (e.g., dengue)","src":"f"},{"aka":"Viral haemorrhagic fever testing","expl":"Detects infection with viruses that cause haemorrhagic fever, such as Ebola, hantavirus and yellow fever, by antibody or PCR testing. These infections cause fever, bleeding, low platelets and kidney or liver failure, and samples need special handling.","abn":"Positive result: Ebola virus disease; Hantavirus infection (haemorrhagic fever with renal syndrome or pulmonary syndrome); Yellow fever","src":"f"},{"aka":"Eye swab culture, Ear swab culture","expl":"Grows bacteria or fungi from an eye or ear sample to identify the cause of infection, such as conjunctivitis, keratitis, otitis media or otitis externa, with sensitivity testing to guide treatment.","abn":"Positive culture: Bacterial conjunctivitis or keratitis; Otitis media; Otitis externa (swimmer's ear); Fungal ear or eye infection","src":"f"},{"aka":"CSF culture, CSF Gram stain","expl":"Grows organisms from cerebrospinal fluid, with a Gram stain for an early result. It is essential in suspected meningitis to identify the cause and guide urgent antibiotic treatment.","abn":"Positive culture: Bacterial meningitis (e.g., S. pneumoniae, N. meningitidis, H. influenzae, Listeria, group B streptococcus); Fungal meningitis (e.g., Cryptococcus); Shunt or post-surgical infection","src":"f"},{"aka":"Sterile fluid culture, Tissue culture","expl":"Grows bacteria or fungi from normally sterile fluids (pleural, peritoneal, synovial, pericardial), bone marrow or tissue. It identifies the cause of deep infection and guides antibiotic treatment.","abn":"Positive culture: Empyema; Peritonitis; Septic arthritis; Pericarditis; Osteomyelitis; Disseminated infection","src":"f"},{"aka":"Syphilis serology, VDRL, RPR, TPHA, Treponemal antibody","expl":"Detects antibodies to Treponema pallidum, the cause of syphilis. Non-treponemal tests (VDRL, RPR) are used for screening and to monitor treatment, while treponemal tests (TPHA, treponemal IgG/IgM) confirm the diagnosis.","abn":"Positive result: Primary, secondary or latent syphilis; Previously treated syphilis (treponemal tests stay positive); False-positive non-treponemal tests (pregnancy, autoimmune disease, other infections)","src":"f"},{"aka":"EBV VCA, EBV EA, EBNA","expl":"Detects antibodies to different Epstein-Barr virus antigens. The pattern of VCA IgM, VCA IgG, early antigen and nuclear antigen antibodies tells recent infection (glandular fever) from past infection.","abn":"Recent infection: VCA IgM positive, EBNA negative\nPast infection: VCA IgG and EBNA positive\nReactivation or EBV-related disease: Raised early antigen antibodies (e.g., nasopharyngeal carcinoma, Burkitt lymphoma)","src":"f"},{"aka":"Mumps IgG, Mumps IgM","expl":"Detects antibodies to mumps virus. IgM or a rise in IgG between paired samples shows recent infection, while IgG alone shows past infection or vaccination.","abn":"Positive IgM or rising IgG: Recent mumps infection\nPositive IgG: Immunity from past infection or vaccination","src":"f"},{"aka":"VZV IgM","expl":"Detects IgM antibodies to varicella-zoster virus, the cause of chickenpox and shingles. A positive result suggests current or recent infection.","abn":"Positive result: Chickenpox; Shingles (herpes zoster); Recent vaccination","src":"f"},{"aka":"Fungal serology","expl":"Detects antibodies to the fungi that cause histoplasmosis, blastomycosis and coccidioidomycosis, which are caught by inhaling spores. Antibodies appear in the first weeks of illness; a negative result does not exclude infection.","abn":"Positive result: Histoplasmosis; Blastomycosis; Coccidioidomycosis","src":"f"},{"aka":"Aspergillus precipitins, Aspergillus IgG","expl":"Detects antibodies to Aspergillus. It is used mainly to diagnose allergic bronchopulmonary aspergillosis, aspergilloma (fungus ball) and chronic pulmonary aspergillosis.","abn":"Positive result: Allergic bronchopulmonary aspergillosis; Aspergilloma; Chronic pulmonary aspergillosis; Hypersensitivity pneumonitis (weak positives)","src":"f"},{"aka":"Entamoeba histolytica antibody","expl":"Detects antibodies to Entamoeba histolytica, the parasite that causes amoebic dysentery and liver abscess. It is most useful for amoebic liver abscess, where stool tests are often negative.","abn":"Positive result: Amoebic liver abscess; Invasive amoebic colitis; Past infection (antibodies can persist)","src":"f"},{"aka":"IFE, Immunofixation","expl":"Identifies a monoclonal protein (paraprotein) in serum or urine and its heavy- and light-chain type. It follows an abnormal protein electrophoresis or a suspected plasma cell disorder.","abn":"Monoclonal protein: Multiple myeloma; Waldenström macroglobulinaemia; MGUS; AL amyloidosis; Bence Jones (light chain) proteinuria\nPolyclonal increase: Chronic liver disease; Chronic infection; Connective tissue disease","src":"f"},{"aka":"CH50, Total complement","expl":"Measures the overall activity of the classical complement pathway. A very low result points to deficiency of a complement component, and low levels also occur when complement is consumed in immune-complex disease.","abn":"Decreased levels: Inherited complement deficiency; Systemic lupus erythematosus; Glomerulonephritis; Cryoglobulinaemia; Hereditary angioedema (during attacks)\nIncreased levels: Acute inflammation; Infection","src":"f"},{"aka":"C1-INH, C1 inhibitor","expl":"Measures the amount (antigen) and activity (function) of C1 esterase inhibitor, which controls the complement system. Low level or low function causes hereditary angioedema, with recurrent swelling of the skin, gut and airway.","abn":"Decreased level or function: Hereditary angioedema types I and II; Acquired angioedema (lymphoproliferative or autoimmune disease)","src":"f"},{"aka":"PR3-ANCA, c-ANCA","expl":"Detects antibodies to proteinase 3, the target of cytoplasmic ANCA (c-ANCA). It is highly specific for granulomatosis with polyangiitis and helps monitor relapse.","abn":"Positive result: Granulomatosis with polyangiitis (Wegener granulomatosis); Other ANCA-associated vasculitis","src":"f"},{"aka":"Ceruloplasmin","expl":"Measures ceruloplasmin, the main copper-carrying protein in blood. A low level is a key finding in Wilson disease, an inherited copper overload that damages the liver and brain.","abn":"Decreased levels: Wilson disease; Menkes disease; Malnutrition or protein loss; Severe liver disease\nIncreased levels: Pregnancy or oestrogen therapy; Inflammation and infection; Biliary obstruction","src":"f"},{"aka":"ABO group, Blood group","expl":"Determines the ABO blood group (and usually Rh D type) from red cell antigens and plasma antibodies. It is the foundation of safe transfusion and is also done for newborns, donor units and transfusion reaction investigation.","abn":"","src":"f"},{"aka":"Rh typing, Rh phenotype, Weak D","expl":"Determines the Rh D type and, in the extended phenotype, other Rh antigens (C, c, E, e). Weak D and zygosity testing refine the D type, which matters for transfusion and for preventing Rh disease in pregnancy.","abn":"Clinical relevance: Rh D–negative women need anti-D prophylaxis in pregnancy; Antigen-matched blood for transfused or immunised patients","src":"f"},{"aka":"Rh antibody titre, Anti-D titre","expl":"Measures the strength of red cell antibodies such as anti-D in pregnancy. Rising titres signal a higher risk of haemolytic disease of the fetus and newborn and the need for closer fetal monitoring.","abn":"Rising titre: Increased risk of haemolytic disease of the fetus and newborn","src":"f"},{"aka":"Compatibility test, Type and screen","expl":"Tests the patient's plasma against donor red cells, after ABO/Rh typing and antibody screening, to make sure the blood is compatible. It prevents transfusion reactions and is repeated in transfusion reaction investigation.","abn":"Incompatible: Unexpected red cell antibodies; ABO error or mislabelled sample; Autoantibodies","src":"f"},{"aka":"Coombs test, Antibody screen, Antibody identification","expl":"Antiglobulin (Coombs) testing detects red cell antibodies: the indirect test finds antibodies in plasma for screening and identification before transfusion, and the direct test finds antibodies already coating the red cells.","abn":"Positive result: Red cell alloantibodies (previous transfusion or pregnancy); Haemolytic transfusion reaction; Haemolytic disease of the newborn; Autoimmune haemolytic anaemia; Drug-induced haemolysis","src":"f"},{"aka":"HLA typing, Tissue typing","expl":"Identifies a person's HLA (tissue-type) antigens or genes at different loci and levels of detail. It is used to match donors and recipients for stem cell and organ transplantation and to study family inheritance.","abn":"Clinical relevance: Donor–recipient matching for transplantation; Disease associations (e.g., HLA-B27 with ankylosing spondylitis, DQ2/DQ8 with coeliac disease)","src":"f"},{"aka":"Karyotype, Cytogenetics","expl":"Examines the number and structure of chromosomes in bone marrow cells. In blood cancers, the chromosome changes found help diagnose the disease, predict outcome and guide treatment.","abn":"Abnormal findings: Acute myeloid or lymphoblastic leukaemia; Chronic myeloid leukaemia (Philadelphia chromosome); Myelodysplastic syndrome; Myeloproliferative neoplasms","src":"f"},{"aka":"Estriol, uE3","expl":"Measures estriol, the main oestrogen of pregnancy, which comes from the fetus and placenta. It forms part of maternal serum screening, where low levels are linked with Down syndrome and trisomy 18.","abn":"Decreased levels: Down syndrome or trisomy 18 risk; Fetal growth restriction; Fetal distress or demise; Pre-eclampsia; Placental insufficiency","src":"f"},{"aka":"GBS screen","expl":"Culture of a vaginal–rectal swab at 35–37 weeks of pregnancy to detect group B streptococcus carriage. Positive mothers are offered antibiotics in labour to prevent serious infection in the newborn.","abn":"Positive result: Group B streptococcal colonisation (intrapartum antibiotics advised)","src":"f"},{"aka":"Retinol","expl":"Measures vitamin A (retinol), needed for vision, immunity and healthy skin and lining tissues. Low levels cause night blindness and dry eyes; very high levels from supplements are toxic.","abn":"Decreased levels: Poor intake; Fat malabsorption (coeliac disease, cystic fibrosis, biliary obstruction); Liver cirrhosis; Acute infection\nIncreased levels: Excess supplements; Chronic kidney disease","src":"f"},{"aka":"Thiamine","expl":"Measures vitamin B1 (thiamine), needed for energy metabolism in nerves and the heart. Deficiency causes beriberi and Wernicke encephalopathy, most often with alcohol excess or malnutrition.","abn":"Decreased levels: Alcohol excess; Malnutrition; Prolonged vomiting or bariatric surgery; Long-term diuretics; Dialysis","src":"f"},{"aka":"Riboflavin","expl":"Measures vitamin B2 (riboflavin), needed for energy production and healthy skin and eyes. Deficiency causes cracked lips and corners of the mouth, a sore tongue and dermatitis.","abn":"Decreased levels: Poor diet; Alcohol excess; Malabsorption; Some drugs (e.g., phenothiazines, oral contraceptives)","src":"f"},{"aka":"Niacin, Nicotinic acid","expl":"Measures vitamin B3 (niacin). Severe deficiency causes pellagra (dermatitis, diarrhoea and confusion); very high doses used to treat cholesterol can damage the liver.","abn":"Decreased levels: Poor diet; Alcohol excess; Carcinoid syndrome; Isoniazid treatment; Hartnup disease\nIncreased levels: High-dose niacin treatment","src":"f"},{"aka":"Pantothenic acid","expl":"Measures vitamin B5 (pantothenic acid), needed to make coenzyme A for energy metabolism. Deficiency is rare and usually occurs with severe malnutrition.","abn":"Decreased levels: Severe malnutrition; Alcohol excess","src":"f"},{"aka":"Pyridoxine, Pyridoxal 5-phosphate (PLP)","expl":"Measures vitamin B6, needed for amino acid metabolism, red cell production and nerve function. Deficiency causes anaemia, neuropathy and skin changes; excess supplements can also cause neuropathy.","abn":"Decreased levels: Alcohol excess; Malnutrition or malabsorption; Isoniazid, hydralazine or penicillamine treatment; Pregnancy; Kidney disease\nIncreased levels: High-dose supplements","src":"f"},{"aka":"Biotin","expl":"Measures vitamin B7 (biotin), a cofactor for carboxylase enzymes. Deficiency is rare but occurs in biotinidase deficiency and with long-term raw egg white intake; high-dose supplements can interfere with many laboratory immunoassays.","abn":"Decreased levels: Biotinidase deficiency; Long-term parenteral nutrition; Anticonvulsant treatment\nIncreased levels: High-dose supplements (risk of assay interference)","src":"f"},{"aka":"Ascorbic acid","expl":"Measures vitamin C (ascorbic acid), needed for collagen formation, wound healing and iron absorption. Severe deficiency causes scurvy, with bleeding gums and poor healing.","abn":"Decreased levels: Poor intake of fruit and vegetables; Alcohol excess; Smoking; Dialysis; Malabsorption; Pregnancy","src":"f"},{"aka":"Alpha-tocopherol","expl":"Measures vitamin E (alpha-tocopherol), an antioxidant that protects cell membranes and nerves. Deficiency is mainly seen with fat malabsorption and causes neuropathy and haemolysis, especially in premature infants.","abn":"Decreased levels: Fat malabsorption (cystic fibrosis, cholestasis, short bowel); Abetalipoproteinaemia; Premature infants\nIncreased levels: High-dose supplements (increased bleeding tendency)","src":"f"},{"aka":"Phylloquinone","expl":"Measures vitamin K1, needed to make several clotting factors. Deficiency causes bleeding with a prolonged PT, especially in newborns and with fat malabsorption or long-term antibiotics.","abn":"Decreased levels: Poor intake; Fat malabsorption or biliary obstruction; Long-term antibiotics; Newborns (haemorrhagic disease of the newborn); Warfarin treatment","src":"f"},{"aka":"17-OH pregnenolone","expl":"Measures 17-hydroxypregnenolone, an early step in adrenal steroid production, at baseline or after ACTH stimulation. A high level or exaggerated rise points to 3β-hydroxysteroid dehydrogenase deficiency, a rare form of congenital adrenal hyperplasia.","abn":"Increased levels: 3β-hydroxysteroid dehydrogenase deficiency; Other forms of congenital adrenal hyperplasia; Adrenal tumours","src":"t"},{"aka":"17-OHP, 17-hydroxyprogesterone","expl":"Measures 17-hydroxyprogesterone, the steroid that builds up when 21-hydroxylase is deficient. It is the main test to diagnose and monitor congenital adrenal hyperplasia, at baseline and after ACTH stimulation.","abn":"Increased levels: Congenital adrenal hyperplasia (21-hydroxylase deficiency), classic or non-classic; 11β-hydroxylase deficiency; Polycystic ovary syndrome (mild); Adrenal or ovarian tumours","src":"t"},{"aka":"DOC","expl":"Measures 11-deoxycorticosterone, a mineralocorticoid made by the adrenal gland. High levels cause high blood pressure with low potassium and suppressed renin and aldosterone.","abn":"Increased levels: 11β-hydroxylase deficiency; 17α-hydroxylase deficiency; DOC-secreting adrenal tumour; Pregnancy","src":"t"},{"aka":"TPMT activity, 6-TGN, 6-MMP","expl":"Measures the thiopurine enzyme TPMT or the drug metabolites of azathioprine and mercaptopurine (6-thioguanine nucleotides and 6-methylmercaptopurine). Results guide safe dosing: low TPMT predicts severe bone marrow toxicity, and metabolite levels show adherence, under-dosing or liver-toxic shunting.","abn":"Low TPMT activity: High risk of myelosuppression (reduce dose or avoid)\nHigh 6-TGN: Myelosuppression risk\nHigh 6-MMP: Hepatotoxicity risk","src":"t"},{"aka":"Paracetamol level","expl":"Measures acetaminophen (paracetamol) in blood after an overdose. The level, plotted against time since ingestion on a treatment nomogram, decides whether the antidote N-acetylcysteine is needed to prevent liver failure.","abn":"Toxic level: Paracetamol overdose (risk of acute liver injury)","src":"t"},{"aka":"Urine albumin/creatinine ratio, UACR","expl":"Measures albumin relative to creatinine in a spot urine sample. It detects small amounts of albumin loss, the earliest sign of kidney damage in diabetes and hypertension.","abn":"Increased ratio: Diabetic kidney disease; Hypertensive kidney disease; Chronic kidney disease; Transient (fever, exercise, urinary infection)","src":"t"},{"aka":"APC resistance","expl":"Tests whether plasma resists the anticoagulant effect of activated protein C. Resistance is usually caused by the factor V Leiden mutation, a common inherited cause of venous clots.","abn":"APC resistance present: Factor V Leiden (heterozygous or homozygous); Pregnancy or oestrogen use; Lupus anticoagulant","src":"t"},{"aka":"Acylcarnitine profile","expl":"Measures acylcarnitines by tandem mass spectrometry. The pattern identifies inherited fatty acid oxidation and organic acid disorders and is part of newborn screening.","abn":"Abnormal profile: Fatty acid oxidation disorders (e.g., MCAD deficiency); Organic acidaemias; Carnitine transport defects","src":"t"},{"aka":"Therapeutic drug monitoring of biologics","expl":"Measures the blood level of a biologic drug (such as adalimumab, infliximab, ustekinumab or vedolizumab) and antibodies the patient has made against it. It explains loss of response in inflammatory bowel disease and other conditions and guides dose changes or switching drugs.","abn":"Low drug level without antibodies: Under-dosing (increase dose)\nLow level with anti-drug antibodies: Immunogenicity (consider switching)\nAdequate level with active disease: Drug failure (change mechanism)","src":"t"},{"aka":"ADAMTS13","expl":"Measures the activity of ADAMTS13, the enzyme that cleaves von Willebrand factor, and looks for an inhibitor against it. Severely low activity confirms thrombotic thrombocytopenic purpura (TTP).","abn":"Severely decreased activity (<10%): Acquired TTP (with inhibitor); Congenital TTP (Upshaw-Schulman syndrome)\nMildly decreased: Sepsis; Liver disease; Pregnancy; DIC","src":"t"},{"aka":"ADA","expl":"Measures adenosine deaminase, an enzyme from activated lymphocytes. In pleural, peritoneal, pericardial fluid or CSF a high level supports tuberculosis; in blood, low activity diagnoses ADA-deficiency severe combined immunodeficiency.","abn":"Increased in fluids: Tuberculous pleuritis, peritonitis, pericarditis or meningitis; Empyema; Lymphoma\nDecreased in blood: ADA-deficiency SCID","src":"t"},{"aka":"Specific IgE, RAST","expl":"Measures IgE antibodies to a single allergen (a food, pollen, animal or other source). A positive result shows sensitisation and must be read with the clinical history to confirm allergy.","abn":"Increased levels: Sensitisation or allergy to the allergen tested","src":"t"},{"aka":"Faecal alpha-1 antitrypsin","expl":"Measures alpha-1 antitrypsin in stool. Because it resists digestion, a high level shows protein leaking into the gut (protein-losing enteropathy).","abn":"Increased levels: Protein-losing enteropathy; Inflammatory bowel disease; Intestinal lymphangiectasia; Coeliac disease","src":"t"},{"aka":"A2M","expl":"Measures alpha-2 macroglobulin, a large plasma protein that inhibits proteases. Levels rise in nephrotic syndrome and liver fibrosis, and it is part of some liver fibrosis scores.","abn":"Increased levels: Nephrotic syndrome; Liver fibrosis or cirrhosis; Diabetes; Pregnancy or oestrogen use\nDecreased levels: Acute pancreatitis; DIC; Fibrinolytic therapy","src":"t"},{"aka":"α2-antiplasmin","expl":"Measures alpha-2 antiplasmin, the main natural inhibitor of plasmin that protects clots from breaking down too early. Deficiency causes a bleeding tendency.","abn":"Decreased levels: Congenital alpha-2 antiplasmin deficiency; Liver disease; DIC; Thrombolytic therapy","src":"t"},{"aka":"Alpha-galactosidase A, Lyso-Gb3, Gb3","expl":"Measures the enzyme alpha-galactosidase A or the substances that build up when it is missing (globotriaosylceramide and lyso-Gb3). These tests diagnose and monitor Fabry disease, an inherited storage disorder affecting the kidneys, heart and nerves.","abn":"Low enzyme activity / raised Gb3 or lyso-Gb3: Fabry disease (enzyme testing can miss affected females)","src":"t"},{"aka":"Amiodarone","expl":"Measures amiodarone (and its metabolite desethylamiodarone), an antiarrhythmic drug with a long half-life. Levels help check adherence and investigate toxicity, such as thyroid, lung or liver effects.","abn":"Above range: Risk of toxicity\nBelow range: Under-dosing or poor adherence","src":"t"},{"aka":"Tricyclic antidepressant levels","expl":"Measures tricyclic antidepressants (such as amitriptyline, nortriptyline, imipramine and desipramine) and their active metabolites. It guides dosing and detects overdose, which can cause dangerous heart rhythm problems and seizures.","abn":"Above range: Toxicity (arrhythmias, seizures, anticholinergic effects)\nBelow range: Under-dosing, poor adherence or rapid metabolism","src":"t"},{"aka":"SAA","expl":"Measures serum amyloid A, an acute-phase protein made by the liver during inflammation. Persistently high levels can lead to AA amyloidosis, so it is used to monitor chronic inflammatory diseases.","abn":"Increased levels: Acute infection or inflammation; Chronic inflammatory disease (e.g., familial Mediterranean fever, rheumatoid arthritis); Risk of AA amyloidosis","src":"t"},{"aka":"ANA IFA, ANA titre","expl":"Detects antinuclear antibodies by immunofluorescence and reports the highest dilution (titre) and staining pattern. A positive result supports autoimmune connective tissue disease, and further specific antibody tests identify which.","abn":"Positive result: Systemic lupus erythematosus; Sjögren syndrome; Systemic sclerosis; Mixed connective tissue disease; Autoimmune hepatitis; Low titres in healthy people and the elderly","src":"t"},{"aka":"Anaerobic culture","expl":"Grows bacteria that only survive without oxygen from samples such as abscess pus, sterile fluids and tissue. Anaerobes often cause deep abscesses and mixed infections.","abn":"Positive culture: Abscess (abdominal, pelvic, lung, brain); Peritonitis; Aspiration pneumonia; Necrotising soft tissue infection","src":"t"},{"aka":"HLA antibodies, DSA, PRA","expl":"Detects antibodies against HLA (tissue-type) antigens and identifies which ones, including donor-specific antibodies and the panel-reactive antibody level, and the flow crossmatch tests the patient against donor cells. These tests assess transplant compatibility and monitor for antibody-mediated rejection.","abn":"Positive result: Sensitisation from pregnancy, transfusion or previous transplant; Antibody-mediated rejection; Positive crossmatch (higher rejection risk)","src":"t"},{"aka":"Anti-MuSK","expl":"Detects antibodies to muscle-specific kinase. They are found in some patients with myasthenia gravis who are negative for acetylcholine receptor antibodies.","abn":"Positive result: MuSK myasthenia gravis","src":"t"},{"aka":"ASO, Anti-DNase B, Anti-hyaluronidase","expl":"Measures antibodies to streptococcal products such as streptolysin O and hyaluronidase. Raised or rising levels show recent group A streptococcal infection and support the diagnosis of rheumatic fever or post-streptococcal glomerulonephritis.","abn":"Increased levels: Recent streptococcal pharyngitis or skin infection; Acute rheumatic fever; Post-streptococcal glomerulonephritis","src":"t"},{"aka":"Apo A1, Apo B, Apo B/A1 ratio","expl":"Measures the main proteins of HDL (apolipoprotein A1) and of LDL and other atherogenic particles (apolipoprotein B). Apo B and the Apo B/A1 ratio estimate cardiovascular risk, especially when triglycerides are high.","abn":"Increased Apo B or B/A1 ratio: Increased cardiovascular risk; Familial combined
